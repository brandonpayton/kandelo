name: Force rebuild

# Maintainer-triggered exact-main producer for the durable binaries release.
# It source-builds the requested root closure after those sources land on main;
# PR and synthetic-merge artifacts are never promoted through this path.
#
# Flow (see docs/plans/2026-05-13-binary-resolution-via-index-ledger-design.md):
#   * targets the undated `binaries-abi-v<N>` tag (per-archive uploads),
#   * expands listed roots to their complete buildable dependency closure,
#   * partitions that closure into explicit topological levels,
#   * builds each level in parallel while requiring every dependency edge to
#     consume the prior level's same-run exact-main archive,
#   * each matrix entry publishes its archive AND updates
#     index.toml atomically via scripts/index-update.sh under the
#     workflow-level state-lock subject for the target tag,
#   * gates on the test-suite, then
#   * seals and publishes a newly initialized immutable ABI release once the
#     complete selected closure succeeds.
#
# No bot PR is opened (the prior amend-package-toml flow is retired):
# the index.toml ledger on the release IS the consumer-visible state
# post binary-resolution-via-index-ledger.
#
# Inputs (rendered in the GitHub Actions "Run workflow" modal):
#   packages       — `all` (default) or a comma-separated list of
#                    package.toml names (e.g. `php,mariadb`). `all`
#                    selects every library + program manifest; a list
#                    selects those roots plus their transitive buildable
#                    dependencies.
#   arches         — comma-separated subset of `wasm32,wasm64`
#                    (default: both) for selected roots. Dependency arch
#                    fallback remains graph-owned (for example a wasm64
#                    root may require a wasm32-only dependency).
#   ref            — optional exact lowercase SHA of the current
#                    `refs/heads/main` commit. Empty uses the workflow
#                    dispatch SHA. Branches, tags, pull-request refs,
#                    ancestors, descendants, and equal-tree commits are
#                    rejected because this workflow mutates the canonical
#                    `binaries-abi-v<N>` release.
#   skip_tests     — when true, publishes without running the test
#                    suites. Defaults to false (tests must pass before
#                    publish). workflow_dispatch is maintainer-only,
#                    so this is treated as deliberate.
#   bump_packages  — DEPRECATED no-op. Post
#                    binary-resolution-via-index-ledger there is no
#                    bot PR to open (the index.toml ledger IS the
#                    consumer-visible state; package.toml carries no
#                    [binary] URLs to amend). Accepted for
#                    workflow_dispatch back-compat; ignored.
#
# Force-rebuild and prepare-merge can run simultaneously: each
# matrix-build entry acquires the same per-target-tag state-lock
# subject via scripts/index-update.sh, so per-package index updates
# serialize correctly even with both workflows in flight.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated root package names, or `all`. The exact-main build includes their transitive buildable dependencies.'
        required: false
        default: 'all'
        type: string
      arches:
        description: 'Comma-separated arch list. Subset of wasm32,wasm64.'
        required: false
        default: 'wasm32,wasm64'
        type: string
      ref:
        description: 'Optional exact lowercase SHA of the current main commit. Empty uses the workflow dispatch SHA; other refs are rejected.'
        required: false
        default: ''
        type: string
      skip_tests:
        description: 'Publish without running the test suites. Use with care — durable releases normally gate on tests.'
        required: false
        default: false
        type: boolean
      bump_packages:
        description: 'After publish, open a bot PR amending each rebuilt package.toml. Disable for diagnostic-only rebuilds.'
        required: false
        default: true
        type: boolean

# Keep the six-suite materialization surface identical to staging-build and
# prepare-merge. The structural workflow contract test rejects drift between
# these three declarations.
env:
  PACKAGE_STAGING_EXCLUSIONS: erlang-vfs,perl,perl-vfs,python-vfs,redis,texlive

jobs:
  # ---------------------------------------------------------------------
  # gate — input validation. Lightweight and cheap so a malformed
  # workflow_dispatch payload fails before we burn matrix-build compute.
  # No PR-context gates (this is a maintainer-triggered workflow, not a
  # label event), so no review-state / required-checks / staging-build
  # waits like prepare-merge.yml has.
  # ---------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Resolve inputs + validate
        id: resolve
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
          INPUT_ARCHES: ${{ inputs.arches }}
          INPUT_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [ "${{ github.repository }}" = "Automattic/kandelo" ] || {
            echo "::error::canonical package rebuilds require Automattic/kandelo"
            exit 1
          }
          [ "${{ github.ref }}" = "refs/heads/main" ] || {
            echo "::error::canonical package rebuilds must be dispatched from refs/heads/main"
            exit 1
          }
          [ "${{ github.workflow_ref }}" = "Automattic/kandelo/.github/workflows/force-rebuild.yml@refs/heads/main" ] || {
            echo "::error::canonical package rebuilds require the reviewed workflow on main"
            exit 1
          }

          SOURCE_SHA="${INPUT_REF:-${{ github.sha }}}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::ref must be empty or the exact lowercase 40-character main SHA"
            exit 1
          }
          [ "$SOURCE_SHA" = "${{ github.sha }}" ] || {
            echo "::error::ref must equal the workflow dispatch commit"
            exit 1
          }
          main_sha="$(gh api /repos/Automattic/kandelo/git/ref/heads/main --jq .object.sha)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::refs/heads/main returned a noncanonical commit identity"
            exit 1
          }
          # WHY: graph reachability and equal trees do not prove that these
          # exact archive bytes were built after their source landed.
          [ "$SOURCE_SHA" = "$main_sha" ] || {
            echo "::error::canonical package rebuild source must equal the live refs/heads/main commit"
            exit 1
          }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          # Validate `packages`: non-empty.
          if [ -z "$INPUT_PACKAGES" ]; then
            echo "::error::packages input is empty; expected `all` or a comma-separated list."
            exit 1
          fi

          # Validate `arches`: each entry must be wasm32 or wasm64.
          IFS=',' read -ra arr <<< "$INPUT_ARCHES"
          if [ "${#arr[@]}" -eq 0 ]; then
            echo "::error::arches input is empty; expected comma-separated subset of wasm32,wasm64."
            exit 1
          fi
          for a in "${arr[@]}"; do
            a="${a#"${a%%[![:space:]]*}"}"
            a="${a%"${a##*[![:space:]]}"}"
            case "$a" in
              wasm32|wasm64) ;;
              *) echo "::error::invalid arch \"$a\" (expected wasm32 or wasm64)."; exit 1 ;;
            esac
          done

          echo "force-rebuild gate ok: source_sha=$SOURCE_SHA packages=$INPUT_PACKAGES arches=$INPUT_ARCHES skip_tests=${{ inputs.skip_tests }} bump_packages=${{ inputs.bump_packages }}"

  # ---------------------------------------------------------------------
  # Per-package matrix flow.
  #
  # Preflight computes the selected closure once. Fixed workflow jobs consume
  # its bounded dependency levels through one shared composite action, avoiding
  # both source duplication and scheduler-order assumptions.
  # ---------------------------------------------------------------------

  preflight:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_matrix: ${{ steps.compute.outputs.package_matrix }}
      level_0_matrix: ${{ steps.compute.outputs.level_0_matrix }}
      level_1_matrix: ${{ steps.compute.outputs.level_1_matrix }}
      level_2_matrix: ${{ steps.compute.outputs.level_2_matrix }}
      level_3_matrix: ${{ steps.compute.outputs.level_3_matrix }}
      level_4_matrix: ${{ steps.compute.outputs.level_4_matrix }}
      level_5_matrix: ${{ steps.compute.outputs.level_5_matrix }}
      level_6_matrix: ${{ steps.compute.outputs.level_6_matrix }}
      level_7_matrix: ${{ steps.compute.outputs.level_7_matrix }}
      abi: ${{ steps.compute.outputs.abi }}
      target_tag: ${{ steps.compute.outputs.target_tag }}
      expected_ledger_artifact: ${{ steps.compute.outputs.expected_ledger_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}

      - name: Verify exact-main preflight source
        run: |
          [ "$(git rev-parse HEAD)" = "${{ needs.gate.outputs.source_sha }}" ] || {
            echo "::error::preflight checkout differs from the admitted main commit"
            exit 1
          }

      - name: Fetch musl submodule
        # Hardened submodule fetch via the reusable action (PR #435).
        # preflight only needs musl (it builds xtask and computes the
        # matrix; tests/libc/libc-test and tests/sortix/os-test materialize in matrix-build /
        # test-gate via their own checkouts). Per-target-tag locking
        # happens inside `scripts/index-update.sh` (state-lock around
        # the index.toml mutation).
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: libc/musl

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Warm Nix dev shell
        run: bash scripts/dev-shell.sh true

      - name: Cache xtask build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: preflight-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/xtask/**') }}
          restore-keys: |
            preflight-${{ runner.os }}-

      - name: Build xtask
        run: |
          bash scripts/dev-shell.sh bash -c '
            HOST_TARGET=$(rustc -vV | awk "/^host/ {print \$2}")
            cargo build --release -p xtask --target "$HOST_TARGET"
          '

      - name: Compute exact-main dependency closure
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PACKAGES: ${{ inputs.packages }}
          INPUT_ARCHES: ${{ inputs.arches }}
          INPUT_SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          bash scripts/dev-shell.sh env \
            PACKAGE_STAGING_EXCLUSIONS="$PACKAGE_STAGING_EXCLUSIONS" \
            SKIP_TESTS="$INPUT_SKIP_TESTS" \
            bash -c '
            set -euo pipefail

            ABI=$(grep -oE "ABI_VERSION: u32 = [0-9]+" crates/shared/src/lib.rs | awk "{print \$4}")
            echo "abi=$ABI" >> "$GITHUB_OUTPUT"

            # force-rebuild always targets the durable, undated tag.
            # Same target as prepare-merge.yml — both serialise on the
            # durable-release-lock so they can never publish at the
            # same moment.
            TARGET_TAG="binaries-abi-v${ABI}"
            echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
            EXPECTED_LEDGER_ARTIFACT="force-rebuild-expected-ledger-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
            echo "expected_ledger_artifact=$EXPECTED_LEDGER_ARTIFACT" >> "$GITHUB_OUTPUT"

            HOST_TARGET=$(rustc -vV | awk "/^host/ {print \$2}")
            XTASK="target/$HOST_TARGET/release/xtask"
            expected_ledger="$RUNNER_TEMP/force-rebuild-expected-ledger.json"
            blocked_report="$RUNNER_TEMP/force-rebuild-publication-blockers.json"
            required_root_args=()
            if [ "$INPUT_PACKAGES" != "all" ]; then
              required_root_args+=(--require-root "$INPUT_PACKAGES")
            fi
            # The split test suites consume the canonical rootfs. A test-gated
            # rebuild must therefore prove that rootfs and its dependency
            # closure are publication-admitted even when the rebuilt root is
            # unrelated. Deliberate skip_tests runs retain their narrower
            # producer-only admission contract.
            if [ "$SKIP_TESTS" != "true" ]; then
              required_root_args+=(--require-root rootfs)
            fi
            # WHY: the shared ledger is the publication-policy authority.
            # `all` omits pending packages and every reverse dependent; a
            # named blocked root instead fails here with its full dependency
            # chain, before any package job can mutate the canonical release.
            "$XTASK" staging-reuse expected \
              --registry packages/registry \
              --expected-abi "$ABI" \
              --exclude "$PACKAGE_STAGING_EXCLUSIONS" \
              "${required_root_args[@]}" \
              --output "$expected_ledger" \
              --blocked-output "$blocked_report"
            all_matrix=$(jq -c \
              "[.entries[] | {package, arch, sha: .cache_key_sha, version, revision}]" \
              "$expected_ledger")

            all_matrix_file=$(mktemp)
            printf "%s" "$all_matrix" > "$all_matrix_file"
            levels=$(cargo run --release -p xtask --target "$HOST_TARGET" --quiet -- \
              partition-package-matrix \
                --registry packages/registry \
                --matrix "$all_matrix_file" \
                --roots "$INPUT_PACKAGES" \
                --root-arches "$INPUT_ARCHES")
            rm -f "$all_matrix_file"

            level_count=$(jq length <<<"$levels")
            if [ "$level_count" -gt 8 ]; then
              echo "::error::selected package closure requires $level_count dependency levels; workflow supports 8"
              exit 1
            fi
            package_matrix=$(jq -c "[.[] | .[]]" <<<"$levels")
            echo "package_matrix=$package_matrix" >> "$GITHUB_OUTPUT"
            for level in $(seq 0 7); do
              matrix=$(jq -c ".[$level] // []" <<<"$levels")
              echo "level_${level}_matrix=$matrix" >> "$GITHUB_OUTPUT"
              echo "preflight: level $level has $(jq length <<<"$matrix") packages"
              jq . <<<"$matrix"
            done
          '

      - name: Upload exact-main expected ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.compute.outputs.expected_ledger_artifact }}
          path: |
            ${{ runner.temp }}/force-rebuild-expected-ledger.json
            ${{ runner.temp }}/force-rebuild-publication-blockers.json
          retention-days: 1
          if-no-files-found: error

  toolchain-cache:
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}

      - name: Verify exact-main toolchain source
        run: |
          [ "$(git rev-parse HEAD)" = "${{ needs.gate.outputs.source_sha }}" ] || {
            echo "::error::toolchain checkout differs from the admitted main commit"
            exit 1
          }

      - name: Fetch musl submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 libc/musl

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Check libcxx LLVM version
        run: bash scripts/dev-shell.sh bash scripts/check-libcxx-toolchain-version.sh

      - name: Compute cache key
        # WHY: a cache-equivalent libcxx built at an older commit is valid for
        # ordinary consumers but cannot substantiate an exact-main closure.
        id: key
        run: |
          KEY="exact-main-sysroot-v1-${{ runner.os }}-${{ needs.gate.outputs.source_sha }}-${{ hashFiles('scripts/build-musl.sh', 'packages/registry/libcxx/**', 'libc/musl-overlay/**', 'libc/glue/**') }}"
          echo "value=$KEY" >> "$GITHUB_OUTPUT"
          echo "toolchain-cache key: $KEY"

      - name: Cache musl sysroot + libc++
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            sysroot
            sysroot64
          key: ${{ steps.key.outputs.value }}

      - name: Build sysroots if cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/dev-shell.sh bash scripts/build-musl.sh
          bash scripts/dev-shell.sh bash scripts/build-musl.sh --arch wasm64posix
          bash scripts/dev-shell.sh bash -c '
            set -euo pipefail
            HOST_TARGET="$(rustc -vV | awk "/^host/ {print \$2}")"
            for arch in wasm32 wasm64; do
              cargo run -p xtask --target "$HOST_TARGET" --quiet -- \
                build-deps resolve libcxx --arch "$arch" --force-source-build
              prefix="$(cargo run -p xtask --target "$HOST_TARGET" --quiet -- \
                build-deps path libcxx --arch "$arch")"
              if [ "$arch" = "wasm64" ]; then sysroot="sysroot64"; else sysroot="sysroot"; fi
              mkdir -p "$sysroot/lib" "$sysroot/include/c++"
              install -m 0644 "$prefix/lib/libc++.a" "$sysroot/lib/libc++.a"
              install -m 0644 "$prefix/lib/libc++abi.a" "$sysroot/lib/libc++abi.a"
              rm -rf "$sysroot/include/c++/v1"
              cp -a "$prefix/include/c++/v1" "$sysroot/include/c++/v1"
            done
          '

      - name: Build fork-instrument host tool
        run: bash scripts/dev-shell.sh bash scripts/build-fork-instrument-tool.sh

      - name: Pack toolchain sysroots + host tools
        run: |
          tar --zstd -cf "$RUNNER_TEMP/toolchain-sysroots.tar.zst" \
            sysroot sysroot64 tools/bin/wasm-fork-instrument

      - name: Upload toolchain sysroots artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-sysroots
          path: ${{ runner.temp }}/toolchain-sysroots.tar.zst
          retention-days: 1
          if-no-files-found: error

  # GitHub does not promise matrix scheduling order. Split the selected graph
  # into explicit topological levels so a runner-concurrency cap cannot start
  # dependents that occupy every slot while their producers remain queued.
  # Members within one level retain full concurrency.
  matrix-build-level-0:
    needs: [gate, preflight, toolchain-cache]
    if: needs.preflight.outputs.level_0_matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.target_tag }}/index.toml
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.level_0_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: ./.github/actions/exact-main-package-rebuild
        with:
          source-sha: ${{ needs.gate.outputs.source_sha }}
          target-tag: ${{ needs.preflight.outputs.target_tag }}
          package-matrix: ${{ needs.preflight.outputs.package_matrix }}
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          cache-key-sha: ${{ matrix.sha }}
          version: ${{ matrix.version }}
          revision: ${{ matrix.revision }}

  matrix-build-level-1:
    needs: [gate, preflight, toolchain-cache, matrix-build-level-0]
    if: ${{ !cancelled() && needs.matrix-build-level-0.result == 'success' && needs.preflight.outputs.level_1_matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.target_tag }}/index.toml
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.level_1_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: ./.github/actions/exact-main-package-rebuild
        with:
          source-sha: ${{ needs.gate.outputs.source_sha }}
          target-tag: ${{ needs.preflight.outputs.target_tag }}
          package-matrix: ${{ needs.preflight.outputs.package_matrix }}
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          cache-key-sha: ${{ matrix.sha }}
          version: ${{ matrix.version }}
          revision: ${{ matrix.revision }}

  matrix-build-level-2:
    needs: [gate, preflight, toolchain-cache, matrix-build-level-1]
    if: ${{ !cancelled() && needs.matrix-build-level-1.result == 'success' && needs.preflight.outputs.level_2_matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.target_tag }}/index.toml
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.level_2_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: ./.github/actions/exact-main-package-rebuild
        with:
          source-sha: ${{ needs.gate.outputs.source_sha }}
          target-tag: ${{ needs.preflight.outputs.target_tag }}
          package-matrix: ${{ needs.preflight.outputs.package_matrix }}
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          cache-key-sha: ${{ matrix.sha }}
          version: ${{ matrix.version }}
          revision: ${{ matrix.revision }}

  matrix-build-level-3:
    needs: [gate, preflight, toolchain-cache, matrix-build-level-2]
    if: ${{ !cancelled() && needs.matrix-build-level-2.result == 'success' && needs.preflight.outputs.level_3_matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.target_tag }}/index.toml
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.level_3_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: ./.github/actions/exact-main-package-rebuild
        with:
          source-sha: ${{ needs.gate.outputs.source_sha }}
          target-tag: ${{ needs.preflight.outputs.target_tag }}
          package-matrix: ${{ needs.preflight.outputs.package_matrix }}
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          cache-key-sha: ${{ matrix.sha }}
          version: ${{ matrix.version }}
          revision: ${{ matrix.revision }}

  matrix-build-level-4:
    needs: [gate, preflight, toolchain-cache, matrix-build-level-3]
    if: ${{ !cancelled() && needs.matrix-build-level-3.result == 'success' && needs.preflight.outputs.level_4_matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.target_tag }}/index.toml
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.level_4_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: ./.github/actions/exact-main-package-rebuild
        with:
          source-sha: ${{ needs.gate.outputs.source_sha }}
          target-tag: ${{ needs.preflight.outputs.target_tag }}
          package-matrix: ${{ needs.preflight.outputs.package_matrix }}
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          cache-key-sha: ${{ matrix.sha }}
          version: ${{ matrix.version }}
          revision: ${{ matrix.revision }}

  matrix-build-level-5:
    needs: [gate, preflight, toolchain-cache, matrix-build-level-4]
    if: ${{ !cancelled() && needs.matrix-build-level-4.result == 'success' && needs.preflight.outputs.level_5_matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.target_tag }}/index.toml
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.level_5_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: ./.github/actions/exact-main-package-rebuild
        with:
          source-sha: ${{ needs.gate.outputs.source_sha }}
          target-tag: ${{ needs.preflight.outputs.target_tag }}
          package-matrix: ${{ needs.preflight.outputs.package_matrix }}
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          cache-key-sha: ${{ matrix.sha }}
          version: ${{ matrix.version }}
          revision: ${{ matrix.revision }}

  matrix-build-level-6:
    needs: [gate, preflight, toolchain-cache, matrix-build-level-5]
    if: ${{ !cancelled() && needs.matrix-build-level-5.result == 'success' && needs.preflight.outputs.level_6_matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.target_tag }}/index.toml
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.level_6_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: ./.github/actions/exact-main-package-rebuild
        with:
          source-sha: ${{ needs.gate.outputs.source_sha }}
          target-tag: ${{ needs.preflight.outputs.target_tag }}
          package-matrix: ${{ needs.preflight.outputs.package_matrix }}
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          cache-key-sha: ${{ matrix.sha }}
          version: ${{ matrix.version }}
          revision: ${{ matrix.revision }}

  matrix-build-level-7:
    needs: [gate, preflight, toolchain-cache, matrix-build-level-6]
    if: ${{ !cancelled() && needs.matrix-build-level-6.result == 'success' && needs.preflight.outputs.level_7_matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.target_tag }}/index.toml
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.level_7_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: ./.github/actions/exact-main-package-rebuild
        with:
          source-sha: ${{ needs.gate.outputs.source_sha }}
          target-tag: ${{ needs.preflight.outputs.target_tag }}
          package-matrix: ${{ needs.preflight.outputs.package_matrix }}
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          cache-key-sha: ${{ matrix.sha }}
          version: ${{ matrix.version }}
          revision: ${{ matrix.revision }}

  test-gate-prepare:
    needs:
      - gate
      - preflight
      - toolchain-cache
      - matrix-build-level-0
      - matrix-build-level-1
      - matrix-build-level-2
      - matrix-build-level-3
      - matrix-build-level-4
      - matrix-build-level-5
      - matrix-build-level-6
      - matrix-build-level-7
    # Skip when both matrices are empty (nothing rebuilt) or
    # skip_tests=true. `!cancelled()` so a fail-fast in matrix-build
    # doesn't silently skip test preparation for sibling packages that
    # did succeed.
    if: |
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      needs.preflight.outputs.package_matrix != '[]' &&
      inputs.skip_tests != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.target_tag }}/index.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}

      - name: Fetch submodules (musl, libc-test, os-test)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 libc/musl tests/libc/libc-test tests/sortix/os-test

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Download toolchain sysroots artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolchain-sysroots
          path: ${{ runner.temp }}/toolchain

      - name: Extract toolchain sysroots
        run: |
          tar --zstd -xf "$RUNNER_TEMP/toolchain/toolchain-sysroots.tar.zst"

      - name: Download matrix artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-wasm*'
          path: ${{ runner.temp }}/staged-archives

      - name: Download exact-main expected ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.expected_ledger_artifact }}
          path: ${{ runner.temp }}/force-rebuild-expected

      - name: Install host npm deps (resolver prereq)
        # Must run before Materialize binaries (see staging-build.yml).
        run: |
          bash scripts/dev-shell.sh bash -c '
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
            cd host && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
          '

      - name: Typecheck host package
        run: |
          bash scripts/dev-shell.sh bash -c '
            cd host && npm run typecheck
          '

      - name: Materialize binaries (per-package package.pr.toml overlay)
        # Walk downloaded matrix artifacts (lib + prog) via the shared
        # script, then consume the exact publication-policy ledger computed by
        # preflight. Selected matrix entries resolve via file:// overlays and
        # unchanged entries resolve from the durable index. Fetch-only keeps a
        # missing or stale archive visible instead of source-building an
        # unrelated registry root inside the test gate.
        env:
          WASM_POSIX_FETCH_SKIP_PKGS: cpython erlang erlang-vfs perl perl-vfs python-vfs redis texlive
        run: |
          bash scripts/dev-shell.sh bash -c '
            set -euo pipefail
            STAGE="$RUNNER_TEMP/staged-overlay"
            EXPECTED="$RUNNER_TEMP/force-rebuild-expected/force-rebuild-expected-ledger.json"
            bash scripts/materialize-pr-overlays.sh "$RUNNER_TEMP/staged-archives" "$STAGE"
            bash scripts/fetch-binaries.sh \
              --fetch-only \
              --expected-ledger "$EXPECTED"
          '

      - name: Build kernel + test programs + install host deps
        run: |
          bash scripts/dev-shell.sh bash -c '
            set -euo pipefail
            cargo build --release -p kandelo \
              -Z build-std=core,alloc
            # WHY: this is a package-owned resolver mirror. Install the exact
            # candidate into an immutable local generation so later dependency
            # resolution cannot substitute released kernel bytes.
            source scripts/install-local-binary.sh
            WASM_POSIX_LOCAL_INSTALL_SESSION="ci-kernel-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}" \
              install_local_binary kernel \
                target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
                kandelo-kernel.wasm
            cmp target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
              local-binaries/kernel.wasm
            bash scripts/build-programs.sh
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
            cd host && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund && cd ..
            bash scripts/build-rootfs.sh
          '

      - name: Pack prepared test workspace
        run: |
          bash scripts/pack-ci-test-workspace.sh "$RUNNER_TEMP/test-workspace.tar.zst"

      - name: Upload prepared test workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-workspace
          path: ${{ runner.temp }}/test-workspace.tar.zst
          retention-days: 1
          if-no-files-found: error

  test-suite:
    name: test-suite (${{ matrix.label }})
    needs: [gate, test-gate-prepare]
    if: |
      !cancelled() &&
      needs.test-gate-prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      # WHY: Vitest's two ordinary shards plus its resource-isolated cases,
      # libc's two groups, and Sortix's three groups partition their complete
      # suites exactly once. Separate matrix cells bound runner memory and
      # remove serial work while `test-gate` still aggregates every cell.
      matrix:
        include:
          - suite: cargo-workspace
            label: cargo-workspace
            group: all
            # Cover every workspace crate except independently gated xtask.
            # New crates are included without another matrix allow-list edit.
            needs_submodules: false
            needs_toolchain: false
            needs_workspace: false
          - suite: cargo-xtask
            label: cargo-xtask
            group: all
            needs_submodules: false
            needs_toolchain: false
            needs_workspace: false
          - suite: vitest
            label: vitest (1/2)
            group: 1/2
            needs_submodules: false
            needs_toolchain: true
            needs_workspace: true
          - suite: vitest
            label: vitest (2/2)
            group: 2/2
            needs_submodules: false
            needs_toolchain: true
            needs_workspace: true
          - suite: vitest
            label: vitest (resource-isolated)
            group: resource-isolated
            needs_submodules: false
            needs_toolchain: true
            needs_workspace: true
          - suite: libc
            label: libc (functional + regression)
            group: functional-regression
            needs_submodules: true
            needs_toolchain: true
            needs_workspace: true
          - suite: libc
            label: libc (math)
            group: math
            needs_submodules: true
            needs_toolchain: true
            needs_workspace: true
          - suite: posix
            label: posix
            group: all
            needs_submodules: false
            needs_toolchain: true
            needs_workspace: true
          - suite: sortix
            label: sortix (include)
            group: include
            needs_submodules: true
            needs_toolchain: true
            needs_workspace: true
          - suite: sortix
            label: sortix (basic)
            group: basic
            needs_submodules: true
            needs_toolchain: true
            needs_workspace: true
          - suite: sortix
            label: sortix (runtime)
            group: runtime
            needs_submodules: true
            needs_toolchain: true
            needs_workspace: true
    env:
      SUITE: ${{ matrix.suite }}
      TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}

      - name: Fetch submodules (musl, libc-test, os-test)
        if: matrix.needs_submodules == true
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 libc/musl tests/libc/libc-test tests/sortix/os-test

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Download toolchain sysroots artifact
        if: matrix.needs_toolchain == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolchain-sysroots
          path: ${{ runner.temp }}/toolchain

      - name: Extract toolchain sysroots
        if: matrix.needs_toolchain == true
        run: |
          tar --zstd -xf "$RUNNER_TEMP/toolchain/toolchain-sysroots.tar.zst"

      - name: Download prepared test workspace
        if: matrix.needs_workspace == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-workspace
          path: ${{ runner.temp }}/test-workspace

      - name: Extract prepared test workspace
        if: matrix.needs_workspace == true
        run: |
          tar --zstd -xf "$RUNNER_TEMP/test-workspace/test-workspace.tar.zst"

      - name: Run ${{ matrix.label }} suite
        # Pass the group positionally across dev-shell.sh's
        # `--ignore-environment` boundary so no shard silently defaults to all.
        run: |
          bash scripts/dev-shell.sh bash scripts/ci-run-test-suite.sh "$SUITE" "$TEST_GROUP"

  test-gate:
    needs: [test-gate-prepare, test-suite]
    if: |
      always() &&
      !cancelled() &&
      needs.test-gate-prepare.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Check split test suites
        env:
          PREPARE_RESULT: ${{ needs.test-gate-prepare.result }}
          TEST_SUITE_RESULT: ${{ needs.test-suite.result }}
        run: |
          set -euo pipefail
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "::error::test preparation completed with result: $PREPARE_RESULT"
            exit 1
          fi
          if [ "$TEST_SUITE_RESULT" != "success" ]; then
            echo "::error::split test suites completed with result: $TEST_SUITE_RESULT"
            exit 1
          fi

  finalize-canonical-release:
    needs:
      - gate
      - preflight
      - toolchain-cache
      - matrix-build-level-0
      - matrix-build-level-1
      - matrix-build-level-2
      - matrix-build-level-3
      - matrix-build-level-4
      - matrix-build-level-5
      - matrix-build-level-6
      - matrix-build-level-7
      - test-gate
    if: |
      always() &&
      !cancelled() &&
      needs.preflight.outputs.package_matrix != '[]' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (inputs.skip_tests == true || needs.test-gate.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_TARGET_TAG: ${{ needs.preflight.outputs.target_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}

      - name: Seal and publish the exact-main canonical release
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/canonical-release-body.txt"
          empty_sentinel="$(bash scripts/release-index-state.sh sentinel)"
          printf '%s\n\nBinaries for ABI v%s' \
            "$empty_sentinel" '${{ needs.preflight.outputs.abi }}' >"$body"

          state="$RUNNER_TEMP/canonical-release-lock.env"
          export STATE_LOCK_OWNER_DETAIL="exact-main canonical finalizer"
          STATE_LOCK_STATE_FILE="$state" \
            bash .github/scripts/state-lock.sh acquire "$PACKAGE_TARGET_TAG"
          release_lock() {
            STATE_LOCK_STATE_FILE="$state" \
              bash .github/scripts/state-lock.sh release || true
          }
          trap release_lock EXIT

          bash .github/scripts/package-release-lifecycle.sh seal-publish \
            --tag "$PACKAGE_TARGET_TAG" \
            --target-commit '${{ needs.gate.outputs.source_sha }}' \
            --title "$PACKAGE_TARGET_TAG" \
            --body-file "$body" \
            --prerelease false \
            --canonical-source-sha "${{ needs.gate.outputs.source_sha }}"

  # generate-index / amend-package-toml / merge-gate-finalize — REMOVED.
  #
  # Per binary-resolution-via-index-ledger, each matrix-build entry
  # uploads its archive + mutates index.toml atomically via
  # scripts/index-update.sh. The finalizer only makes that completed draft
  # immutable; it does not aggregate or rewrite the index. There is no
  # generate-index aggregation pass, no bot-PR amend, and no merge-gate flow
  # (force-rebuild is workflow_dispatch only, not part of any PR merge path).
