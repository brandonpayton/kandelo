name: Staging cleanup

# Deletes writable PR-staging drafts when the corresponding PR closes,
# except for a merged PR explicitly labeled `retain-package-staging`, and
# deletes same-repo branches for merged `ready-to-ship` PRs unless that label
# still owns their exact source commit. The daily sweep applies the same
# staging-retention rule and classifies every merge-candidate release from
# current GitHub state. Only explicitly retained package inputs, authoritative
# ready candidates, and recent terminal-rejection evidence survive after
# merge; API uncertainty always retains evidence.
#
# See docs/plans/2026-04-29-pr-package-builds-design.md §4.3.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC
  workflow_dispatch:        # manual sweep

jobs:
  cleanup-on-close:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release cleanup helper
        if: |
          github.event.pull_request.merged != true ||
          !contains(github.event.pull_request.labels.*.name, 'retain-package-staging')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/delete-writable-release.sh
            .github/scripts/github-api-get.sh
            .github/scripts/state-lock.sh
          sparse-checkout-cone-mode: false

      - name: Retain package staging for post-merge validation
        if: |
          github.event.pull_request.merged == true &&
          contains(github.event.pull_request.labels.*.name, 'retain-package-staging')
        run: |
          # WHY: a durable package generation may validate the exact producer
          # only after that producer is reachable from main.
          echo "Keeping PR #${{ github.event.pull_request.number }} staging evidence for post-merge package validation"

      - name: Delete writable PR staging releases
        if: |
          github.event.pull_request.merged != true ||
          !contains(github.event.pull_request.labels.*.name, 'retain-package-staging')
        run: |
          set -euo pipefail
          prefix="pr-${{ github.event.pull_request.number }}-staging"
          gh api --paginate --slurp \
            "/repos/${{ github.repository }}/releases?per_page=100" \
            | jq -r --arg prefix "$prefix" '
                .[][] |
                select(.tag_name == $prefix or
                  (.tag_name | startswith($prefix + "-run-"))) |
                select(.draft == true or .immutable == false) |
                [.id, .tag_name] | @tsv
              ' \
            | while IFS=$'\t' read -r RELEASE_ID TAG; do
                bash .github/scripts/delete-writable-release.sh \
                  --release-id "$RELEASE_ID" \
                  --tag "$TAG"
              done

      - name: Delete merged ready-to-ship PR branch
        if: |
          github.event.pull_request.merged == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'ready-to-ship') &&
          !contains(github.event.pull_request.labels.*.name, 'retain-package-staging')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$HEAD_REF" ]; then
            echo "::warning::PR #$PR_NUMBER has no head ref; skipping branch cleanup"
            exit 0
          fi

          if [ -z "$PR_HEAD_SHA" ]; then
            echo "::warning::PR #$PR_NUMBER has no head SHA; skipping branch cleanup"
            exit 0
          fi

          if [ "$HEAD_REF" = "$DEFAULT_BRANCH" ]; then
            echo "::warning::Refusing to delete default branch $HEAD_REF for PR #$PR_NUMBER"
            exit 0
          fi

          if ! git check-ref-format --branch "$HEAD_REF" >/dev/null 2>&1; then
            echo "::warning::Refusing to delete invalid branch ref $HEAD_REF for PR #$PR_NUMBER"
            exit 0
          fi

          git init --quiet "$RUNNER_TEMP/branch-cleanup"
          cd "$RUNNER_TEMP/branch-cleanup"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          remote_sha=$(git ls-remote "$REMOTE" "refs/heads/$HEAD_REF" | awk '{print $1}')
          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" != "$PR_HEAD_SHA" ]; then
              echo "::warning::Refusing to delete branch $HEAD_REF for PR #$PR_NUMBER because it now points at $remote_sha, not merged head $PR_HEAD_SHA"
              exit 0
            fi

            if git push "$REMOTE" ":refs/heads/$HEAD_REF"; then
              echo "Deleted merged PR #$PR_NUMBER branch $HEAD_REF"
            else
              echo "::warning::Failed to delete merged PR #$PR_NUMBER branch $HEAD_REF"
            fi
          else
            echo "Merged PR #$PR_NUMBER branch $HEAD_REF is already absent"
          fi

  sweep:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/cleanup-merge-candidates.sh
            .github/scripts/classify-pr-staging.sh
            .github/scripts/delete-writable-release.sh
            .github/scripts/github-api-get.sh
            .github/scripts/latest-merge-gate-status.sh
            .github/scripts/state-lock.sh
          sparse-checkout-cone-mode: false

      - name: Sweep orphan writable PR staging tags
        run: |
          set -euo pipefail
          # Published run-specific staging releases are immutable evidence and
          # cannot be deleted. Sweep only drafts and grandfathered mutable
          # fixed tags after their PR no longer owns them.
          gh api --paginate --slurp \
              "/repos/${{ github.repository }}/releases?per_page=100" \
            | jq -r '
                .[][] |
                select(.prerelease == true) |
                select(.tag_name |
                  test("^pr-[1-9][0-9]*-staging(-run-[1-9][0-9]*-attempt-[1-9][0-9]*)?$")) |
                select(.draft == true or .immutable == false) |
                [.id, .tag_name] | @tsv
              ' \
            | while IFS=$'\t' read -r RELEASE_ID TAG; do
                PR=$(sed -nE 's/^pr-([1-9][0-9]*)-staging.*$/\1/p' <<<"$TAG")
                if [ -z "$PR" ] || ! [[ "$PR" =~ ^[0-9]+$ ]]; then
                  echo "WARN: cannot parse PR number from $TAG, skipping"
                  continue
                fi
                pr_json="$RUNNER_TEMP/pr-$PR.json"
                if ! gh pr view "$PR" --repo ${{ github.repository }} \
                    --json state,mergedAt,labels >"$pr_json"
                then
                  # WHY: an API failure cannot prove that post-merge package
                  # validation no longer owns this staging generation.
                  echo "::warning::Keeping $TAG because PR state is unavailable"
                  continue
                fi
                if ! decision=$(bash .github/scripts/classify-pr-staging.sh "$pr_json"); then
                  echo "::warning::Keeping $TAG because PR state is malformed"
                  continue
                fi
                case "$decision" in
                  retain-open)
                    echo "Keeping $TAG (PR is open)"
                    ;;
                  retain-merged)
                    echo "Keeping $TAG (merged PR retains package staging)"
                    ;;
                  delete)
                    echo "Deleting orphan $TAG"
                    bash .github/scripts/delete-writable-release.sh \
                      --release-id "$RELEASE_ID" \
                      --tag "$TAG"
                    ;;
                  *)
                    echo "::warning::Keeping $TAG because cleanup returned an unknown decision"
                    ;;
                esac
              done

      - name: Sweep completed merge-candidate releases
        run: |
          bash .github/scripts/cleanup-merge-candidates.sh \
            --max-pages 50 \
            --per-page 100 \
            --max-asset-pages 50 \
            --asset-per-page 100 \
            --rejected-retention-days 14

      - name: Sweep merged ready-to-ship PR branches
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git init --quiet "$RUNNER_TEMP/branch-cleanup"
          cd "$RUNNER_TEMP/branch-cleanup"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          delete_branch() {
            local pr_number="$1"
            local head_ref="$2"
            local expected_sha="$3"

            if [ -z "$head_ref" ]; then
              echo "::warning::PR #$pr_number has no head ref; skipping branch cleanup"
              return 0
            fi

            if [ -z "$expected_sha" ]; then
              echo "::warning::PR #$pr_number has no head SHA; skipping branch cleanup"
              return 0
            fi

            if [ "$head_ref" = "$DEFAULT_BRANCH" ]; then
              echo "::warning::Refusing to delete default branch $head_ref for PR #$pr_number"
              return 0
            fi

            if ! git check-ref-format --branch "$head_ref" >/dev/null 2>&1; then
              echo "::warning::Refusing to delete invalid branch ref $head_ref for PR #$pr_number"
              return 0
            fi

            remote_sha=$(git ls-remote "$REMOTE" "refs/heads/$head_ref" | awk '{print $1}')
            if [ -n "$remote_sha" ]; then
              if [ "$remote_sha" != "$expected_sha" ]; then
                echo "::warning::Refusing to delete branch $head_ref for PR #$pr_number because it now points at $remote_sha, not merged head $expected_sha"
                return 0
              fi

              if git push "$REMOTE" ":refs/heads/$head_ref"; then
                echo "Deleted merged PR #$pr_number branch $head_ref"
              else
                echo "::warning::Failed to delete merged PR #$pr_number branch $head_ref"
              fi
            else
              echo "Merged PR #$pr_number branch $head_ref is already absent"
            fi
          }

          gh pr list \
              --repo ${{ github.repository }} \
              --state merged \
              --base "$DEFAULT_BRANCH" \
              --label ready-to-ship \
              --limit 200 \
              --json number,headRefName,headRefOid,isCrossRepository,labels \
              -q '.[] | select(
                    .isCrossRepository == false and
                    ([.labels[].name] | index("retain-package-staging") | not)
                  ) | [.number, .headRefName, .headRefOid] | @tsv' \
            | while IFS=$'\t' read -r pr_number head_ref head_sha; do
                delete_branch "$pr_number" "$head_ref" "$head_sha"
              done
