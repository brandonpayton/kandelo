name: Prepare merge

# Triggered when a maintainer applies the `ready-to-ship` label to an
# approved PR. Captures the current base branch SHA once, synthesizes a
# PR-head-into-that-base merge commit, and drives the per-package matrix
# flow against that exact synthetic merge (preflight + toolchain-cache +
# matrix-build + test-gate; Phase B-1's pattern, targeting an isolated,
# run-specific merge-candidate release). It then posts `merge-gate=success`
# on the original PR head. A reviewer merges the PR with the selected method;
# Prepare merge never enables auto-merge. Only after GitHub confirms that exact
# tested tree merged does `activate-merge-candidate.yml` copy its
# content-addressed archives and replace the canonical ABI index once. PRs
# labeled `batched-changes` must be rebase-merged so their granular commits land
# on main. A `preserve-head-commit` PR must use a merge commit so an exact
# reviewed or published head SHA remains a parent of main. Those labels are
# mutually exclusive; all other PRs use the default squash merge behavior.
#
# Flow (see docs/plans/2026-05-05-decoupled-package-builds-design.md
# §5.5 + docs/plans/2026-04-29-pr-package-builds-design.md §4.2):
#   * snapshots `binaries-abi-v<N>/index.toml` into an isolated candidate,
#   * preflight runs against the synthetic merge commit and narrows the
#     matrix to `(package, arch)` pairs whose cache_key_sha differs from
#     what's already published in the durable release,
#   * builds each remaining pair in parallel via `xtask archive-stage`,
#     publishing each archive and index entry to that candidate, and
#   * gates the merge on the test-suite resolving from the candidate ledger.
#
# `merge-gate=success` is posted on the original PR HEAD SHA after the
# candidate-backed test gate passes against the synthetic merge commit.
# Branch protection on `main` requires this status.
#
# See:
#   docs/plans/2026-05-05-decoupled-package-builds-design.md §5.5
#   docs/plans/2026-04-29-pr-package-builds-design.md §4.2

on:
  pull_request:
    types: [labeled]

env:
  BATCHED_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'batched-changes') }}
  PRESERVE_HEAD_COMMIT: ${{ contains(github.event.pull_request.labels.*.name, 'preserve-head-commit') }}
  PREPARE_MERGE_METHOD: ${{ contains(github.event.pull_request.labels.*.name, 'preserve-head-commit') && 'merge' || contains(github.event.pull_request.labels.*.name, 'batched-changes') && 'rebase' || 'squash' }}
  PACKAGE_STAGING_EXCLUSIONS: erlang-vfs,perl,perl-vfs,python-vfs,redis,texlive
  GIT_FETCH_RETRY_FUNC: |
    git_fetch_retry() {
      local attempt=1
      local max_attempts=5
      local delay=2
      local rc

      while true; do
        if git fetch "$@"; then
          return 0
        else
          # WHY: capture the fetch status inside the conditional. After `fi`,
          # Bash reports the status of the `if` compound command, which is zero
          # when its false condition ran no branch.
          rc=$?
        fi

        if [ "$attempt" -ge "$max_attempts" ]; then
          return "$rc"
        fi

        echo "::warning::git fetch failed with exit code $rc (attempt $attempt/$max_attempts); retrying in ${delay}s" >&2
        sleep "$delay"
        attempt=$((attempt + 1))
        delay=$((delay * 2))
      done
    }

# Do not use workflow-level concurrency. GitHub Actions keeps at most
# one pending run per concurrency group, so a third ready PR cancels/
# replaces the second instead of forming a real queue. Run-specific
# candidate locks preserve every workflow run; post-merge canonical
# activations serialize on the ABI release lock.

jobs:
  # ---------------------------------------------------------------------
  # synthesize-merge — capture exactly one base SHA and synthesize the PR
  # merge commit used by every package/test job in this run.
  #
  # Do not consume GitHub's refs/pull/<N>/merge here. That ref can lag
  # behind the live base branch on pull_request:labeled events. The
  # selected base SHA below is the single base used for change scope,
  # package cache keys/builds/promotions, and test-gate. Final posting jobs
  # still re-check that the base branch has not advanced since this SHA.
  # ---------------------------------------------------------------------
  synthesize-merge:
    if: |
      github.event.label.name == 'ready-to-ship' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      base_sha: ${{ steps.synthesize.outputs.base_sha }}
      head_sha: ${{ steps.synthesize.outputs.head_sha }}
      merge_sha: ${{ steps.synthesize.outputs.merge_sha }}
      tree_sha: ${{ steps.synthesize.outputs.tree_sha }}
      pr_commit_count: ${{ steps.synthesize.outputs.pr_commit_count }}
      bundle_artifact: ${{ steps.synthesize.outputs.bundle_artifact }}
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Capture base and synthesize PR merge
        id: synthesize
        run: |
          set -euo pipefail
          # WHY: each label selects a different post-merge history proof.
          # Silently preferring one would let the operator perform the other
          # method and leave an otherwise valid candidate terminally rejected.
          if [ "$BATCHED_CHANGES" = true ] && [ "$PRESERVE_HEAD_COMMIT" = true ]; then
            echo "::error::batched-changes and preserve-head-commit are mutually exclusive"
            exit 1
          fi

          work="$RUNNER_TEMP/synthesize-merge"
          bundle_dir="$RUNNER_TEMP/synthetic-pr-merge"
          mkdir -p "$bundle_dir"

          git init --quiet "$work"
          cd "$work"
          git remote add origin "https://${{ github.token }}@github.com/${{ github.repository }}.git"

          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          BASE_SHA=$(git rev-parse "refs/remotes/origin/${BASE_REF}")

          git_fetch_retry --quiet --no-tags origin "$PR_HEAD_SHA"
          if ! git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null; then
            echo "::error::Could not fetch PR head commit $PR_HEAD_SHA"
            exit 1
          fi
          PR_COMMIT_COUNT=$(git rev-list --count "$BASE_SHA..$PR_HEAD_SHA")
          if ! [[ "$PR_COMMIT_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::PR head $PR_HEAD_SHA has no commits after prepared base $BASE_SHA"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          head_date=$(git show -s --format=%cI "$PR_HEAD_SHA")
          export GIT_AUTHOR_DATE="$head_date"
          export GIT_COMMITTER_DATE="$head_date"

          git checkout --quiet --detach "$BASE_SHA"
          set +e
          merge_output=$(git merge --no-ff --no-commit "$PR_HEAD_SHA" 2>&1)
          merge_status=$?
          set -e
          printf '%s\n' "$merge_output"
          if [ "$merge_status" -ne 0 ]; then
            echo "::error::Could not synthesize PR merge from base $BASE_SHA and head $PR_HEAD_SHA"
            exit 1
          fi

          TREE_SHA=$(git write-tree)
          MERGE_SHA=$(printf 'Synthetic prepare-merge for PR #%s\n\nBase: %s\nHead: %s\n' "$PR_NUMBER" "$BASE_SHA" "$PR_HEAD_SHA" |
            git commit-tree "$TREE_SHA" -p "$BASE_SHA" -p "$PR_HEAD_SHA")
          git update-ref refs/heads/synthesized-merge "$MERGE_SHA"

          parents=$(git show --no-patch --format=%P "$MERGE_SHA")
          actual_base=$(printf '%s\n' "$parents" | awk '{print $1}')
          actual_head=$(printf '%s\n' "$parents" | awk '{print $2}')
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi

          git bundle create "$bundle_dir/synthesized-merge.bundle" \
            refs/heads/synthesized-merge "^$BASE_SHA" "^$PR_HEAD_SHA"

          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$PR_HEAD_SHA"
            echo "merge_sha=$MERGE_SHA"
            echo "tree_sha=$TREE_SHA"
            echo "pr_commit_count=$PR_COMMIT_COUNT"
            echo "bundle_artifact=synthetic-pr-merge"
          } >> "$GITHUB_OUTPUT"
          echo "Synthetic merge $MERGE_SHA uses base $BASE_SHA and head $PR_HEAD_SHA."

      - name: Upload synthetic merge bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-pr-merge
          path: ${{ runner.temp }}/synthetic-pr-merge/synthesized-merge.bundle
          retention-days: 1
          if-no-files-found: error

      - name: Drop label + comment on synthesis failure
        if: failure()
        run: |
          gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship || true
          gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "Cannot prepare merge: prepare-merge could not synthesize and persist a merge of PR head \`$PR_HEAD_SHA\` into the current \`$BASE_REF\` base. Please rebase or merge \`$BASE_REF\` if there are conflicts, then re-apply \`ready-to-ship\`." || true

  # ---------------------------------------------------------------------
  # gate — review state + required-checks + wait-for-staging-build
  # when package staging is required.
  # All gates that must pass BEFORE we burn matrix-build compute live
  # here so a failed gate is cheap. On success, downstream jobs run.
  # ---------------------------------------------------------------------
  change-scope:
    needs: [synthesize-merge]
    if: |
      github.event.label.name == 'ready-to-ship' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kernel: ${{ steps.scope.outputs.kernel }}
      package_archive_changed: ${{ steps.scope.outputs.package_archive_changed }}
      package_publish_flow_changed: ${{ steps.scope.outputs.package_publish_flow_changed }}
      binary_materialization_changed: ${{ steps.scope.outputs.binary_materialization_changed }}
      kernel_runtime_changed: ${{ steps.scope.outputs.kernel_runtime_changed }}
      test_gate_required: ${{ steps.route.outputs.test_gate_required }}
      exact_abi_staging_applicable: ${{ steps.exact-abi.outputs.exact_abi_staging_applicable }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      package_staging_required: ${{ steps.route.outputs.package_staging_required }}
      package_staging_reason: ${{ steps.route.outputs.package_staging_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Checkout synthesized PR merge
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          if [ "$actual" != "$SYNTHETIC_MERGE_SHA" ]; then
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          fi
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          parents=$(git show --no-patch --format=%P HEAD)
          actual_base=$(printf '%s\n' "$parents" | awk '{print $1}')
          actual_head=$(printf '%s\n' "$parents" | awk '{print $2}')
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi

      - name: Detect package staging scope
        id: scope
        uses: ./.github/actions/detect-change-scope
        with:
          base-ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-base: "false"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          path: abi-staging-authority
          fetch-depth: 1

      # WHY: the protected classifier enters its own dev shell, so its build
      # tools must come from the same protected checkout rather than PR code.
      - name: Set up protected exact ABI build tools
        uses: ./abi-staging-authority/.github/actions/setup-nix

      - name: Derive protected exact ABI staging route
        id: exact-abi
        env:
          AUTHORITY_ROOT: ${{ github.workspace }}/abi-staging-authority
          EXACT_HEAD_ROOT: ${{ github.workspace }}
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          RAW_PACKAGE_STAGING_REQUIRED: ${{ steps.scope.outputs.package_staging_required }}
        run: |
          set -euo pipefail
          classifier="$AUTHORITY_ROOT/.github/scripts/classify-exact-abi-staging.sh"
          for protected_dir in \
            "$AUTHORITY_ROOT" \
            "$AUTHORITY_ROOT/.github" \
            "$AUTHORITY_ROOT/.github/scripts"
          do
            if [ -L "$protected_dir" ] || [ ! -d "$protected_dir" ]; then
              echo "::error::protected exact ABI classifier ancestor is not a real directory"
              exit 1
            fi
          done
          if [ -L "$classifier" ] || { [ -e "$classifier" ] && [ ! -f "$classifier" ]; }; then
            echo "::error::protected exact ABI classifier is not a regular file"
            exit 1
          fi
          if [ ! -e "$classifier" ]; then
            case "$RAW_PACKAGE_STAGING_REQUIRED" in
              true | false) ;;
              *)
                echo "::error::invalid protected-classifier bootstrap state"
                exit 1
                ;;
            esac
            printf '%s\n' \
              'exact_abi_staging_applicable=false' \
              "legacy_package_staging_required=$RAW_PACKAGE_STAGING_REQUIRED" \
              'exact_abi_staging_reason=protected-classifier-unavailable' \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash "$classifier" \
            --authority-root "$AUTHORITY_ROOT" \
            --exact-head-root "$EXACT_HEAD_ROOT" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --raw-package-staging-required \
              "$RAW_PACKAGE_STAGING_REQUIRED" \
            --github-output "$GITHUB_OUTPUT"

      - name: Route exact ABI staging
        id: route
        env:
          RAW_TEST_GATE_REQUIRED: ${{ steps.scope.outputs.test_gate_required }}
          RAW_PACKAGE_STAGING_REASON: ${{ steps.scope.outputs.package_staging_reason }}
          EXACT_ABI_STAGING_APPLICABLE: ${{ steps.exact-abi.outputs.exact_abi_staging_applicable }}
          LEGACY_PACKAGE_STAGING_REQUIRED: ${{ steps.exact-abi.outputs.legacy_package_staging_required }}
          EXACT_ABI_STAGING_REASON: ${{ steps.exact-abi.outputs.exact_abi_staging_reason }}
        run: |
          set -euo pipefail
          for state in \
            "$RAW_TEST_GATE_REQUIRED" \
            "$EXACT_ABI_STAGING_APPLICABLE" \
            "$LEGACY_PACKAGE_STAGING_REQUIRED"
          do
            case "$state" in
              true | false) ;;
              *)
                echo "::error::invalid staging scope state: $state"
                exit 1
                ;;
            esac
          done
          if [ "$EXACT_ABI_STAGING_APPLICABLE" = true ]; then
            [ "$LEGACY_PACKAGE_STAGING_REQUIRED" = false ]
            {
              echo "package_staging_required=false"
              echo "test_gate_required=true"
              echo "package_staging_reason=$EXACT_ABI_STAGING_REASON"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "package_staging_required=$LEGACY_PACKAGE_STAGING_REQUIRED"
              echo "test_gate_required=$RAW_TEST_GATE_REQUIRED"
              echo "package_staging_reason=$RAW_PACKAGE_STAGING_REASON"
            } >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: [synthesize-merge, change-scope]
    if: |
      github.event.label.name == 'ready-to-ship' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read # gh run list/watch for staging-build
      checks: read # gh pr checks reads check runs
      contents: read # gh pr view/checks repository metadata
      pull-requests: write # drop label / comment on failure
      statuses: read
    outputs:
      staging_run_id: ${{ steps.staging.outputs.run_id }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Approval verification executes trusted base-branch code, never helper
      # code supplied by the pull request receiving the write-capable token.
      - name: Checkout approval verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          sparse-checkout: .github/scripts/require-exact-head-approval.sh
          sparse-checkout-cone-mode: false

      - name: Verify PR authorization state + required checks green
        id: gate
        env:
          READY_TO_SHIP_ACTOR: ${{ github.event.sender.login }}
        run: |
          gh_retry() {
            local attempt=1
            local max_attempts=4
            local delay=2
            local stdout_file
            local stderr_file
            local rc

            stdout_file="$(mktemp)"
            stderr_file="$(mktemp)"

            while true; do
              : >"$stdout_file"
              : >"$stderr_file"

              if "$@" >"$stdout_file" 2>"$stderr_file"; then
                cat "$stdout_file"
                rm -f "$stdout_file" "$stderr_file"
                return 0
              else
                # WHY: capture the command status inside the conditional.
                # Reading $? after `fi` would see the successful status of the
                # `if` compound command and falsely turn exhaustion into success.
                rc=$?
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                cat "$stderr_file" >&2
                if [ -s "$stdout_file" ]; then
                  cat "$stdout_file" >&2
                fi
                rm -f "$stdout_file" "$stderr_file"
                return "$rc"
              fi

              cat "$stderr_file" >&2
              echo "::warning::GitHub command failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          if ! bash .github/scripts/require-exact-head-approval.sh \
              --pr-number "$PR_NUMBER" \
              --head-sha "$PR_HEAD_SHA" \
              --label-actor "$READY_TO_SHIP_ACTOR"
          then
            gh_retry gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship || true
            gh_retry gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "Cannot prepare merge: the exact tested PR head needs either a qualified approving review or a fresh \`ready-to-ship\` application by a repository maintainer/admin." || true
            exit 1
          fi

          # Count failing required checks. Other non-skipping checks
          # currently in flight are tolerated. Required-check failure is
          # NOT bypassable — the workflow's own post-publish tests gate the
          # merge-gate status, and bypassing pre-existing failed checks here
          # would defeat that intent.
          REQUIRED_CHECKS_ERR="$RUNNER_TEMP/required-checks.err"
          if ! FAILING=$(gh_retry gh pr checks "$PR_NUMBER" --repo ${{ github.repository }} --required --json bucket -q '[.[] | select(.bucket == "fail")] | length' 2>"$REQUIRED_CHECKS_ERR"); then
            if grep -qi "no required checks reported" "$REQUIRED_CHECKS_ERR"; then
              echo "::notice::no required checks reported yet; continuing"
              FAILING=0
            else
              cat "$REQUIRED_CHECKS_ERR" >&2
              exit 1
            fi
          fi
          if [ "$FAILING" -gt 0 ]; then
            gh_retry gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship || true
            gh_retry gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "Cannot prepare merge: $FAILING required check(s) failing." || true
            exit 1
          fi

      - name: Checkout workflow helpers
        if: |
          needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
          (needs.change-scope.outputs.package_staging_required == 'true' ||
           needs.change-scope.outputs.test_gate_required == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # WHY: this selector runs beside a write-capable token. The pull
          # request may change its future behavior, but it cannot replace the
          # verifier deciding which prior run is trusted in this execution.
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          sparse-checkout: |
            .github/scripts

      - name: Inspect staging-build on PR HEAD
        id: staging
        if: |
          needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
          (needs.change-scope.outputs.package_staging_required == 'true' ||
           needs.change-scope.outputs.test_gate_required == 'true')
        # staging-build runs the same matrix flow on every PR push.
        # If a real non-skipped staging-build exists for this HEAD,
        # respect it: wait while it is running and block if it failed.
        # If the only run is the intentionally skipped label-event run
        # produced by ready-to-ship, fall through. prepare-merge's own
        # synthetic-merge candidate preflight/matrix/test-gate below will
        # build or promote exact cache-key matches and validate the
        # merge candidate before posting merge-gate=success.
        run: |
          gh_retry() {
            local attempt=1
            local max_attempts=4
            local delay=2
            local stdout_file
            local stderr_file
            local rc

            stdout_file="$(mktemp)"
            stderr_file="$(mktemp)"

            while true; do
              : >"$stdout_file"
              : >"$stderr_file"

              if "$@" >"$stdout_file" 2>"$stderr_file"; then
                cat "$stdout_file"
                rm -f "$stdout_file" "$stderr_file"
                return 0
              else
                # WHY: capture the command status inside the conditional.
                # Reading $? after `fi` would see the successful status of the
                # `if` compound command and falsely turn exhaustion into success.
                rc=$?
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                cat "$stderr_file" >&2
                if [ -s "$stdout_file" ]; then
                  cat "$stdout_file" >&2
                fi
                rm -f "$stdout_file" "$stderr_file"
                return "$rc"
              fi

              cat "$stderr_file" >&2
              echo "::warning::GitHub command failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          classify_runs() {
            jq -c -f .github/scripts/select-staging-build-run.jq
          }

          log_summary() {
            jq -r '
              "staging-build selection: state=\(.state) total=\(.total_count) real=\(.real_count) skipped=\(.skipped_count) selected=\(.run_id) status=\(.status) conclusion=\(.conclusion) skipped_ids=\(.skipped_run_ids | join(","))"
            '
          }

          # The label event can fire before GitHub registers related
          # workflow runs against PR_HEAD_SHA. Retry only the truly
          # empty state. A skipped-only state is meaningful: label
          # events other than skip-staging-tests intentionally create
          # all-skipped staging-build runs.
          SUMMARY=""
          for attempt in 1 2 3 4 5 6; do
            RUNS_JSON=$(gh_retry gh run list \
              --repo ${{ github.repository }} \
              --workflow=staging-build.yml \
              --commit="$PR_HEAD_SHA" \
              --limit=100 \
              --json databaseId,status,conclusion,createdAt)
            SUMMARY=$(printf '%s\n' "$RUNS_JSON" | classify_runs)
            printf '%s\n' "$SUMMARY" | log_summary

            STATE=$(printf '%s\n' "$SUMMARY" | jq -r '.state')
            [ "$STATE" != "no_runs" ] && break
            [ "$attempt" = "6" ] && break
            sleep 10
          done

          STATE=$(printf '%s\n' "$SUMMARY" | jq -r '.state')
          RUN_ID=$(printf '%s\n' "$SUMMARY" | jq -r '.run_id')
          RUN_STATUS=$(printf '%s\n' "$SUMMARY" | jq -r '.status')
          RUN_CONCLUSION=$(printf '%s\n' "$SUMMARY" | jq -r '.conclusion')
          SKIPPED_IDS=$(printf '%s\n' "$SUMMARY" | jq -r '.skipped_run_ids | join(", ")')

          case "$STATE" in
            no_runs)
              echo "run_id=" >> "$GITHUB_OUTPUT"
              echo "::notice::No staging-build run is registered for HEAD $PR_HEAD_SHA after the retry window; prepare-merge will run synthetic-merge package validation itself."
              exit 0
              ;;
            only_skipped)
              echo "run_id=" >> "$GITHUB_OUTPUT"
              echo "::notice::Only skipped staging-build run(s) found for HEAD $PR_HEAD_SHA (${SKIPPED_IDS:-none}). These are expected for non-skip-staging-tests label events such as ready-to-ship; prepare-merge will run synthetic-merge package validation itself."
              exit 0
              ;;
            real_success)
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "Latest real staging-build run $RUN_ID for $PR_HEAD_SHA succeeded; continuing."
              exit 0
              ;;
            real_failed)
              gh_retry gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship || true
              gh_retry gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "Cannot prepare merge: latest real non-skipped \`staging-build\` for HEAD \`$PR_HEAD_SHA\` concluded \`${RUN_CONCLUSION:-$RUN_STATUS}\` (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID). Skipped label-event staging runs are ignored and do not count as validation. Re-apply \`ready-to-ship\` once staging-build is green, or let a new commit trigger a fresh run." || true
              exit 1
              ;;
            real_in_progress)
              ;;
            *)
              echo "::error::Unknown staging-build selection state: $STATE"
              exit 1
              ;;
          esac

          if [ -z "$RUN_ID" ]; then
            echo "::error::staging-build selector returned state=$STATE without a run_id"
            exit 1
          fi

          echo "Waiting for real staging-build run $RUN_ID on $PR_HEAD_SHA (status: $RUN_STATUS)."
          # --exit-status: non-zero on failure/cancelled conclusion.
          if ! gh_retry gh run watch "$RUN_ID" --repo ${{ github.repository }} --exit-status; then
            gh_retry gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship || true
            gh_retry gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "Cannot prepare merge: real non-skipped \`staging-build\` for HEAD \`$PR_HEAD_SHA\` did not succeed (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID). Skipped label-event staging runs are ignored and do not count as validation. Re-apply \`ready-to-ship\` once staging-build is green." || true
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Drop label + comment on gate failure
        if: failure()
        run: |
          gh_retry() {
            local attempt=1
            local max_attempts=4
            local delay=2
            local stdout_file
            local stderr_file
            local rc

            stdout_file="$(mktemp)"
            stderr_file="$(mktemp)"

            while true; do
              : >"$stdout_file"
              : >"$stderr_file"

              if "$@" >"$stdout_file" 2>"$stderr_file"; then
                cat "$stdout_file"
                rm -f "$stdout_file" "$stderr_file"
                return 0
              else
                # WHY: capture the command status inside the conditional.
                # Reading $? after `fi` would see the successful status of the
                # `if` compound command and falsely turn exhaustion into success.
                rc=$?
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                cat "$stderr_file" >&2
                if [ -s "$stdout_file" ]; then
                  cat "$stdout_file" >&2
                fi
                rm -f "$stdout_file" "$stderr_file"
                return "$rc"
              fi

              cat "$stderr_file" >&2
              echo "::warning::GitHub command failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          gh_retry gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship || true
          gh_retry gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "prepare-merge gate failed. Check the workflow run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Re-apply the ready-to-ship label after fixing." || true

  # Copy only the exact shell and report from the successful staging run into
  # this prepare run. The token stays in this base-controlled job; synthetic
  # pull-request code later receives only digest-bound files and a receipt.
  staging-shell-snapshot:
    needs: [synthesize-merge, change-scope, gate]
    # The historical staging-shell artifact format is retired. Keep its
    # verifier dormant until a package-owned handoff replaces that format.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      available: ${{ steps.locate.outputs.available }}
      artifact_name: ${{ steps.locate.outputs.handoff_artifact_name }}
      run_id: ${{ steps.locate.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_RUN_ID: ${{ needs.gate.outputs.staging_run_id }}
      EXPECTED_BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
      EXPECTED_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
      EXPECTED_TREE_SHA: ${{ needs.synthesize-merge.outputs.tree_sha }}
      EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Bind the successful staging run and closure artifact
        id: locate
        run: |
          set -euo pipefail
          run_json="$RUNNER_TEMP/staging-run.json"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}" \
            > "$run_json"
          # WHY: workflow-run head_sha and head_commit are immutable producer
          # evidence. The nested pull_requests object is a live PR projection;
          # GitHub rewrites its base/head SHAs after later pushes and merges,
          # so it may identify the PR but must not assert historical source.
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$EXPECTED_HEAD_SHA" \
            --argjson pr "$EXPECTED_PR_NUMBER" \
            --argjson run_id "$STAGING_RUN_ID" '
              .id == $run_id and
              .head_sha == $head and
              .head_repository.full_name == $repository and
              .path == ".github/workflows/staging-build.yml" and
              .event == "pull_request" and
              .status == "completed" and
              .conclusion == "success" and
              (.head_commit.tree_id |
                type == "string" and test("^[0-9a-f]{40}$")) and
              (.pull_requests | type == "array" and length == 1) and
              .pull_requests[0].number == $pr and
              .pull_requests[0].base.repo.id == .repository.id and
              .pull_requests[0].head.repo.id == .repository.id
            ' "$run_json" >/dev/null || {
              echo "::error::selected staging run is not the successful exact-head producer"
              exit 1
            }

          artifacts="$RUNNER_TEMP/staging-artifacts.json"
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}/artifacts?per_page=100" \
            | jq -s '{artifacts: (map(.artifacts) | add)}' > "$artifacts"
          count="$(jq '[.artifacts[] | select(
            .name == "main-shell-closure" and .expired == false
          )] | length' "$artifacts")"
          if [ "$count" -eq 0 ]; then
            echo "::notice::successful staging run did not publish an exact shell closure"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::successful staging run has $count live shell closure artifacts"
            exit 1
          fi
          producer_tree="$(jq -er '.head_commit.tree_id' "$run_json")"
          # WHY: a successful staging run without a shell artifact may use the
          # ordinary synthetic-merge fallback. Once these producer bytes will
          # cross the handoff, however, their immutable head tree must exactly
          # equal the synthetic merge that prepare-merge will test.
          if [ "$producer_tree" != "$EXPECTED_TREE_SHA" ]; then
            echo "::notice::staging shell producer tree differs from the synthetic merge; use the source fallback"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact="$(jq -c '[.artifacts[] | select(
            .name == "main-shell-closure" and .expired == false
          )][0]' "$artifacts")"
          artifact_id="$(jq -er '.id' <<<"$artifact")"
          artifact_bytes="$(jq -er '.size_in_bytes' <<<"$artifact")"
          archive_digest="$(jq -er '.digest' <<<"$artifact")"
          if ! [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$artifact_bytes" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$archive_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::staging shell artifact lacks a complete GitHub identity"
            exit 1
          fi
          if [ "$artifact_bytes" -gt 134217728 ]; then
            echo "::error::staging shell artifact exceeds the 128 MiB handoff limit"
            exit 1
          fi
          {
            echo "available=true"
            echo "run_id=$STAGING_RUN_ID"
            echo "artifact_id=$artifact_id"
            echo "artifact_bytes=$artifact_bytes"
            echo "archive_sha256=${archive_digest#sha256:}"
            echo "producer_tree=$producer_tree"
            echo "handoff_artifact_name=trusted-staging-shell-${STAGING_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Download the exact staging closure
        if: steps.locate.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.locate.outputs.artifact_id }}
          path: ${{ runner.temp }}/staging-shell-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.STAGING_RUN_ID }}
          merge-multiple: true

      - name: Create the exact staging shell receipt
        if: steps.locate.outputs.available == 'true'
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/staging-shell-source"
          if find "$source_root" -type l \
              \( -name main-shell.vfs.zst -o \
                 -name main-shell-report.json \) | grep -q .; then
            echo "::error::staging shell artifact contains a symlinked input"
            exit 1
          fi
          mapfile -t images < <(
            find "$source_root" -type f -name main-shell.vfs.zst -print
          )
          mapfile -t reports < <(
            find "$source_root" -type f -name main-shell-report.json -print
          )
          if [ "${#images[@]}" -ne 1 ] || [ "${#reports[@]}" -ne 1 ]; then
            echo "::error::staging closure must contain exactly one shell and one report"
            exit 1
          fi
          image="${images[0]}"
          report="${reports[0]}"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" '
              .schema == 1 and
              .image == "main-shell.vfs.zst" and
              .metadata.kandelo_repository == $repository and
              (.package_deferred_trees | type == "array" and length > 0) and
              (.bottle_mirror.assets | type == "array" and length > 0)
            ' "$report" >/dev/null || {
              echo "::error::staging report is not a bottle-composed shell"
              exit 1
            }
          handoff="$RUNNER_TEMP/trusted-staging-shell"
          mkdir "$handoff"
          cp -p -- "$image" "$handoff/main-shell.vfs.zst"
          cp -p -- "$report" "$handoff/main-shell-report.json"
          image_sha="$(sha256sum "$image" | awk '{print $1}')"
          image_bytes="$(wc -c < "$image" | tr -d '[:space:]')"
          report_sha="$(sha256sum "$report" | awk '{print $1}')"
          report_bytes="$(wc -c < "$report" | tr -d '[:space:]')"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg validation_base "$EXPECTED_BASE_SHA" \
            --arg producer_head "$EXPECTED_HEAD_SHA" \
            --arg producer_tree "${{ steps.locate.outputs.producer_tree }}" \
            --argjson pr "$EXPECTED_PR_NUMBER" \
            --argjson run_id "$STAGING_RUN_ID" \
            --argjson artifact_id "${{ steps.locate.outputs.artifact_id }}" \
            --argjson artifact_bytes "${{ steps.locate.outputs.artifact_bytes }}" \
            --arg archive_sha256 "${{ steps.locate.outputs.archive_sha256 }}" \
            --arg image_sha256 "$image_sha" \
            --argjson image_bytes "$image_bytes" \
            --arg report_sha256 "$report_sha" \
            --argjson report_bytes "$report_bytes" '
              {
                schema: 1,
                kind: "kandelo-ci-staging-shell-handoff",
                repository: $repository,
                workflow: ".github/workflows/staging-build.yml",
                validation_pull_request_number: $pr,
                validation_base_sha: $validation_base,
                producer_head_sha: $producer_head,
                producer_tree_sha: $producer_tree,
                run_id: $run_id,
                artifact: {
                  id: $artifact_id,
                  name: "main-shell-closure",
                  archive_sha256: $archive_sha256,
                  bytes: $artifact_bytes
                },
                image: {sha256: $image_sha256, bytes: $image_bytes},
                report: {sha256: $report_sha256, bytes: $report_bytes}
              }
            ' > "$handoff/receipt.json"

      - name: Upload the trusted staging shell handoff
        if: steps.locate.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-staging-shell-${{ env.STAGING_RUN_ID }}
          path: ${{ runner.temp }}/trusted-staging-shell
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Per-package matrix flow.
  #
  # Mirrors `staging-build.yml`'s preflight + toolchain-cache +
  # matrix-build + split test-gate flow, but every writer targets one exact
  # run-specific merge-candidate prerelease. The candidate begins as an
  # immutable snapshot of the canonical ledger with unchanged archive URLs
  # made absolute. Canonical state is activated only after merge.
  #
  # A future cleanup PR can extract this shape into a reusable
  # `workflow_call` workflow shared between staging-build and
  # prepare-merge. For the Phase C cutover we deliberately copy-paste
  # to keep the diff localized.
  # ---------------------------------------------------------------------

  preflight:
    needs: [synthesize-merge, gate, change-scope]
    if: |
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      (needs.change-scope.outputs.package_staging_required == 'true' ||
       needs.change-scope.outputs.test_gate_required == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: read # download synthesized merge artifact
      contents: write # candidate release init + canonical read
    outputs:
      library_matrix: ${{ steps.compute.outputs.library_matrix }}
      program_matrix: ${{ steps.compute.outputs.program_matrix }}
      promote_matrix: ${{ steps.compute.outputs.promote_matrix }}
      stages_node_vfs: ${{ steps.compute.outputs.stages_node_vfs }}
      abi: ${{ steps.compute.outputs.abi }}
      target_tag: ${{ steps.compute.outputs.target_tag }}
      candidate_release_id: ${{ steps.compute.outputs.candidate_release_id }}
      candidate_run_attempt: ${{ steps.compute.outputs.candidate_run_attempt }}
      canonical_tag: ${{ steps.compute.outputs.canonical_tag }}
      staging_tag: ${{ steps.compute.outputs.staging_tag }}
      merge_base_sha: ${{ steps.compute.outputs.merge_base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Checkout synthesized PR merge
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          if [ "$actual" != "$SYNTHETIC_MERGE_SHA" ]; then
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          fi
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          parents=$(git show --no-patch --format=%P HEAD)
          actual_base=$(printf '%s\n' "$parents" | awk '{print $1}')
          actual_head=$(printf '%s\n' "$parents" | awk '{print $2}')
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi

      - name: Fetch musl submodule
        # Hardened submodule fetch via the reusable action (PR #435).
        # preflight only needs musl (it builds xtask and computes the
        # matrix; tests/libc/libc-test and tests/sortix/os-test materialize in
        # their own conformance suite job checkouts. Mergeability is proven by
        # `synthesize-merge`, and base drift is checked by the final
        # merge-gate posting jobs.
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: libc/musl

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Warm Nix dev shell
        run: bash scripts/dev-shell.sh true

      - name: Cache xtask build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: preflight-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/xtask/**') }}
          restore-keys: |
            preflight-${{ runner.os }}-

      - name: Build xtask
        run: |
          bash scripts/dev-shell.sh bash -c '
            HOST_TARGET=$(rustc -vV | awk "/^host/ {print \$2}")
            cargo build --release -p xtask --target "$HOST_TARGET"
          '

      - name: Compute matrix
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          SYNTH_BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          SYNTH_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
          SYNTH_PR_COMMIT_COUNT: ${{ needs.synthesize-merge.outputs.pr_commit_count }}
        run: |
          bash scripts/dev-shell.sh env \
            PR_COMMIT_COUNT="$SYNTH_PR_COMMIT_COUNT" \
            PACKAGE_STAGING_EXCLUSIONS="$PACKAGE_STAGING_EXCLUSIONS" \
            bash -c '
            set -euo pipefail
            PACKAGE_STAGING_REQUIRED="${{ needs.change-scope.outputs.package_staging_required }}"

            if [ "$(git rev-parse HEAD)" != "$SYNTHETIC_MERGE_SHA" ]; then
              echo "::error::preflight is not on synthetic merge $SYNTHETIC_MERGE_SHA"
              exit 1
            fi
            parents=$(git show --no-patch --format=%P HEAD)
            actual_base=$(printf "%s\n" "$parents" | awk "{print \$1}")
            actual_head=$(printf "%s\n" "$parents" | awk "{print \$2}")
            MERGE_BASE_SHA="$SYNTH_BASE_SHA"
            MERGE_HEAD_SHA="$SYNTH_HEAD_SHA"
            if [ "$actual_base" != "$MERGE_BASE_SHA" ] || [ "$actual_head" != "$MERGE_HEAD_SHA" ]; then
              echo "::error::prepare-merge synthetic merge parent mismatch: parents=$parents base=$MERGE_BASE_SHA head=$MERGE_HEAD_SHA"
              exit 1
            fi
            echo "merge_base_sha=$MERGE_BASE_SHA" >> "$GITHUB_OUTPUT"

            ABI=$(grep -oE "ABI_VERSION: u32 = [0-9]+" crates/shared/src/lib.rs | awk "{print \$4}")
            echo "abi=$ABI" >> "$GITHUB_OUTPUT"

            CANONICAL_TAG="binaries-abi-v${ABI}"
            echo "canonical_tag=$CANONICAL_TAG" >> "$GITHUB_OUTPUT"
            CANDIDATE_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
            echo "candidate_run_attempt=$CANDIDATE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
            TARGET_TAG="merge-candidate-abi-v${ABI}-pr-${{ github.event.pull_request.number }}-run-${GITHUB_RUN_ID}-attempt-${CANDIDATE_RUN_ATTEMPT}"
            echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
            # Prefer the newest immutable staging attempt for this exact PR
            # head. The legacy fixed tag remains a read-only fallback while
            # pre-immutability PRs drain.
            STAGING_TAG=$(gh api --paginate --slurp \
              "/repos/${{ github.repository }}/releases?per_page=100" \
              | jq -r \
                --arg head "$MERGE_HEAD_SHA" \
                --arg prefix "pr-${{ github.event.pull_request.number }}-staging-run-" "
                  [.[][] |
                    select(.tag_name | startswith(\$prefix)) |
                    select(.target_commitish == \$head) |
                    select(.draft == false and .immutable == true and
                      .prerelease == true) |
                    select(any(.assets[]?; .name == \"index.toml\") and
                      any(.assets[]?; .name ==
                        \"kandelo-package-release-seal-v1.json\"))] |
                  sort_by(.created_at) | last | .tag_name // \"\"
                ")
            if [ -z "$STAGING_TAG" ]; then
              STAGING_TAG="pr-${{ github.event.pull_request.number }}-staging"
            fi
            echo "staging_tag=$STAGING_TAG" >> "$GITHUB_OUTPUT"

            if [ "$PACKAGE_STAGING_REQUIRED" != "true" ]; then
              echo "library_matrix=[]" >> "$GITHUB_OUTPUT"
              echo "program_matrix=[]" >> "$GITHUB_OUTPUT"
              echo "promote_matrix=[]" >> "$GITHUB_OUTPUT"
              echo "stages_node_vfs=false" >> "$GITHUB_OUTPUT"
              echo "preflight: package staging not required; skipping package drift matrix"
              exit 0
            fi

            existing_index_dir=$(mktemp -d)
            existing_index="$existing_index_dir/index.toml"
            canonical_state_file="$existing_index_dir/state"
            existing_assets_file="$existing_index_dir/assets.json"
            existing_asset_metadata_file="$existing_index_dir/asset-metadata.json"
            bash .github/scripts/fetch-canonical-index.sh \
              --target-tag "$CANONICAL_TAG" \
              --abi "$ABI" \
              --output "$existing_index" \
              --state-file "$canonical_state_file" \
              --asset-names-file "$existing_assets_file" \
              --asset-metadata-file "$existing_asset_metadata_file"
            canonical_state=$(cat "$canonical_state_file")
            existing_assets=$(cat "$existing_assets_file")
            echo "existing-assets:"
            echo "$existing_assets" | jq -r ".[0:20][]"
            echo "..."
            echo "existing-index: state=$canonical_state"

            SYNTHETIC_TREE_SHA=$(git rev-parse "$SYNTHETIC_MERGE_SHA^{tree}")
            if [ "$SYNTHETIC_TREE_SHA" != "${{ needs.synthesize-merge.outputs.tree_sha }}" ]; then
              echo "::error::synthetic tree output drifted: $SYNTHETIC_TREE_SHA != ${{ needs.synthesize-merge.outputs.tree_sha }}"
              exit 1
            fi
            if ! [[ "$PR_COMMIT_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::synthesize-merge did not report a positive PR commit count"
              exit 1
            fi
            candidate_release_id_file=$(mktemp)
            bash .github/scripts/init-merge-candidate.sh \
              --canonical-index "$existing_index" \
              --candidate-tag "$TARGET_TAG" \
              --canonical-tag "$CANONICAL_TAG" \
              --canonical-state "$canonical_state" \
              --abi "$ABI" \
              --pr-number "${{ github.event.pull_request.number }}" \
              --base-ref "${{ github.event.pull_request.base.ref }}" \
              --base-sha "$MERGE_BASE_SHA" \
              --head-sha "$MERGE_HEAD_SHA" \
              --synthetic-merge-sha "$SYNTHETIC_MERGE_SHA" \
              --synthetic-tree-sha "$SYNTHETIC_TREE_SHA" \
              --merge-method "${{ env.PREPARE_MERGE_METHOD }}" \
              --pr-commit-count "$PR_COMMIT_COUNT" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
              --release-id-file "$candidate_release_id_file"
            candidate_release_id=$(cat "$candidate_release_id_file")
            if ! [[ "$candidate_release_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::candidate initialization returned an invalid release ID"
              exit 1
            fi
            echo "candidate_release_id=$candidate_release_id" >> "$GITHUB_OUTPUT"
            staging_assets_file=$(mktemp)
            gh release view "$STAGING_TAG" \
              --repo "${{ github.repository }}" \
              --json assets \
              --jq "[.assets[] | {name, size, digest}]" \
              > "$staging_assets_file" 2>/dev/null || printf "[]\n" > "$staging_assets_file"
            staging_assets=$(cat "$staging_assets_file")
            echo "staging-assets:"
            echo "$staging_assets" | jq -r ".[0:20][].name"
            echo "..."
            staging_index_dir=$(mktemp -d)
            staging_index="$staging_index_dir/index.toml"
            if gh release download "$STAGING_TAG" --repo "${{ github.repository }}" --pattern index.toml --dir "$staging_index_dir" --clobber >/dev/null 2>&1; then
              echo "staging-index: downloaded $STAGING_TAG/index.toml"
            else
              echo "staging-index: none"
              : > "$staging_index"
            fi

            HOST_TARGET=$(rustc -vV | awk "/^host/ {print \$2}")
            XTASK="target/$HOST_TARGET/release/xtask"
            library_matrix="[]"
            program_matrix="[]"
            promote_matrix="[]"

            expected_ledger=$(mktemp)
            "$XTASK" staging-reuse expected \
              --registry packages/registry \
              --expected-abi "$ABI" \
              --exclude "$PACKAGE_STAGING_EXCLUSIONS" \
              --output "$expected_ledger"

            # WHY: promotion and build matrices come from the same Rust-owned
            # expected ledger. A pending package and every reverse dependent
            # are therefore absent before either path can mutate a release.
            while IFS= read -r expected_entry; do
              pkg=$(echo "$expected_entry" | jq -r .package)
              kind=$(echo "$expected_entry" | jq -r .kind)
              arch=$(echo "$expected_entry" | jq -r .arch)
              sha=$(echo "$expected_entry" | jq -r .cache_key_sha)
              version=$(echo "$expected_entry" | jq -r .version)
              revision=$(echo "$expected_entry" | jq -r .revision)
              short=${sha:0:8}
              prefix="${pkg}-"
              suffix="-abi${ABI}-${arch}-${short}.tar.zst"
              existing_archive=$(echo "$existing_assets" | jq -r --arg pre "$prefix" --arg suf "$suffix" \
                  "first(.[] | select(startswith(\$pre) and endswith(\$suf))) // \"\"")
              if [ -n "$existing_archive" ] && scripts/index-has-current-entry.sh "$existing_index" "$pkg" "$arch" "$sha" "$revision"; then
                echo "preflight: skip $pkg/$arch (sha $short already indexed)"
                continue
              fi
              entry=$(jq -nc --arg pkg "$pkg" --arg arch "$arch" --arg sha "$sha" \
                              --arg ver "$version" --argjson rev "$revision" \
                "{package: \$pkg, arch: \$arch, sha: \$sha, version: \$ver, revision: \$rev}")
              source=$(bash .github/scripts/select-package-archive-source.sh \
                --canonical-assets "$existing_asset_metadata_file" \
                --staging-assets "$staging_assets_file" \
                --canonical-tag "$CANONICAL_TAG" \
                --staging-tag "$STAGING_TAG" \
                --prefix "$prefix" \
                --suffix "$suffix")
              source_kind=$(jq -r .source <<<"$source")
              if [ "$source_kind" = canonical ] || [ "$source_kind" = staging ]; then
                promote_entry=$(jq -nc \
                  --argjson entry "$entry" \
                  --argjson source "$source" \
                  "\$entry + {
                    archive_name: \$source.archive_name,
                    archive_sha256: \$source.archive_sha256,
                    archive_size: \$source.archive_size,
                    source_tag: \$source.source_tag,
                    source: \$source.source
                  }")
                promote_matrix=$(echo "$promote_matrix" | jq -c --argjson e "$promote_entry" ". + [\$e]")
                if [ "$source_kind" = canonical ]; then
                  echo "preflight: repair $pkg/$arch index (sha $short from existing $CANONICAL_TAG asset)"
                else
                  echo "preflight: promote $pkg/$arch (sha $short from $STAGING_TAG)"
                fi
                continue
              fi
              if [ "$kind" = "library" ]; then
                library_matrix=$(echo "$library_matrix" | jq -c --argjson e "$entry" ". + [\$e]")
              else
                program_matrix=$(echo "$program_matrix" | jq -c --argjson e "$entry" ". + [\$e]")
              fi
            done < <(jq -c ".entries[]" "$expected_ledger")

            program_matrix_file=$(mktemp)
            printf "%s" "$program_matrix" > "$program_matrix_file"
            program_matrix=$("$XTASK" sort-package-matrix \
                --registry packages/registry \
                --matrix "$program_matrix_file")
            rm -f "$program_matrix_file"

            exact_matrix=$(jq -cn \
              --argjson promote "$promote_matrix" \
              --argjson library "$library_matrix" \
              --argjson program "$program_matrix" \
              "\$promote + \$library + \$program")
            stages_node_vfs=$(jq -r \
              "any(.[]; .package == \"node-vfs\" and .arch == \"wasm32\")" \
              <<<"$exact_matrix")

            echo "library_matrix=$library_matrix" >> "$GITHUB_OUTPUT"
            echo "program_matrix=$program_matrix" >> "$GITHUB_OUTPUT"
            echo "promote_matrix=$promote_matrix" >> "$GITHUB_OUTPUT"
            echo "stages_node_vfs=$stages_node_vfs" >> "$GITHUB_OUTPUT"
            echo "preflight: promote=$(echo "$promote_matrix" | jq length) library-build=$(echo "$library_matrix" | jq length) program-build=$(echo "$program_matrix" | jq length)"
            echo "promote_matrix:"; echo "$promote_matrix" | jq .
            echo "library_matrix:"; echo "$library_matrix" | jq .
            echo "program_matrix:"; echo "$program_matrix" | jq .
          '

  toolchain-cache:
    needs: [synthesize-merge, gate, change-scope]
    if: |
      needs.change-scope.outputs.package_staging_required == 'true' ||
      needs.change-scope.outputs.test_gate_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Checkout synthesized PR merge
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          if [ "$actual" != "$SYNTHETIC_MERGE_SHA" ]; then
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          fi
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          parents=$(git show --no-patch --format=%P HEAD)
          actual_base=$(printf '%s\n' "$parents" | awk '{print $1}')
          actual_head=$(printf '%s\n' "$parents" | awk '{print $2}')
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi

      - name: Prepare package toolchain
        uses: ./.github/actions/package-toolchain

  # Fast path for prepare-merge: copy exact cache-keyed bytes from the
  # canonical or PR staging release into the isolated candidate and update
  # only its index. Canonical assets take precedence so a stale ledger is
  # repaired without replacing immutable same-name bytes. Fall back to
  # matrix builds for entries absent from both releases.
  promote-staging:
    name: Promote existing archive (${{ matrix.package }}, ${{ matrix.arch }}, ${{ matrix.source }})
    needs: [synthesize-merge, change-scope, preflight]
    if: needs.change-scope.outputs.exact_abi_staging_applicable != 'true' && needs.preflight.outputs.promote_matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: read # verify a previous state-lock owner is terminal
      contents: write # gh release download/upload + state-lock git push
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.promote_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Checkout synthesized PR merge
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          if [ "$actual" != "$SYNTHETIC_MERGE_SHA" ]; then
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          fi
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          parents=$(git show --no-patch --format=%P HEAD)
          actual_base=$(printf '%s\n' "$parents" | awk '{print $1}')
          actual_head=$(printf '%s\n' "$parents" | awk '{print $2}')
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi

      - name: Build xtask
        run: |
          HOST_TARGET=$(rustc -vV | awk "/^host/ {print \$2}")
          cargo build --release -p xtask --target "$HOST_TARGET"

      - name: Download verified source archive
        id: archive
        env:
          ARCHIVE_NAME: ${{ matrix.archive_name }}
          ARCHIVE_SHA256: ${{ matrix.archive_sha256 }}
          ARCHIVE_SIZE: ${{ matrix.archive_size }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_TAG: ${{ matrix.source_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promote"
          archive_path="$RUNNER_TEMP/promote/$ARCHIVE_NAME"
          bash .github/scripts/download-verified-release-asset.sh \
            --tag "$SOURCE_TAG" \
            --asset "$ARCHIVE_NAME" \
            --sha256 "$ARCHIVE_SHA256" \
            --size "$ARCHIVE_SIZE" \
            --output "$archive_path"
          echo "archive-path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "archive-name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Promote archive + index entry
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/index-update.sh \
            --target-tag "${{ needs.preflight.outputs.target_tag }}" \
            --package "${{ matrix.package }}" \
            --version "${{ matrix.version }}" \
            --revision "${{ matrix.revision }}" \
            --arch "${{ matrix.arch }}" \
            --status success \
            --archive-path "${{ steps.archive.outputs.archive-path }}" \
            --archive-name "${{ steps.archive.outputs.archive-name }}" \
            --cache-key-sha "${{ matrix.sha }}"

  # Library wave — kind=library packages. See staging-build.yml for
  # the lib-then-program design rationale.
  lib-matrix-build:
    needs: [synthesize-merge, change-scope, preflight, toolchain-cache]
    if: ${{ needs.change-scope.outputs.exact_abi_staging_applicable != 'true' && needs.preflight.result == 'success' && needs.toolchain-cache.result == 'success' && needs.preflight.outputs.library_matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # download toolchain artifact
      contents: write # state-lock git push + gh release create/upload
    env:
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.target_tag }}/index.toml
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.library_matrix) }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Checkout synthesized PR merge
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          if [ "$actual" != "$SYNTHETIC_MERGE_SHA" ]; then
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          fi
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          parents=$(git show --no-patch --format=%P HEAD)
          actual_base=$(printf '%s\n' "$parents" | awk '{print $1}')
          actual_head=$(printf '%s\n' "$parents" | awk '{print $2}')
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi

      - name: Build ${{ matrix.package }} (${{ matrix.arch }})
        id: build
        uses: ./.github/actions/package-archive-build
        with:
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          build-host: ${{ github.repository }}@${{ needs.synthesize-merge.outputs.merge_sha }}
          source-repository: https://github.com/${{ github.repository }}
          source-commit: ${{ needs.synthesize-merge.outputs.merge_sha }}
          expected-cache-key-sha: ${{ matrix.sha }}

      # Atomic per-matrix-entry publish: archive upload + index.toml
      # mutation under the state-lock acquired for the target tag.
      # Different release tags use different lock subjects (run-specific
      # candidate vs a run-specific PR staging draft), so builds using
      # independent tags do not block each other.
      #
      # On failure: a separate step records status=failed in the
      # index so consumers see the rebuild attempt; if a prior
      # successful build exists, IndexToml::update_entry_failed
      # preserves it in the fallback_* slot (last-green semantics).
      - name: Publish archive + index entry
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/index-update.sh \
            --target-tag "${{ needs.preflight.outputs.target_tag }}" \
            --package "${{ matrix.package }}" \
            --version "${{ matrix.version }}" \
            --revision "${{ matrix.revision }}" \
            --arch "${{ matrix.arch }}" \
            --status success \
            --archive-path "${{ steps.build.outputs.archive-path }}" \
            --archive-name "${{ steps.build.outputs.archive-name }}" \
            --cache-key-sha "${{ matrix.sha }}"

      - name: Record failed build in index
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/index-update.sh \
            --target-tag "${{ needs.preflight.outputs.target_tag }}" \
            --package "${{ matrix.package }}" \
            --version "${{ matrix.version }}" \
            --revision "${{ matrix.revision }}" \
            --arch "${{ matrix.arch }}" \
            --status failed \
            --error "matrix-build failed; see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true

  # Program wave — kind=program packages, gated on the library wave.
  matrix-build:
    needs:
      [
        synthesize-merge,
        change-scope,
        preflight,
        toolchain-cache,
        promote-staging,
        lib-matrix-build,
      ]
    if: |
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.preflight.result == 'success' &&
      needs.toolchain-cache.result == 'success' &&
      (needs.promote-staging.result == 'success' || needs.promote-staging.result == 'skipped') &&
      (needs.lib-matrix-build.result == 'success' || needs.lib-matrix-build.result == 'skipped') &&
      needs.preflight.outputs.program_matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: read # download toolchain + library artifacts
      contents: write # state-lock git push + gh release create/upload
    env:
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.target_tag }}/index.toml
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.program_matrix) }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Checkout synthesized PR merge
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          if [ "$actual" != "$SYNTHETIC_MERGE_SHA" ]; then
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          fi
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          parents=$(git show --no-patch --format=%P HEAD)
          actual_base=$(printf '%s\n' "$parents" | awk '{print $1}')
          actual_head=$(printf '%s\n' "$parents" | awk '{print $2}')
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi

      - name: Build ${{ matrix.package }} (${{ matrix.arch }})
        id: build
        uses: ./.github/actions/package-archive-build
        with:
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          build-host: ${{ github.repository }}@${{ needs.synthesize-merge.outputs.merge_sha }}
          source-repository: https://github.com/${{ github.repository }}
          source-commit: ${{ needs.synthesize-merge.outputs.merge_sha }}
          expected-cache-key-sha: ${{ matrix.sha }}
          materialize-library-overlays: ${{ needs.preflight.outputs.library_matrix != '[]' }}
          library-matrix: ${{ needs.preflight.outputs.library_matrix }}
          dependency-matrix: ${{ needs.preflight.outputs.program_matrix }}
          github-token: ${{ github.token }}

      # Atomic per-matrix-entry publish — see lib-matrix-build for
      # the rationale.
      - name: Publish archive + index entry
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/index-update.sh \
            --target-tag "${{ needs.preflight.outputs.target_tag }}" \
            --package "${{ matrix.package }}" \
            --version "${{ matrix.version }}" \
            --revision "${{ matrix.revision }}" \
            --arch "${{ matrix.arch }}" \
            --status success \
            --archive-path "${{ steps.build.outputs.archive-path }}" \
            --archive-name "${{ steps.build.outputs.archive-name }}" \
            --cache-key-sha "${{ matrix.sha }}"

      - name: Record failed build in index
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/index-update.sh \
            --target-tag "${{ needs.preflight.outputs.target_tag }}" \
            --package "${{ matrix.package }}" \
            --version "${{ matrix.version }}" \
            --revision "${{ matrix.revision }}" \
            --arch "${{ matrix.arch }}" \
            --status failed \
            --error "matrix-build failed; see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true

  test-gate-validation:
    # Source-only validation does not consume the prepared test workspace.
    # Run it alongside package materialization and kernel fixture preparation
    # so typechecking and workflow tests do not extend the suite critical path.
    needs: [synthesize-merge, change-scope, gate]
    if: |
      !cancelled() &&
      needs.synthesize-merge.result == 'success' &&
      needs.change-scope.result == 'success' &&
      needs.gate.result == 'success' &&
      (
        needs.change-scope.outputs.package_staging_required == 'true' ||
        needs.change-scope.outputs.test_gate_required == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      PACKAGE_PUBLISH_FLOW_CHANGED: ${{ needs.change-scope.outputs.package_publish_flow_changed }}
      BINARY_MATERIALIZATION_CHANGED: ${{ needs.change-scope.outputs.binary_materialization_changed }}
      EXACT_ABI_STAGING_APPLICABLE: ${{ needs.change-scope.outputs.exact_abi_staging_applicable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Checkout synthesized PR merge
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          if [ "$actual" != "$SYNTHETIC_MERGE_SHA" ]; then
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          fi
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          parents=$(git show --no-patch --format=%P HEAD)
          actual_base=$(printf '%s\n' "$parents" | awk '{print $1}')
          actual_head=$(printf '%s\n' "$parents" | awk '{print $2}')
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install root npm deps
        run: bash scripts/dev-shell.sh npm ci --no-audit --no-fund

      - name: Install host npm deps
        run: |
          bash scripts/dev-shell.sh bash -c '
            cd host
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
          '

      - name: Typecheck host package
        run: |
          bash scripts/dev-shell.sh bash -c '
            cd host && npm run typecheck
          '

      - name: Test package build root contract
        run: bash scripts/dev-shell.sh bash scripts/test-package-build-roots.sh

      - name: Test package publish flow
        if: env.PACKAGE_PUBLISH_FLOW_CHANGED == 'true'
        run: |
          bash scripts/dev-shell.sh bash tests/scripts/package-publish-flow.sh

      - name: Test binary materialization flow
        if: env.BINARY_MATERIALIZATION_CHANGED == 'true' && env.EXACT_ABI_STAGING_APPLICABLE != 'true'
        run: |
          # WHY: artifact-guard integration tests query the ABI 43 binary
          # contract inventory. This source-only job does not download the
          # package-toolchain artifact, so prepare its host tool explicitly.
          bash scripts/dev-shell.sh bash scripts/build-fork-instrument-tool.sh
          bash scripts/dev-shell.sh npx --prefix host vitest run --root . \
            tests/package-system

  test-suite-early:
    name: test-suite (${{ matrix.label }})
    # These source-only Cargo suites need neither package materialization nor
    # the prepared workspace, so start them once the review gate and change
    # scope are known.
    needs: [synthesize-merge, change-scope, gate]
    if: |
      !cancelled() &&
      needs.synthesize-merge.result == 'success' &&
      needs.change-scope.result == 'success' &&
      needs.gate.result == 'success' &&
      (
        needs.change-scope.outputs.package_staging_required == 'true' ||
        needs.change-scope.outputs.test_gate_required == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cargo-workspace
            label: cargo-workspace
            # Closed-by-default coverage for every workspace crate except
            # independently gated xtask, including integration-test crates.
            kernel_only: true
            submodules: ''
          - suite: cargo-xtask
            label: cargo-xtask
            # Package-system automation needs no prepared package workspace,
            # but its repository-product inventory validates the exact musl
            # license bytes declared by developer-kandelo-sdk.
            kernel_only: false
            submodules: libc/musl
    env:
      KERNEL_ONLY: ${{ matrix.kernel_only }}
      KERNEL_CHANGED: ${{ needs.change-scope.outputs.kernel }}
      EXACT_ABI_STAGING_APPLICABLE: ${{ needs.change-scope.outputs.exact_abi_staging_applicable }}
      SUITE: ${{ matrix.suite }}
    steps:
      - name: Decide whether to run suite
        id: suite
        run: |
          set -euo pipefail
          if [ "$KERNEL_ONLY" = "true" ] && \
             [ "$KERNEL_CHANGED" != "true" ] && \
             [ "$EXACT_ABI_STAGING_APPLICABLE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$SUITE is kernel-only and this diff does not require kernel suites."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.suite.outputs.skip != 'true'
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.suite.outputs.skip != 'true'
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Checkout synthesized PR merge
        if: steps.suite.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          if [ "$actual" != "$SYNTHETIC_MERGE_SHA" ]; then
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          fi
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          parents=$(git show --no-patch --format=%P HEAD)
          actual_base=$(printf '%s\n' "$parents" | awk '{print $1}')
          actual_head=$(printf '%s\n' "$parents" | awk '{print $2}')
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi

      - name: Fetch early suite submodule
        if: steps.suite.outputs.skip != 'true' && matrix.submodules != ''
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: ${{ matrix.submodules }}

      - name: Set up Nix
        if: steps.suite.outputs.skip != 'true'
        uses: ./.github/actions/setup-nix

      - name: Run ${{ matrix.label }} suite
        if: steps.suite.outputs.skip != 'true'
        run: |
          bash scripts/dev-shell.sh bash scripts/ci-run-test-suite.sh "$SUITE"

  exact-abi-source-test-prepare:
    needs: [synthesize-merge, change-scope, gate, toolchain-cache]
    if: |
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable == 'true' &&
      needs.synthesize-merge.result == 'success' &&
      needs.gate.result == 'success' &&
      needs.toolchain-cache.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Checkout synthesized PR merge
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          [ "$actual" = "$SYNTHETIC_MERGE_SHA" ] || {
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          }
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          [ "$(git show --no-patch --format=%P HEAD)" = "$BASE_SHA $PR_HEAD_SHA" ] || {
            echo "::error::Synthetic merge parent identity differs"
            exit 1
          }

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Download exact toolchain sysroots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolchain-sysroots
          path: ${{ runner.temp }}/toolchain

      - name: Extract exact toolchain sysroots
        run: |
          tar --zstd -xf "$RUNNER_TEMP/toolchain/toolchain-sysroots.tar.zst"

      - name: Build exact kernel and source-test fixtures
        run: |
          bash scripts/dev-shell.sh bash -c '
            set -euo pipefail
            cargo build --release -p kandelo -Z build-std=core,alloc
            source scripts/install-local-binary.sh
            WASM_POSIX_LOCAL_INSTALL_SESSION=exact-abi-synthetic-source-test \
              install_local_binary kernel \
                target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
                kandelo-kernel.wasm
            cmp target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
              local-binaries/kernel.wasm
            mkdir -p local-binaries/programs/wasm32 host/test/fixtures
            wasm32posix-cc programs/audiotest.c \
              -o local-binaries/programs/wasm32/audiotest.wasm
            wasm32posix-cc programs/mousetest.c \
              -o local-binaries/programs/wasm32/mousetest.wasm
            wat2wasm --enable-threads \
              host/test/fixtures/deep-wasm-recursion.wat \
              -o host/test/fixtures/deep-wasm-recursion.wasm
          '

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          path: abi-staging-authority
          fetch-depth: 1

      - name: Pack exact ABI source-test workspace
        run: |
          bash abi-staging-authority/scripts/pack-exact-abi-source-test-workspace.sh \
            pack \
            --source-root "$GITHUB_WORKSPACE" \
            --archive "$RUNNER_TEMP/exact-abi-source-test-workspace.tar.zst"

      - name: Upload exact ABI source-test workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-abi-source-test-workspace
          path: ${{ runner.temp }}/exact-abi-source-test-workspace.tar.zst
          retention-days: 1
          if-no-files-found: error

  exact-abi-source-test-suite:
    name: exact ABI source test (${{ matrix.suite }} ${{ matrix.group }})
    needs:
      - synthesize-merge
      - change-scope
      - gate
      - toolchain-cache
      - exact-abi-source-test-prepare
    if: |
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable == 'true' &&
      needs.synthesize-merge.result == 'success' &&
      needs.gate.result == 'success' &&
      needs.toolchain-cache.result == 'success' &&
      needs.exact-abi-source-test-prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: vitest
            group: exact-abi-source
            route: vitest exact-abi-source
            submodules: ''
          - suite: libc
            group: functional-regression
            route: libc functional-regression
            submodules: tests/libc/libc-test
          - suite: libc
            group: math
            route: libc math
            submodules: tests/libc/libc-test
          - suite: posix
            group: all
            route: posix all
            submodules: ''
          - suite: sortix
            group: include
            route: sortix include
            submodules: tests/sortix/os-test
          - suite: sortix
            group: basic
            route: sortix basic
            submodules: tests/sortix/os-test
          - suite: sortix
            group: runtime
            route: sortix runtime
            submodules: tests/sortix/os-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Checkout synthesized PR merge
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          [ "$actual" = "$SYNTHETIC_MERGE_SHA" ] || {
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          }
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          [ "$(git show --no-patch --format=%P HEAD)" = "$BASE_SHA $PR_HEAD_SHA" ] || {
            echo "::error::Synthetic merge parent identity differs"
            exit 1
          }

      - name: Fetch exact suite submodule
        if: matrix.submodules != ''
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: ${{ matrix.submodules }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Download exact toolchain sysroots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolchain-sysroots
          path: ${{ runner.temp }}/toolchain

      - name: Extract exact toolchain sysroots
        run: |
          tar --zstd -xf "$RUNNER_TEMP/toolchain/toolchain-sysroots.tar.zst"

      - name: Download exact ABI source-test workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exact-abi-source-test-workspace
          path: ${{ runner.temp }}/exact-abi-source-test-workspace

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          path: abi-staging-authority
          fetch-depth: 1

      - name: Extract and validate exact ABI source-test workspace
        run: |
          bash abi-staging-authority/scripts/pack-exact-abi-source-test-workspace.sh \
            extract \
            --source-root "$GITHUB_WORKSPACE" \
            --archive \
              "$RUNNER_TEMP/exact-abi-source-test-workspace/exact-abi-source-test-workspace.tar.zst"

      - name: Run exact source/conformance cell
        env:
          SUITE: ${{ matrix.suite }}
          TEST_GROUP: ${{ matrix.group }}
        run: |
          bash scripts/dev-shell.sh bash \
            scripts/ci-run-test-suite.sh "$SUITE" "$TEST_GROUP"

  exact-abi-prepare-gate:
    needs:
      - synthesize-merge
      - change-scope
      - gate
      - test-gate-validation
      - test-suite-early
      - exact-abi-source-test-prepare
      - exact-abi-source-test-suite
    if: |
      always() &&
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Require complete synthesized exact ABI evidence
        env:
          SYNTHESIZE_RESULT: ${{ needs.synthesize-merge.result }}
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          AUTHORIZATION_GATE_RESULT: ${{ needs.gate.result }}
          VALIDATION_RESULT: ${{ needs.test-gate-validation.result }}
          EARLY_RESULT: ${{ needs.test-suite-early.result }}
          PREPARE_RESULT: ${{ needs.exact-abi-source-test-prepare.result }}
          SUITE_RESULT: ${{ needs.exact-abi-source-test-suite.result }}
          EXACT_ABI_STAGING_APPLICABLE: ${{ needs.change-scope.outputs.exact_abi_staging_applicable }}
        run: |
          set -euo pipefail
          [ "$EXACT_ABI_STAGING_APPLICABLE" = true ]
          for result in \
            "$SYNTHESIZE_RESULT" \
            "$CHANGE_SCOPE_RESULT" \
            "$AUTHORIZATION_GATE_RESULT" \
            "$VALIDATION_RESULT" \
            "$EARLY_RESULT" \
            "$PREPARE_RESULT" \
            "$SUITE_RESULT"
          do
            [ "$result" = success ] || {
              echo "::error::synthesized exact ABI evidence ended as $result"
              exit 1
            }
          done

  candidate-snapshot:
    needs:
      [
        synthesize-merge,
        change-scope,
        preflight,
        promote-staging,
        lib-matrix-build,
        matrix-build,
      ]
    if: |
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.change-scope.outputs.package_staging_required == 'true' &&
      needs.preflight.result == 'success' &&
      (needs.promote-staging.result == 'success' || needs.promote-staging.result == 'skipped') &&
      (needs.lib-matrix-build.result == 'success' || needs.lib-matrix-build.result == 'skipped') &&
      (needs.matrix-build.result == 'success' || needs.matrix-build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      # Draft releases are visible only to repository writers. This job
      # snapshots inert bytes and never checks out the synthetic merge or
      # executes repository scripts.
      contents: write
    steps:
      - name: Snapshot exact candidate draft
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ needs.preflight.outputs.candidate_release_id }}
          CANDIDATE_TAG: ${{ needs.preflight.outputs.target_tag }}
          CANDIDATE_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          CANDIDATE_ABI: ${{ needs.preflight.outputs.abi }}
        run: |
          set -euo pipefail
          if ! [[ "$CANDIDATE_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::preflight did not return an exact candidate release ID"
            exit 1
          fi
          snapshot="$RUNNER_TEMP/candidate-release"
          mkdir -p "$snapshot"
          release_before="$snapshot/release-before.json"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/${CANDIDATE_RELEASE_ID}" \
            >"$release_before"
          assets_before="$snapshot/assets-before.json"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases/${CANDIDATE_RELEASE_ID}/assets?per_page=100" \
            | jq -e 'add' >"$assets_before"
          jq -e \
            --argjson id "$CANDIDATE_RELEASE_ID" \
            --arg tag "$CANDIDATE_TAG" \
            --arg head "$CANDIDATE_HEAD_SHA" '
              .id == $id and .tag_name == $tag and
              .target_commitish == $head and
              .draft == true and .immutable == false
            ' "$release_before" >/dev/null
          jq -e '
              type == "array" and length > 0 and
              ([.[].id] | length == (unique | length)) and
              ([.[].name] | length == (unique | length)) and
              all(.[];
                (.id | type == "number" and . > 0) and
                (.name | type == "string" and
                  test("^[A-Za-z0-9][A-Za-z0-9._+,-]*$")) and
                .state == "uploaded" and
                (.size | type == "number" and . > 0 and floor == .) and
                (.digest | type == "string" and
                  test("^sha256:[0-9a-f]{64}$")))
            ' "$assets_before" >/dev/null
          jq -r '.[] |
            [.id, .name, .size, (.digest | sub("^sha256:"; ""))] |
            @tsv' "$assets_before" >"$snapshot/assets.tsv"
          while IFS=$'\t' read -r asset_id name expected_size expected_sha; do
            tmp="$snapshot/.${name}.download"
            gh api -H 'Accept: application/octet-stream' \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              >"$tmp"
            actual_size=$(wc -c <"$tmp" | tr -d '[:space:]')
            actual_sha=$(sha256sum "$tmp" | awk '{print $1}')
            if [ "$actual_size" != "$expected_size" ] ||
               [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::candidate asset $name differs from release metadata"
              exit 1
            fi
            mv "$tmp" "$snapshot/$name"
          done <"$snapshot/assets.tsv"
          candidate_json="$snapshot/candidate.json"
          base_index="$snapshot/base-index.toml"
          expected_base_sha="$(
            jq -er \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg tag "$CANDIDATE_TAG" \
              --arg head "$CANDIDATE_HEAD_SHA" \
              --arg canonical_tag "binaries-abi-v${CANDIDATE_ABI}" \
              --argjson abi "$CANDIDATE_ABI" '
                select(.repository == $repository and
                  .candidate_tag == $tag and .head_sha == $head and
                  .abi_version == $abi and
                  .canonical_tag == $canonical_tag and
                  (.canonical_base_state == "present" or
                    .canonical_base_state == "absent")) |
                .base_index_sha256 |
                select(type == "string" and test("^[0-9a-f]{64}$"))
              ' "$candidate_json"
          )"
          metadata_base_sha="$(
            jq -er '
              map(select(.name == "base-index.toml")) |
              select(length == 1) | .[0].digest |
              select(type == "string" and
                test("^sha256:[0-9a-f]{64}$")) |
              sub("^sha256:"; "")
            ' "$assets_before"
          )"
          actual_base_sha=$(sha256sum "$base_index" | awk '{print $1}')
          if [ "$actual_base_sha" != "$expected_base_sha" ] ||
             [ "$actual_base_sha" != "$metadata_base_sha" ]; then
            echo "::error::candidate base index differs from bound identity"
            exit 1
          fi
          release_after="$snapshot/release-after.json"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/${CANDIDATE_RELEASE_ID}" \
            >"$release_after"
          assets_after="$snapshot/assets-after.json"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases/${CANDIDATE_RELEASE_ID}/assets?per_page=100" \
            | jq -e 'add' >"$assets_after"
          jq -S '{id, tag_name, target_commitish, draft, immutable}' \
            "$release_before" >"$snapshot/before-identity.json"
          jq -S '{id, tag_name, target_commitish, draft, immutable}' \
            "$release_after" >"$snapshot/after-identity.json"
          jq -S 'sort_by(.name) |
            map({id, name, state, size, digest})' \
            "$assets_before" >"$snapshot/before-assets.json"
          jq -S 'sort_by(.name) |
            map({id, name, state, size, digest})' \
            "$assets_after" >"$snapshot/after-assets.json"
          if ! cmp "$snapshot/before-identity.json" \
              "$snapshot/after-identity.json" ||
             ! cmp "$snapshot/before-assets.json" \
              "$snapshot/after-assets.json"; then
            echo "::error::candidate release changed while it was snapshotted"
            exit 1
          fi
          # WHY: candidate assets can carry relative URLs. Keeping them beside
          # index.toml lets the credential-free resolver consume those exact
          # bytes while unchanged entries continue to use canonical URLs.
          test -f "$snapshot/candidate.json"
          test -f "$snapshot/base-index.toml"
          test -f "$snapshot/index.toml"

      - name: Upload exact candidate snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-candidate-${{ needs.preflight.outputs.candidate_release_id }}
          path: ${{ runner.temp }}/candidate-release
          if-no-files-found: error
          retention-days: 1

  test-gate-prepare:
    needs:
      [
        synthesize-merge,
        change-scope,
        preflight,
        toolchain-cache,
        promote-staging,
        lib-matrix-build,
        matrix-build,
        candidate-snapshot,
        staging-shell-snapshot,
      ]
    if: |
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.toolchain-cache.result == 'success' &&
      needs.preflight.result == 'success' &&
      (needs.candidate-snapshot.result == 'success' || needs.candidate-snapshot.result == 'skipped') &&
      (needs.promote-staging.result == 'success' || needs.promote-staging.result == 'skipped') &&
      (needs.lib-matrix-build.result == 'success' || needs.lib-matrix-build.result == 'skipped') &&
      (needs.matrix-build.result == 'success' || needs.matrix-build.result == 'skipped') &&
      (needs.staging-shell-snapshot.result == 'success' || needs.staging-shell-snapshot.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      merge_base_sha: ${{ steps.merge_ref.outputs.merge_base_sha }}
      candidate_index_sha256: ${{ steps.candidate_index.outputs.sha256 }}
    env:
      PACKAGE_STAGING_REQUIRED: ${{ needs.change-scope.outputs.package_staging_required }}
      STAGING_SHELL_AVAILABLE: ${{ needs.staging-shell-snapshot.outputs.available || 'false' }}
      STAGING_SHELL_RUN_ID: ${{ needs.staging-shell-snapshot.outputs.run_id }}
      USE_STAGING_SHELL_HANDOFF: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 1
          # WHY: all candidate bytes arrive as an Actions artifact. Synthetic
          # PR code therefore needs no repository credential after checkout.
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Download exact candidate snapshot
        if: env.PACKAGE_STAGING_REQUIRED == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merge-candidate-${{ needs.preflight.outputs.candidate_release_id }}
          path: ${{ runner.temp }}/candidate-release

      - name: Download the trusted staging shell handoff
        if: env.STAGING_SHELL_AVAILABLE == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.staging-shell-snapshot.outputs.artifact_name }}
          path: ${{ runner.temp }}/trusted-staging-shell

      - name: Bind candidate canonical base index
        id: candidate_canonical_index
        if: env.PACKAGE_STAGING_REQUIRED == 'true'
        env:
          CANDIDATE_TAG: ${{ needs.preflight.outputs.target_tag }}
          CANDIDATE_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          CANDIDATE_ABI: ${{ needs.preflight.outputs.abi }}
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/candidate-release"
          candidate_json="$candidate_root/candidate.json"
          base_index="$candidate_root/base-index.toml"
          if [ ! -f "$candidate_json" ] || [ -L "$candidate_json" ] ||
             [ ! -f "$base_index" ] || [ -L "$base_index" ]; then
            echo "::error::candidate snapshot lacks regular identity or base-index bytes"
            exit 1
          fi
          expected_sha="$(
            jq -er \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg tag "$CANDIDATE_TAG" \
              --arg head "$CANDIDATE_HEAD_SHA" \
              --arg canonical_tag "binaries-abi-v${CANDIDATE_ABI}" \
              --argjson abi "$CANDIDATE_ABI" '
                select(.repository == $repository and
                  .candidate_tag == $tag and .head_sha == $head and
                  .abi_version == $abi and
                  .canonical_tag == $canonical_tag and
                  (.canonical_base_state == "present" or
                    .canonical_base_state == "absent")) |
                .base_index_sha256 |
                select(type == "string" and test("^[0-9a-f]{64}$"))
              ' "$candidate_json"
          )"
          actual_sha=$(sha256sum "$base_index" | awk '{print $1}')
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::candidate base index differs from its bound digest"
            exit 1
          fi
          capture_dir="$RUNNER_TEMP/trusted-canonical-index"
          mkdir -p "$capture_dir"
          cp -p "$base_index" "$capture_dir/source-index.toml"
          echo "sha256=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Snapshot canonical index with trusted base
        id: public_canonical_index
        if: env.PACKAGE_STAGING_REQUIRED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ABI: ${{ needs.preflight.outputs.abi }}
          CANONICAL_TAG: ${{ needs.preflight.outputs.canonical_tag }}
        run: |
          set -euo pipefail
          capture_dir="$RUNNER_TEMP/trusted-canonical-index"
          mkdir -p "$capture_dir"
          source_index="$capture_dir/source-index.toml"
          head_file="$capture_dir/head"
          set +e
          bash scripts/release-index-state.sh snapshot \
            --target-tag "$CANONICAL_TAG" \
            --expected-abi "$EXPECTED_ABI" \
            --output "$source_index" \
            --head-file "$head_file"
          status=$?
          set -e
          case "$status" in
            0)
              if [ ! -f "$source_index" ] || [ -L "$source_index" ] ||
                 [ ! -f "$head_file" ] || [ -L "$head_file" ]; then
                echo "::error::canonical snapshot output is incomplete"
                exit 1
              fi
              ;;
            44)
              # WHY: only the trusted base helper may distinguish a confirmed
              # missing new-ABI release from an uncertain GitHub read.
              cat > "$source_index" <<EOF
          abi_version = $EXPECTED_ABI
          generated_at = "1970-01-01T00:00:00Z"
          generator = "confirmed-absent canonical CI snapshot"
          EOF
              ;;
            *)
              echo "::error::canonical release state is uncertain"
              exit "$status"
              ;;
          esac
          canonical_sha=$(sha256sum "$source_index" | awk '{print $1}')
          echo "sha256=$canonical_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout synthesized PR merge
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          if [ "$actual" != "$SYNTHETIC_MERGE_SHA" ]; then
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          fi
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          parents=$(git show --no-patch --format=%P HEAD)
          actual_base=$(printf '%s\n' "$parents" | awk '{print $1}')
          actual_head=$(printf '%s\n' "$parents" | awk '{print $2}')
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi

      - name: Capture synthesized merge base
        id: merge_ref
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$SYNTHETIC_MERGE_SHA" ]; then
            echo "::error::test-gate is not on synthetic merge $SYNTHETIC_MERGE_SHA"
            exit 1
          fi
          parents=$(git show --no-patch --format=%P HEAD)
          actual_base=$(printf "%s\n" "$parents" | awk "{print \$1}")
          actual_head=$(printf "%s\n" "$parents" | awk "{print \$2}")
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi
          echo "merge_base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Download toolchain sysroots artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolchain-sysroots
          path: ${{ runner.temp }}/toolchain

      - name: Extract toolchain sysroots
        run: |
          tar --zstd -xf "$RUNNER_TEMP/toolchain/toolchain-sysroots.tar.zst"

      - name: Install root npm dependencies for shell inspection
        run: |
          bash scripts/dev-shell.sh env \
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            npm ci --no-audit --no-fund

      - name: Materialize binaries
        id: candidate_index
        env:
          AUTHENTICATED_CANONICAL_INDEX_SHA256: ${{ steps.candidate_canonical_index.outputs.sha256 || steps.public_canonical_index.outputs.sha256 }}
          WASM_POSIX_FETCH_SKIP_PKGS: cpython erlang erlang-vfs perl perl-vfs python-vfs redis texlive
        # Package-changing PRs resolve the isolated candidate index. Its
        # unchanged entries carry absolute canonical URLs; changed entries
        # resolve from candidate assets or local build overlays.
        run: |
          set -euo pipefail
          canonical_source="$RUNNER_TEMP/trusted-canonical-index/source-index.toml"
          verify_canonical_source() {
            local actual
            if ! [[ "$AUTHENTICATED_CANONICAL_INDEX_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
               [ ! -f "$canonical_source" ] || [ -L "$canonical_source" ]; then
              echo "::error::trusted canonical snapshot handoff is invalid"
              exit 1
            fi
            actual=$(sha256sum "$canonical_source" | awk '{print $1}')
            if [ "$actual" != "$AUTHENTICATED_CANONICAL_INDEX_SHA256" ]; then
              echo "::error::trusted canonical snapshot changed after capture"
              exit 1
            fi
          }
          verify_canonical_source
          ABI=$(grep -oE "ABI_VERSION: u32 = [0-9]+" crates/shared/src/lib.rs | awk '{print $4}')
          EXPECTED="$RUNNER_TEMP/prepare-expected.json"
          BLOCKED="$RUNNER_TEMP/prepare-publication-blockers.json"
          bash scripts/dev-shell.sh env \
            EXPECTED="$EXPECTED" \
            BLOCKED="$BLOCKED" \
            PACKAGE_STAGING_EXCLUSIONS="$PACKAGE_STAGING_EXCLUSIONS" \
            ABI="$ABI" \
            bash -c '
              set -euo pipefail
              HOST_TARGET=$(rustc -vV | awk "/^host/ {print \$2}")
              cargo run --release -p xtask --target "$HOST_TARGET" --quiet -- \
                staging-reuse expected \
                  --registry packages/registry \
                  --expected-abi "$ABI" \
                  --exclude "$PACKAGE_STAGING_EXCLUSIONS" \
                  --output "$EXPECTED" \
                  --blocked-output "$BLOCKED"
            '
          verify_canonical_source
          CANONICAL_INDEX="$RUNNER_TEMP/canonical-browser-shell-index/index.toml"
          bash scripts/dev-shell.sh \
            bash scripts/materialize-ci-canonical-package-index.sh \
              "binaries-abi-v${ABI}" "$ABI" "$CANONICAL_INDEX" \
              --authenticated-snapshot \
              "$canonical_source"
          if [ "$PACKAGE_STAGING_REQUIRED" = "true" ]; then
            index_dir="$RUNNER_TEMP/tested-candidate-index"
            rm -rf "$index_dir"
            mkdir -p "$index_dir"
            cp -R "$RUNNER_TEMP/candidate-release/." "$index_dir/"
            mv "$index_dir/index.toml" "$index_dir/source-index.toml"
            sha=$(sha256sum "$index_dir/source-index.toml" | awk '{print $1}')
            export WASM_POSIX_BINARY_INDEX_URL="file://$index_dir/source-index.toml"
            echo "sha256=$sha" >> "$GITHUB_OUTPUT"
            echo "Captured source candidate index sha256:$sha before materialization"
          else
            # WHY: resolver and browser-state checks must share one snapshot.
            # Re-reading the mutable public tag here could race the trusted
            # base capture even though both reads were individually valid.
            export WASM_POSIX_BINARY_INDEX_URL="file://$CANONICAL_INDEX"
          fi
          echo "WASM_POSIX_BINARY_INDEX_URL=$WASM_POSIX_BINARY_INDEX_URL" >> "$GITHUB_ENV"
          use_staging_shell_handoff=false
          if jq -e 'any(.entries[]; .package == "shell")' \
              "$BLOCKED" >/dev/null && \
             [ "$STAGING_SHELL_AVAILABLE" = true ]; then
            handoff="$RUNNER_TEMP/trusted-staging-shell"
            parents="$(git show --no-patch --format=%P HEAD)"
            expected_base="$(printf '%s\n' "$parents" | awk '{print $1}')"
            expected_head="$(printf '%s\n' "$parents" | awk '{print $2}')"
            unexpected_parent="$(printf '%s\n' "$parents" | awk '{print $3}')"
            if ! [[ "$expected_base" =~ ^[0-9a-f]{40}$ ]] ||
               ! [[ "$expected_head" =~ ^[0-9a-f]{40}$ ]] ||
               [ -n "$unexpected_parent" ]; then
              echo "::error::staged shell requires the exact synthetic merge"
              exit 1
            fi
            expected_tree="$(git rev-parse 'HEAD^{tree}')"
            bash scripts/dev-shell.sh bash \
              scripts/verify-ci-staging-shell-handoff.sh \
                "$handoff/receipt.json" \
                "$handoff/main-shell.vfs.zst" \
                "$handoff/main-shell-report.json" \
                "$expected_base" \
                "$expected_head" \
                "$expected_tree" \
                "$STAGING_SHELL_RUN_ID"
            bash scripts/dev-shell.sh bash \
              scripts/install-local-shell-artifact.sh \
                "$handoff/main-shell.vfs.zst" \
                "prepare-staging-shell-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            use_staging_shell_handoff=true
            echo "USE_STAGING_SHELL_HANDOFF=true" >> "$GITHUB_ENV"
          fi
          bash scripts/dev-shell.sh bash scripts/fetch-binaries.sh \
            --fetch-only \
            --expected-ledger "$EXPECTED"
          state_receipt=""
          if jq -e 'any(.entries[]; .package == "shell")' \
              "$BLOCKED" >/dev/null; then
            if [ "$use_staging_shell_handoff" = true ]; then
              selected_shell="$(
                bash scripts/resolve-binary.sh programs/shell.vfs.zst
              )"
              SHELL_IMAGE="$(realpath "$selected_shell")"
              state_receipt="$RUNNER_TEMP/trusted-staging-shell/receipt.json"
            else
              SHELL_IMAGE="-"
            fi
          else
            SHELL_IMAGE="$(
              bash scripts/resolve-binary.sh programs/shell.vfs.zst \
                2>/dev/null || true
            )"
            [ -n "$SHELL_IMAGE" ] || SHELL_IMAGE="-"
          fi

      - name: Build kernel + test programs + rootfs
        # Browser downloads and suite-specific Node dependencies are installed
        # by the consumer jobs; preparation builds only shared test fixtures.
        run: |
          bash scripts/dev-shell.sh bash -c '
            set -euo pipefail
            export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
            cargo build --release -p kandelo \
              -Z build-std=core,alloc
            # WHY: this is a package-owned resolver mirror. Install the exact
            # candidate into an immutable local generation so later dependency
            # resolution cannot substitute released kernel bytes.
            source scripts/install-local-binary.sh
            WASM_POSIX_LOCAL_INSTALL_SESSION="ci-kernel-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}" \
              install_local_binary kernel \
                target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
                kandelo-kernel.wasm
            cmp target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
              local-binaries/kernel.wasm
            bash scripts/build-programs.sh
            bash scripts/build-rootfs.sh
          '

      - name: Pack prepared test workspace
        run: |
          set -euo pipefail
          pack_args=(
            --publication-blockers "$RUNNER_TEMP/prepare-publication-blockers.json"
          )
          if [ "$USE_STAGING_SHELL_HANDOFF" = true ]; then
            pack_args+=(
              --staging-shell-handoff
              "$RUNNER_TEMP/trusted-staging-shell"
            )
          fi
          bash scripts/dev-shell.sh bash \
            scripts/pack-ci-test-workspace.sh \
              "${pack_args[@]}" \
              "$RUNNER_TEMP/test-workspace.tar.zst"

      - name: Upload prepared test workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-workspace
          path: ${{ runner.temp }}/test-workspace.tar.zst
          retention-days: 1
          if-no-files-found: error

  test-suite:
    name: test-suite (${{ matrix.label }})
    needs: [synthesize-merge, change-scope, preflight, test-gate-prepare]
    if: |
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.test-gate-prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # WHY: ordinary files use two deterministic shards. Heavyweight
          # guest-runtime cases get fresh Vitest processes in a third cell so
          # resident memory from one case cannot carry into the next.
          - suite: vitest
            label: vitest (1/2)
            group: 1/2
            kernel_only: false
            submodules: ""
            needs_toolchain: true
            needs_workspace: true
          - suite: vitest
            label: vitest (2/2)
            group: 2/2
            kernel_only: false
            submodules: ""
            needs_toolchain: true
            needs_workspace: true
          - suite: vitest
            label: vitest (resource-isolated)
            group: resource-isolated
            kernel_only: false
            submodules: ""
            needs_toolchain: true
            needs_workspace: true
          - suite: browser
            label: browser
            group: all
            kernel_only: false
            submodules: ""
            needs_toolchain: true
            needs_workspace: true
          - suite: libc
            label: libc (functional + regression)
            group: functional-regression
            kernel_only: true
            submodules: tests/libc/libc-test
            needs_toolchain: true
            needs_workspace: true
          - suite: libc
            label: libc (math)
            group: math
            kernel_only: true
            submodules: tests/libc/libc-test
            needs_toolchain: true
            needs_workspace: true
          - suite: posix
            label: posix
            group: all
            kernel_only: true
            submodules: ""
            needs_toolchain: true
            needs_workspace: true
          - suite: sortix
            label: sortix (include)
            group: include
            kernel_only: true
            submodules: tests/sortix/os-test
            needs_toolchain: true
            needs_workspace: true
          - suite: sortix
            label: sortix (basic)
            group: basic
            kernel_only: true
            submodules: tests/sortix/os-test
            needs_toolchain: true
            needs_workspace: true
          - suite: sortix
            label: sortix (runtime)
            group: runtime
            kernel_only: true
            submodules: tests/sortix/os-test
            needs_toolchain: true
            needs_workspace: true
    env:
      KERNEL_CHANGED: ${{ needs.change-scope.outputs.kernel }}
      KERNEL_ONLY: ${{ matrix.kernel_only }}
      SUITE: ${{ matrix.suite }}
      TEST_GROUP: ${{ matrix.group }}
      PREPARE_BROWSER_ASSETS: ${{ matrix.suite == 'browser' }}
      VERIFY_BROWSER_PRODUCTION_BUILD: ${{ matrix.suite == 'browser' }}
      STAGES_NODE_VFS: ${{ needs.preflight.outputs.stages_node_vfs }}
    steps:
      - name: Decide whether to run suite
        id: suite
        run: |
          set -euo pipefail
          if [ "$KERNEL_ONLY" = "true" ] && [ "$KERNEL_CHANGED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$SUITE is kernel-only and this diff does not require kernel suites."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.suite.outputs.skip != 'true'
        with:
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.suite.outputs.skip != 'true'
        with:
          name: ${{ needs.synthesize-merge.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/synthetic-pr-merge

      - name: Checkout synthesized PR merge
        if: steps.suite.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ needs.synthesize-merge.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.synthesize-merge.outputs.head_sha }}
          SYNTHETIC_MERGE_SHA: ${{ needs.synthesize-merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$PR_HEAD_SHA"
          git fetch --quiet "$RUNNER_TEMP/synthetic-pr-merge/synthesized-merge.bundle" \
            "refs/heads/synthesized-merge:refs/remotes/origin/synthesized-merge"
          actual=$(git rev-parse refs/remotes/origin/synthesized-merge)
          if [ "$actual" != "$SYNTHETIC_MERGE_SHA" ]; then
            echo "::error::Synthetic merge bundle resolved to $actual, expected $SYNTHETIC_MERGE_SHA"
            exit 1
          fi
          git checkout --quiet --detach "$SYNTHETIC_MERGE_SHA"
          parents=$(git show --no-patch --format=%P HEAD)
          actual_base=$(printf '%s\n' "$parents" | awk '{print $1}')
          actual_head=$(printf '%s\n' "$parents" | awk '{print $2}')
          if [ "$actual_base" != "$BASE_SHA" ] || [ "$actual_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::Synthetic merge parent mismatch: parents=$parents base=$BASE_SHA head=$PR_HEAD_SHA"
            exit 1
          fi

      - name: Fetch suite submodule
        if: steps.suite.outputs.skip != 'true' && matrix.submodules != ''
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: ${{ matrix.submodules }}

      - name: Set up Nix
        if: steps.suite.outputs.skip != 'true'
        uses: ./.github/actions/setup-nix

      - name: Download toolchain sysroots artifact
        if: steps.suite.outputs.skip != 'true' && matrix.needs_toolchain == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolchain-sysroots
          path: ${{ runner.temp }}/toolchain

      - name: Extract toolchain sysroots
        if: steps.suite.outputs.skip != 'true' && matrix.needs_toolchain == true
        run: |
          tar --zstd -xf "$RUNNER_TEMP/toolchain/toolchain-sysroots.tar.zst"

      - name: Download prepared test workspace
        if: steps.suite.outputs.skip != 'true' && matrix.needs_workspace == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-workspace
          path: ${{ runner.temp }}/test-workspace

      - name: Extract prepared test workspace
        if: steps.suite.outputs.skip != 'true' && matrix.needs_workspace == true
        run: |
          tar --zstd -xf \
            "$RUNNER_TEMP/test-workspace/test-workspace.tar.zst"

      - name: Run ${{ matrix.label }} suite
        if: steps.suite.outputs.skip != 'true'
        # Suite controls must cross dev-shell.sh's --ignore-environment
        # boundary explicitly; otherwise every shard defaults to "all" and
        # the browser consumer skips its deferred asset preparation.
        run: |
          bash scripts/dev-shell.sh env \
            PREPARE_BROWSER_ASSETS="$PREPARE_BROWSER_ASSETS" \
            VERIFY_BROWSER_PRODUCTION_BUILD="$VERIFY_BROWSER_PRODUCTION_BUILD" \
            bash scripts/ci-run-test-suite.sh "$SUITE" "$TEST_GROUP"

      - name: Upload browser test artifacts
        if: failure() && steps.suite.outputs.skip != 'true' && matrix.suite == 'browser'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-artifacts
          path: |
            apps/browser-demos/test-results
          if-no-files-found: ignore
          retention-days: 7

  test-gate:
    needs:
      [
        change-scope,
        test-gate-validation,
        test-suite-early,
        test-gate-prepare,
        test-suite,
      ]
    if: |
      always() &&
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.test-gate-prepare.result != 'skipped'
    runs-on: ubuntu-latest
    outputs:
      merge_base_sha: ${{ steps.gate.outputs.merge_base_sha }}
      candidate_index_sha256: ${{ steps.gate.outputs.candidate_index_sha256 }}
    steps:
      - name: Check validation and split test suites
        id: gate
        env:
          MERGE_BASE_SHA: ${{ needs.test-gate-prepare.outputs.merge_base_sha }}
          VALIDATION_RESULT: ${{ needs.test-gate-validation.result }}
          EARLY_TEST_SUITE_RESULT: ${{ needs.test-suite-early.result }}
          PREPARE_RESULT: ${{ needs.test-gate-prepare.result }}
          TEST_SUITE_RESULT: ${{ needs.test-suite.result }}
        run: |
          set -euo pipefail
          echo "merge_base_sha=$MERGE_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_index_sha256=${{ needs.test-gate-prepare.outputs.candidate_index_sha256 }}" >> "$GITHUB_OUTPUT"
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "::error::source validation completed with result: $VALIDATION_RESULT"
            exit 1
          fi
          if [ "$EARLY_TEST_SUITE_RESULT" != "success" ]; then
            echo "::error::early test suites completed with result: $EARLY_TEST_SUITE_RESULT"
            exit 1
          fi
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "::error::test preparation completed with result: $PREPARE_RESULT"
            exit 1
          fi
          if [ "$TEST_SUITE_RESULT" != "success" ]; then
            echo "::error::split test suites completed with result: $TEST_SUITE_RESULT"
            exit 1
          fi

  # publish / generate-index / amend-package-toml — REMOVED.
  #
  # Per the binary-resolution-via-index-ledger design, each
  # matrix-build entry now publishes its archive AND mutates
  # index.toml atomically under the workflow-level state-lock
  # (see the "Publish archive + index entry" step in
  # lib-matrix-build / matrix-build above). The three former jobs
  # — separate publish, generate-index, and amend-package-toml —
  # are no longer needed:
  #
  #   * publish: per-entry steps upload to the release directly.
  #   * generate-index: index.toml is mutated per-entry by
  #     scripts/index-update.sh; no separate aggregation pass.
  #   * amend-package-toml: the index.toml ledger IS the consumer-
  #     visible state. There are no [binary] URLs in package.toml
  #     to amend; the bot-PR mechanism is gone.

  # ---------------------------------------------------------------------
  # merge-gate-post-noop — package staging was not required.
  #
  # Browser/docs/workflow-only PRs do not need PR staging archives and
  # must not trigger durable package builds on label. After the regular
  # review/check/mergeability gate succeeds, post the same merge-gate
  # success context without touching releases. A reviewer performs the merge.
  # ---------------------------------------------------------------------
  merge-gate-post-noop:
    needs: [synthesize-merge, gate, change-scope]
    if: |
      !cancelled() &&
      needs.gate.result == 'success' &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.change-scope.outputs.package_staging_required == 'false' &&
      needs.change-scope.outputs.test_gate_required == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read # verify the prepared base
      pull-requests: write # remove label + comment
      statuses: write # post merge-gate=success
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Verify prepared base is still current
        run: |
          set -euo pipefail
          PREPARED_BASE="${{ needs.synthesize-merge.outputs.base_sha }}"
          if [ -z "$PREPARED_BASE" ]; then
            echo "::error::synthesize-merge did not report base_sha"
            exit 1
          fi

          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git init --quiet "$RUNNER_TEMP/base-drift"
          cd "$RUNNER_TEMP/base-drift"
          git remote add origin "https://${{ github.token }}@github.com/${{ github.repository }}.git"
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          CURRENT_BASE=$(git rev-parse "refs/remotes/origin/$BASE_REF")

          if [ "$CURRENT_BASE" != "$PREPARED_BASE" ]; then
            gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship
            gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "Cannot prepare merge: \`$BASE_REF\` advanced while prepare-merge was running (prepared \`$PREPARED_BASE\`, current \`$CURRENT_BASE\`). Re-apply \`ready-to-ship\` so the no-op merge gate is based on the latest base."
            exit 1
          fi

      - name: Post merge-gate=success on original PR HEAD
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/statuses/$PR_HEAD_SHA" \
            -f state=success \
            -f context=merge-gate \
            -f description="No package or runtime-affecting changes; package staging skipped."

      - name: Comment on original PR
        continue-on-error: true
        run: |
          BODY="prepare-merge: no package or runtime-affecting changes; package staging and durable package publishing were skipped. \`merge-gate=success\` posted on PR HEAD. This PR is ready for a reviewer to ${PREPARE_MERGE_METHOD} merge."
          set +e
          for attempt in 1 2 3; do
            if gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "$BODY"; then
              exit 0
            fi
            echo "::warning::gh pr comment failed (attempt $attempt/3); retrying in 10s"
            sleep 10
          done
          echo "::warning::gh pr comment failed after 3 attempts; merge-gate was posted but the explanatory comment was not"

      - name: Drop label + comment on failure
        if: failure()
        run: |
          gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship || true
          gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "prepare-merge failed during the no-op merge-gate-post step. Check the workflow run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Re-apply the ready-to-ship label after fixing." || true

  # ---------------------------------------------------------------------
  # merge-gate-post-runtime-only — package staging was not required, but
  # runtime/materialization tests were.
  #
  # Non-archive runtime/materialization PRs should validate the synthetic
  # merge commit without building or publishing package archives. Once
  # test-gate passes against durable binaries plus the freshly built
  # kernel/test workspace, post the normal merge-gate context. A reviewer
  # performs the merge.
  # ---------------------------------------------------------------------
  merge-gate-post-runtime-only:
    needs: [gate, change-scope, test-gate]
    if: |
      !cancelled() &&
      needs.gate.result == 'success' &&
      needs.test-gate.result == 'success' &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.change-scope.outputs.package_staging_required == 'false' &&
      needs.change-scope.outputs.test_gate_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # verify the prepared base
      pull-requests: write # remove label + comment
      statuses: write # post merge-gate=success
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Verify prepared base is still current
        run: |
          set -euo pipefail
          PREPARED_BASE="${{ needs.test-gate.outputs.merge_base_sha }}"
          if [ -z "$PREPARED_BASE" ]; then
            echo "::error::test-gate did not report merge_base_sha"
            exit 1
          fi

          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git init --quiet "$RUNNER_TEMP/base-drift"
          cd "$RUNNER_TEMP/base-drift"
          git remote add origin "https://${{ github.token }}@github.com/${{ github.repository }}.git"
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          CURRENT_BASE=$(git rev-parse "refs/remotes/origin/$BASE_REF")

          if [ "$CURRENT_BASE" != "$PREPARED_BASE" ]; then
            gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship
            gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "Cannot prepare merge: \`$BASE_REF\` advanced while prepare-merge was running (prepared \`$PREPARED_BASE\`, current \`$CURRENT_BASE\`). Re-apply \`ready-to-ship\` so runtime/materialization tests run against the latest base."
            exit 1
          fi

      - name: Post merge-gate=success on original PR HEAD
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/statuses/$PR_HEAD_SHA" \
            -f state=success \
            -f context=merge-gate \
            -f description="Runtime test-gate passed; package staging and publishing skipped."

      - name: Comment on original PR
        continue-on-error: true
        run: |
          BODY="prepare-merge: runtime/materialization tests passed against the synthetic PR merge; package staging and durable package publishing were skipped. \`merge-gate=success\` posted on PR HEAD. This PR is ready for a reviewer to ${PREPARE_MERGE_METHOD} merge."
          set +e
          for attempt in 1 2 3; do
            if gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "$BODY"; then
              exit 0
            fi
            echo "::warning::gh pr comment failed (attempt $attempt/3); retrying in 10s"
            sleep 10
          done
          echo "::warning::gh pr comment failed after 3 attempts; merge-gate was posted but the explanatory comment was not"

      - name: Drop label + comment on failure
        if: failure()
        run: |
          gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship || true
          gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "prepare-merge failed during the runtime-only merge-gate-post step. Check the workflow run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Re-apply the ready-to-ship label after fixing." || true

  # ---------------------------------------------------------------------
  # merge-gate-post — single merge-gate poster.
  #
  # This job seals the exact candidate index exercised by test-gate,
  # posts merge-gate=success on the ORIGINAL PR head, and leaves the merge
  # to a reviewer. It does not write the canonical ABI release.
  #
  # Default-branch post-merge reconciliation verifies that the exact candidate
  # tree landed before one complete canonical-index update.
  # ---------------------------------------------------------------------
  merge-gate-post:
    needs: [synthesize-merge, gate, change-scope, preflight, test-gate]
    if: |
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.change-scope.outputs.package_staging_required == 'true' &&
      needs.preflight.result == 'success' &&
      needs.test-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read # verify a previous state-lock owner is terminal
      contents: write # seal the candidate release
      pull-requests: write # remove label + comment
      statuses: write # post merge-gate=success
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CANDIDATE_TAG: ${{ needs.preflight.outputs.target_tag }}
      CANDIDATE_RUN_ATTEMPT: ${{ needs.preflight.outputs.candidate_run_attempt }}
    steps:
      - name: Verify prepared base is still current
        run: |
          set -euo pipefail
          PREPARED_BASE="${{ needs.preflight.outputs.merge_base_sha }}"
          if [ -z "$PREPARED_BASE" ]; then
            echo "::error::preflight did not report merge_base_sha"
            exit 1
          fi

          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git init --quiet "$RUNNER_TEMP/base-drift"
          cd "$RUNNER_TEMP/base-drift"
          git remote add origin "https://${{ github.token }}@github.com/${{ github.repository }}.git"
          eval "$GIT_FETCH_RETRY_FUNC"
          git_fetch_retry --quiet --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          CURRENT_BASE=$(git rev-parse "refs/remotes/origin/$BASE_REF")

          if [ "$CURRENT_BASE" != "$PREPARED_BASE" ]; then
            gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship
            gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "Cannot prepare merge: \`$BASE_REF\` advanced while prepare-merge was running (prepared \`$PREPARED_BASE\`, current \`$CURRENT_BASE\`). Re-apply \`ready-to-ship\` so packages are validated against the latest base."
            exit 1
          fi

      - name: Checkout candidate lifecycle helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job has release-write authority. Execute lifecycle code from
          # the exact trusted base that was synthesized and tested, never from
          # the pull request whose candidate is being sealed.
          ref: ${{ needs.synthesize-merge.outputs.base_sha }}
          sparse-checkout: |
            .github/scripts

      - name: Seal candidate and publish merge authority
        run: |
          bash .github/scripts/mark-merge-candidate-ready.sh \
            --candidate-tag "$CANDIDATE_TAG" \
            --base-sha "${{ needs.synthesize-merge.outputs.base_sha }}" \
            --head-sha "${{ needs.synthesize-merge.outputs.head_sha }}" \
            --synthetic-tree-sha "${{ needs.synthesize-merge.outputs.tree_sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --candidate-index-sha256 "${{ needs.test-gate.outputs.candidate_index_sha256 }}"

      - name: Comment on original PR
        # Purely informational — the merge gate already succeeded. A transient
        # `gh pr comment` failure must not remove the label or report a false
        # merge-gate failure.
        continue-on-error: true
        run: |
          BODY="prepare-merge: test-gate passed against the synthetic PR merge and sealed [\`${CANDIDATE_TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${CANDIDATE_TAG}). The canonical ABI index is unchanged. \`merge-gate=success\` was posted on PR HEAD. This PR is ready for a reviewer to ${PREPARE_MERGE_METHOD} merge; default-branch reconciliation will verify the exact merged tree before activation."
          set +e
          for attempt in 1 2 3; do
            if gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "$BODY"; then
              exit 0
            fi
            echo "::warning::gh pr comment failed (attempt $attempt/3); retrying in 10s"
            sleep 10
          done
          echo "::warning::gh pr comment failed after 3 attempts; merge preparation succeeded but the explanatory comment was not posted"

      - name: Drop label + comment on failure
        if: failure()
        run: |
          gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} --remove-label ready-to-ship || true
          gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "prepare-merge failed during the merge-gate-post step. Check the workflow run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Re-apply the ready-to-ship label after fixing." || true
