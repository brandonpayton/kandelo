name: Promote durable package generation

# Snapshot one immutable producer after a versioned validation against current
# main into a content-addressed public prerelease. Both jobs execute only exact
# current-main authority; the producer checkout remains inert source data.
on:
  workflow_dispatch:
    inputs:
      source-tag:
        description: 'Exact published source tag containing the producer archives'
        required: true
        default: binaries-abi-v42
        type: string
      producer-sha:
        description: 'Full 40-character commit that produced the immutable package archives'
        required: true
        type: string
      validated-main-sha:
        description: 'Full 40-character current main commit that validates and publishes the generation'
        required: true
        type: string
      validation-method:
        description: 'How producer source is proven identical to validated current main'
        required: true
        default: identical-git-tree-v1
        type: choice
        options:
          - identical-git-tree-v1
          - identical-package-cache-projection-v1
      expected-abi:
        description: 'Kernel ABI carried by the package generation'
        required: true
        default: '42'
        type: string
      selection-kind:
        description: 'Promote one root package or the authoritative browser input root set'
        required: true
        default: root-package
        type: choice
        options:
          - root-package
          - browser-inputs
      root-package:
        description: 'Program root to promote; leave rootfs when selection-kind is browser-inputs'
        required: true
        default: rootfs
        type: string
      arch:
        description: 'Target architecture; browser inputs derive the imported roots for this architecture'
        required: true
        default: wasm32
        type: choice
        options:
          - wasm32
          - wasm64
permissions:
  contents: read

concurrency:
  group: durable-package-generation-${{ inputs.producer-sha }}-${{ inputs.validated-main-sha }}-${{ inputs.validation-method }}-${{ inputs.selection-kind }}-${{ inputs.root-package }}-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout current publishing authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: authority

      - name: Reject unsupported generation validation methods
        env:
          VALIDATION_METHOD: ${{ inputs.validation-method }}
        run: |
          set -euo pipefail
          # workflow_dispatch choices are a UI affordance, not an API
          # allowlist. Enforce the production contract before reading producer
          # data so a hand-crafted dispatch cannot select an unknown method.
          if ! [[ "$VALIDATION_METHOD" =~ ^(identical-git-tree-v1|identical-package-cache-projection-v1)$ ]]; then
            echo "unsupported generation validation method: $VALIDATION_METHOD" >&2
            exit 2
          fi

      - name: Checkout immutable package producer as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.producer-sha }}
          fetch-depth: 1
          persist-credentials: false
          path: producer

      - name: Set up declared build tools
        uses: ./authority/.github/actions/setup-nix

      - name: Install current browser-root parser dependencies
        if: inputs.selection-kind == 'browser-inputs'
        working-directory: authority
        run: |
          # Source data never supplies executable authority. Use only the
          # exact current main parser and lockfile.
          bash scripts/dev-shell.sh \
            npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the current source-data validator
        working-directory: authority
        run: |
          bash scripts/dev-shell.sh \
            bash .github/scripts/prepare-current-authority-validator.sh \
              --state-dir "$RUNNER_TEMP/promotion-prepare-authority-validator"

      - name: Validate and prepare the content-addressed generation
        working-directory: authority
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PRODUCER_SHA: ${{ inputs.producer-sha }}
          VALIDATED_MAIN_SHA: ${{ inputs.validated-main-sha }}
          VALIDATION_METHOD: ${{ inputs.validation-method }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          EXPECTED_ABI: ${{ inputs.expected-abi }}
          SELECTION_KIND: ${{ inputs.selection-kind }}
          ROOT_PACKAGE: ${{ inputs.root-package }}
          TARGET_ARCH: ${{ inputs.arch }}
          AUTHORITY_SHA: ${{ github.sha }}
          DEFAULT_REF: main
        run: |
          set -euo pipefail
          validator_state="$RUNNER_TEMP/promotion-prepare-authority-validator"
          authority_xtask="$(cat "$validator_state/xtask-path")"
          authority_cargo_home="$(cat "$validator_state/cargo-home-path")"
          selection_args=(--root-package "$ROOT_PACKAGE")
          if [ "$SELECTION_KIND" = browser-inputs ]; then
            [ "$ROOT_PACKAGE" = rootfs ] || {
              echo "root-package must retain its rootfs default for browser-inputs" >&2
              exit 2
            }
            selection_args=(--browser-inputs)
          elif [ "$SELECTION_KIND" != root-package ]; then
            echo "unsupported package selection kind: $SELECTION_KIND" >&2
            exit 2
          fi
          bash scripts/dev-shell.sh \
            env CARGO_HOME="$authority_cargo_home" \
              bash .github/scripts/prepare-durable-package-generation.sh \
                --source-tag "$SOURCE_TAG" \
                --producer-root "$GITHUB_WORKSPACE/producer" \
                --producer-sha "$PRODUCER_SHA" \
                --validated-main-sha "$VALIDATED_MAIN_SHA" \
                --validation-method "$VALIDATION_METHOD" \
                --authority-sha "$AUTHORITY_SHA" \
                --default-ref "$DEFAULT_REF" \
                --expected-abi "$EXPECTED_ABI" \
                --arch "$TARGET_ARCH" \
                --repository "$GITHUB_REPOSITORY" \
                --output-dir "$RUNNER_TEMP/package-generation" \
                --authority-xtask "$authority_xtask" \
                "${selection_args[@]}"
          echo "Prepared $(jq -r .tag "$RUNNER_TEMP/package-generation/generation.json")"

      - name: Transfer the inert generation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-package-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-generation
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout current publishing authority without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: authority

      - name: Checkout immutable package producer as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.producer-sha }}
          fetch-depth: 1
          persist-credentials: false
          path: producer

      - name: Set up declared build tools
        uses: ./authority/.github/actions/setup-nix

      - name: Install current browser-root parser dependencies
        if: inputs.selection-kind == 'browser-inputs'
        working-directory: authority
        run: |
          # The writer independently derives roots from exact main; it does not
          # trust the roots embedded in the transferred preparation artifact.
          bash scripts/dev-shell.sh \
            npm ci --ignore-scripts --no-audit --no-fund

      - name: Build current authority validator
        working-directory: authority
        run: |
          bash scripts/dev-shell.sh \
            bash .github/scripts/prepare-current-authority-validator.sh \
              --state-dir "$RUNNER_TEMP/promotion-publish-authority-validator"

      - name: Download the inert generation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: durable-package-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-generation

      - name: Revalidate, publish, and anonymously read back every asset
        working-directory: authority
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          PRODUCER_SHA: ${{ inputs.producer-sha }}
          VALIDATED_MAIN_SHA: ${{ inputs.validated-main-sha }}
          VALIDATION_METHOD: ${{ inputs.validation-method }}
          EXPECTED_ABI: ${{ inputs.expected-abi }}
          SELECTION_KIND: ${{ inputs.selection-kind }}
          ROOT_PACKAGE: ${{ inputs.root-package }}
          TARGET_ARCH: ${{ inputs.arch }}
          AUTHORITY_SHA: ${{ github.sha }}
          DEFAULT_REF: main
        run: |
          set -euo pipefail
          validator_state="$RUNNER_TEMP/promotion-publish-authority-validator"
          authority_xtask="$(cat "$validator_state/xtask-path")"
          authority_cargo_home="$(cat "$validator_state/cargo-home-path")"
          bash scripts/dev-shell.sh \
            env CARGO_HOME="$authority_cargo_home" \
              bash .github/scripts/publish-durable-package-generation.sh \
                --bundle "$RUNNER_TEMP/package-generation" \
                --authority-xtask "$authority_xtask" \
                --lock-root "$GITHUB_WORKSPACE/authority" \
                --receipt "$RUNNER_TEMP/package-generation-receipt.json" \
                --source-tag "$SOURCE_TAG" \
                --producer-sha "$PRODUCER_SHA" \
                --producer-root "$GITHUB_WORKSPACE/producer" \
                --validated-main-sha "$VALIDATED_MAIN_SHA" \
                --validation-method "$VALIDATION_METHOD" \
                --expected-abi "$EXPECTED_ABI" \
                --selection-kind "$SELECTION_KIND" \
                --root-package "$ROOT_PACKAGE" \
                --arch "$TARGET_ARCH" \
                --authority-sha "$AUTHORITY_SHA" \
                --default-ref "$DEFAULT_REF"
          tag="$(jq -r .tag "$RUNNER_TEMP/package-generation/generation.json")"
          {
            echo "## Durable package generation"
            echo
            echo "- Tag: \`$tag\`"
            echo "- Immutable package producer: \`${{ inputs.producer-sha }}\`"
            echo "- Producer release: \`${{ inputs.source-tag }}\`"
            echo "- Validated current main: \`${{ inputs.validated-main-sha }}\`"
            echo "- Validation method: \`${{ inputs.validation-method }}\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Retain the exact publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-package-generation-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-generation-receipt.json
          if-no-files-found: error
          retention-days: 30
