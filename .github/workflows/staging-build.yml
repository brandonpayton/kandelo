name: Staging build

# Builds per-PR archives whose cache_key_sha differs from each
# package's durable [binary.<arch>] pin. Uploads them to a
# run-specific PR staging draft. The test gate publishes the completed
# attempt once for reviewers and CI to consume through the resolver.
#
# All build steps run inside `scripts/dev-shell.sh` for a reproducible
# Rust/LLVM/Node toolchain (see flake.nix). The wrapper enters
# `nix develop --ignore-environment` so only flake-declared deps are
# visible — host /usr/bin tools that aren't in the flake won't leak in.
#
# See docs/plans/2026-04-29-pr-package-builds-design.md §4.1.
#
# Same-repo PRs only. Fork-PR support is documented as future work in
# §9.1 of the design doc.

on:
  pull_request:
    # WHY: Marking a draft ready is the non-destructive rerun control for
    # the exact product gate. Closing a package PR can invoke cleanup.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

# Serialize concurrent runs on the same PR so a slow build doesn't
# step on a fresher push or label state. cancel-in-progress: true means
# a new push/label event aborts an in-flight run — fine, the overlay is
# content-keyed.
#
# `labeled`/`unlabeled` is only active for the skip-staging-tests label.
# Other PR labels, including ready-to-ship, get an isolated concurrency
# group so they cannot cancel a real staging run before the jobs skip.
concurrency:
  group: staging-build-pr-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'skip-staging-tests' && github.run_id || 'active' }}
  cancel-in-progress: true

# One publication selection contract feeds preflight, matrices, and test-gate.
# Resolver-only skips may narrow that ledger for heavy runtimes, but can never
# add a package that publication policy omitted.
env:
  PACKAGE_STAGING_EXCLUSIONS: erlang-vfs,perl,perl-vfs,python-vfs,redis,texlive

jobs:
  # ---------------------------------------------------------------------
  # Decoupled package builds — staging-build's sole flow.
  #
  # Phase C Task 6 retired the monolithic legacy `build:` job that
  # previously ran the full registry walk + bulk publish + tests in
  # one runner. Today every staging build flows through the per-
  # package matrix below: preflight → toolchain-cache → matrix-build,
  # with source validation and Cargo tests running in parallel before the
  # prepared-workspace suites converge at test-gate → f2-status. Each
  # matrix-build job publishes its own
  # archive + index.toml entry atomically via
  # `scripts/index-update.sh`. See
  # docs/plans/2026-05-05-decoupled-package-builds-design.md for the
  # design and docs/binary-releases.md for the consumer-side flow.
  # ---------------------------------------------------------------------

  change-scope:
    # Fork-PR support is deferred (design doc §9.1). Keep the same
    # same-repo security boundary as the package build jobs.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.action != 'labeled' &&
        github.event.action != 'unlabeled' ||
        github.event.label.name == 'skip-staging-tests'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      kernel: ${{ steps.scope.outputs.kernel }}
      package_archive_changed: ${{ steps.scope.outputs.package_archive_changed }}
      package_publish_flow_changed: ${{ steps.scope.outputs.package_publish_flow_changed }}
      binary_materialization_changed: ${{ steps.scope.outputs.binary_materialization_changed }}
      kernel_runtime_changed: ${{ steps.scope.outputs.kernel_runtime_changed }}
      test_gate_required: ${{ steps.route.outputs.test_gate_required }}
      exact_abi_staging_applicable: ${{ steps.exact-abi.outputs.exact_abi_staging_applicable }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      package_staging_required: ${{ steps.route.outputs.package_staging_required }}
      package_staging_reason: ${{ steps.route.outputs.package_staging_reason }}
      skip_staging_tests: ${{ steps.skip.outputs.skip_staging_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect staging test skip label
        id: skip
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'skip-staging-tests') }}" = "true" ]; then
            echo "skip_staging_tests=true" >> "$GITHUB_OUTPUT"
            echo "::notice::skip-staging-tests label present; staging-build will materialize artifacts and defer expensive tests to prepare-merge."
          else
            echo "skip_staging_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect package staging scope
        id: scope
        uses: ./.github/actions/detect-change-scope
        with:
          base-ref: origin/${{ github.event.pull_request.base.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: abi-staging-authority
          fetch-depth: 1

      # WHY: the protected classifier enters its own dev shell, so its build
      # tools must come from the same protected checkout rather than PR code.
      - name: Set up protected exact ABI build tools
        uses: ./abi-staging-authority/.github/actions/setup-nix

      - name: Derive protected exact ABI staging route
        id: exact-abi
        env:
          AUTHORITY_ROOT: ${{ github.workspace }}/abi-staging-authority
          EXACT_HEAD_ROOT: ${{ github.workspace }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RAW_PACKAGE_STAGING_REQUIRED: ${{ steps.scope.outputs.package_staging_required }}
        run: |
          set -euo pipefail
          classifier="$AUTHORITY_ROOT/.github/scripts/classify-exact-abi-staging.sh"
          for protected_dir in \
            "$AUTHORITY_ROOT" \
            "$AUTHORITY_ROOT/.github" \
            "$AUTHORITY_ROOT/.github/scripts"
          do
            if [ -L "$protected_dir" ] || [ ! -d "$protected_dir" ]; then
              echo "::error::protected exact ABI classifier ancestor is not a real directory"
              exit 1
            fi
          done
          if [ -L "$classifier" ] || { [ -e "$classifier" ] && [ ! -f "$classifier" ]; }; then
            echo "::error::protected exact ABI classifier is not a regular file"
            exit 1
          fi
          if [ ! -e "$classifier" ]; then
            case "$RAW_PACKAGE_STAGING_REQUIRED" in
              true | false) ;;
              *)
                echo "::error::invalid protected-classifier bootstrap state"
                exit 1
                ;;
            esac
            printf '%s\n' \
              'exact_abi_staging_applicable=false' \
              "legacy_package_staging_required=$RAW_PACKAGE_STAGING_REQUIRED" \
              'exact_abi_staging_reason=protected-classifier-unavailable' \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash "$classifier" \
            --authority-root "$AUTHORITY_ROOT" \
            --exact-head-root "$EXACT_HEAD_ROOT" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --raw-package-staging-required \
              "$RAW_PACKAGE_STAGING_REQUIRED" \
            --github-output "$GITHUB_OUTPUT"

      - name: Route publisher-only validation
        id: route
        env:
          PACKAGE_STAGING_REQUIRED: ${{ steps.scope.outputs.package_staging_required }}
          RAW_TEST_GATE_REQUIRED: ${{ steps.scope.outputs.test_gate_required }}
          RAW_PACKAGE_STAGING_REASON: ${{ steps.scope.outputs.package_staging_reason }}
          EXACT_ABI_STAGING_APPLICABLE: ${{ steps.exact-abi.outputs.exact_abi_staging_applicable }}
          LEGACY_PACKAGE_STAGING_REQUIRED: ${{ steps.exact-abi.outputs.legacy_package_staging_required }}
          EXACT_ABI_STAGING_REASON: ${{ steps.exact-abi.outputs.exact_abi_staging_reason }}
        run: |
          set -euo pipefail
          for state in \
            "$PACKAGE_STAGING_REQUIRED" \
            "$RAW_TEST_GATE_REQUIRED" \
            "$EXACT_ABI_STAGING_APPLICABLE" \
            "$LEGACY_PACKAGE_STAGING_REQUIRED"
          do
            case "$state" in
              true | false) ;;
              *)
                echo "::error::invalid staging scope state: $state"
                exit 1
                ;;
            esac
          done
          if [ "$EXACT_ABI_STAGING_APPLICABLE" = true ]; then
            [ "$LEGACY_PACKAGE_STAGING_REQUIRED" = false ]
            {
              echo "package_staging_required=false"
              echo "test_gate_required=true"
              echo "package_staging_reason=$EXACT_ABI_STAGING_REASON"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "package_staging_required=$LEGACY_PACKAGE_STAGING_REQUIRED"
              echo "test_gate_required=$RAW_TEST_GATE_REQUIRED"
              echo "package_staging_reason=$RAW_PACKAGE_STAGING_REASON"
            } >> "$GITHUB_OUTPUT"
          fi

  preflight:
    # Fork-PR support is deferred (design doc §9.1). The gate below
    # keeps fork PRs from hitting a no-token `gh release view` failure
    # inside the matrix-compute step.
    needs: [change-scope]
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      (
        needs.change-scope.outputs.package_staging_required == 'true' ||
        needs.change-scope.outputs.test_gate_required == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # gh release view (target tag probe)
      statuses: write # post pending merge-gate status with helpful description
    outputs:
      library_matrix: ${{ steps.compute.outputs.library_matrix }}
      program_matrix: ${{ steps.compute.outputs.program_matrix }}
      staged_matrix: ${{ steps.compute.outputs.staged_matrix }}
      stages_node_vfs: ${{ steps.compute.outputs.stages_node_vfs }}
      repair_index: ${{ steps.compute.outputs.repair_index }}
      abi: ${{ steps.compute.outputs.abi }}
      target_tag: ${{ steps.compute.outputs.target_tag }}
      baseline_tag: ${{ steps.compute.outputs.baseline_tag }}
      reuse_staging: ${{ steps.compute.outputs.reuse_staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch musl submodule
        # compute-cache-key-sha walks the package's source/build inputs
        # to derive a deterministic hash. It does NOT need libc-test or
        # os-test (those are test inputs, not build inputs). musl is
        # pulled in case any package's [build] dependency chain reaches
        # into the sysroot recipe.
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: libc/musl

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Warm Nix dev shell
        run: bash scripts/dev-shell.sh true

      - name: Cache xtask build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: preflight-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/xtask/**') }}
          restore-keys: |
            preflight-${{ runner.os }}-

      - name: Build xtask
        run: |
          bash scripts/dev-shell.sh bash -c '
            HOST_TARGET=$(rustc -vV | awk "/^host/ {print \$2}")
            cargo build --release -p xtask --target "$HOST_TARGET"
          '

      - name: Compute matrix
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/dev-shell.sh env \
            PACKAGE_STAGING_EXCLUSIONS="$PACKAGE_STAGING_EXCLUSIONS" \
            bash -c '
            set -euo pipefail
            PACKAGE_STAGING_REQUIRED="${{ needs.change-scope.outputs.package_staging_required }}"

            ABI=$(grep -oE "ABI_VERSION: u32 = [0-9]+" crates/shared/src/lib.rs | awk "{print \$4}")
            echo "abi=$ABI" >> "$GITHUB_OUTPUT"

            # WHY: a published immutable release cannot be reused by a later
            # push or rerun. Bind staging state to the exact workflow attempt.
            TARGET_TAG="pr-${{ github.event.pull_request.number }}-staging-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            BASELINE_TAG="binaries-abi-v${ABI}"
            echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

            if [ "$PACKAGE_STAGING_REQUIRED" != "true" ]; then
              echo "baseline_tag=$BASELINE_TAG" >> "$GITHUB_OUTPUT"
              echo "reuse_staging=false" >> "$GITHUB_OUTPUT"
              echo "library_matrix=[]" >> "$GITHUB_OUTPUT"
              echo "program_matrix=[]" >> "$GITHUB_OUTPUT"
              echo "staged_matrix=[]" >> "$GITHUB_OUTPUT"
              echo "stages_node_vfs=false" >> "$GITHUB_OUTPUT"
              echo "repair_index=false" >> "$GITHUB_OUTPUT"
              echo "preflight: package staging not required; skipping package drift matrix"
              exit 0
            fi

            # One-shot fetch of existing release assets for fast lookup.
            # Falls back to empty list if the release doesn'"'"'t exist
            # yet (new ABI, new PR) — that just means everything in the
            # matrix needs to build.
            existing_assets=$(gh release view "$BASELINE_TAG" --repo "${{ github.repository }}" --json assets --jq "[.assets[].name]" 2>/dev/null || echo "[]")
            echo "existing-assets:"
            echo "$existing_assets" | jq -r ".[0:20][]"
            echo "..."
            existing_index_dir=$(mktemp -d)
            existing_index="$existing_index_dir/index.toml"
            if gh release download "$BASELINE_TAG" --repo "${{ github.repository }}" --pattern index.toml --dir "$existing_index_dir" --clobber >/dev/null 2>&1; then
              echo "existing-index: downloaded $BASELINE_TAG/index.toml"
            else
              echo "existing-index: none"
              : > "$existing_index"
            fi
            repair_index=0
            if [ -s "$existing_index" ]; then
              existing_index_abi=$(sed -nE "s/^abi_version *= *([0-9]+).*$/\\1/p" "$existing_index" | head -n1)
              if [ "$existing_index_abi" != "$ABI" ]; then
                echo "preflight: $BASELINE_TAG/index.toml declares ABI ${existing_index_abi:-unknown}; expected $ABI; ignoring baseline index"
                : > "$existing_index"
                existing_assets="[]"
              fi
            fi

            HOST_TARGET=$(rustc -vV | awk "/^host/ {print \$2}")
            library_matrix="[]"
            program_matrix="[]"

            expected_ledger=$(mktemp)
            XTASK="target/$HOST_TARGET/release/xtask"
            "$XTASK" staging-reuse expected \
              --registry packages/registry \
              --expected-abi "$ABI" \
              --exclude "$PACKAGE_STAGING_EXCLUSIONS" \
              --output "$expected_ledger"

            # Reusing individual assets from a partial mutable release is not
            # safe: an empty matrix would then make test-gate resolve entries
            # that were never proven present. Promote the PR release to the
            # zero-build candidate only after its complete ledger and every
            # referenced asset have been validated as one snapshot.
            reuse_staging=false
            reuse_dir=$(mktemp -d)
            rm -rf "$reuse_dir"
            if bash .github/scripts/validate-staging-release.sh \
                --tag "$TARGET_TAG" \
                --expected-ledger "$expected_ledger" \
                --mode structural \
                --output-dir "$reuse_dir" \
                --xtask "$XTASK"; then
              stale_expected=$(mktemp)
              jq --slurpfile snapshot "$reuse_dir/snapshot.json" "
                .entries |= map(. as \$expected |
                  select(any(\$snapshot[0].entries[];
                    .package == \$expected.package and
                    .arch == \$expected.arch and
                    .current == false)))
              " "$expected_ledger" > "$stale_expected"
              stale_count=$(jq ".entries | length" "$stale_expected")
              if [ "$stale_count" -eq 0 ]; then
                reuse_staging=target
                echo "preflight: reusing fully current, asset-verified $TARGET_TAG"
              else
                canonical_reuse_dir=$(mktemp -d)
                rm -rf "$canonical_reuse_dir"
                if bash .github/scripts/validate-staging-release.sh \
                    --tag "$BASELINE_TAG" \
                    --expected-ledger "$stale_expected" \
                    --mode current \
                    --output-dir "$canonical_reuse_dir" \
                    --xtask "$XTASK"; then
                  reuse_staging=union
                  echo "preflight: target supplies current entries and $BASELINE_TAG supplies all $stale_count stale target entries"
                else
                  echo "preflight: canonical release cannot complete the current target ledger"
                fi
              fi
            else
              echo "preflight: $TARGET_TAG is absent, partial, ambiguous, or invalid; retaining canonical baseline"
            fi
            echo "baseline_tag=$BASELINE_TAG" >> "$GITHUB_OUTPUT"
            echo "reuse_staging=$reuse_staging" >> "$GITHUB_OUTPUT"

            # WHY: matrix membership comes from the same Rust-owned ledger
            # that release reuse validates. This keeps pending packages and
            # their full reverse-dependent closure out of both contracts.
            while IFS= read -r expected_entry; do
              pkg=$(echo "$expected_entry" | jq -r .package)
              kind=$(echo "$expected_entry" | jq -r .kind)
              arch=$(echo "$expected_entry" | jq -r .arch)
              sha=$(echo "$expected_entry" | jq -r .cache_key_sha)
              version=$(echo "$expected_entry" | jq -r .version)
              revision=$(echo "$expected_entry" | jq -r .revision)
              short=${sha:0:8}
              if [ "$reuse_staging" != false ] &&
                   jq -e --arg pkg "$pkg" --arg arch "$arch" "
                     .entries[] |
                     select(.package == \$pkg and .arch == \$arch and .current == true)
                   " "$reuse_dir/snapshot.json" >/dev/null; then
                  echo "preflight: skip $pkg/$arch (sha $short verified in $TARGET_TAG)"
                  continue
              fi
              if [ "$reuse_staging" = union ] &&
                   jq -e --arg pkg "$pkg" --arg arch "$arch" "
                     .entries[] |
                     select(.package == \$pkg and .arch == \$arch and .current == true)
                   " "$canonical_reuse_dir/snapshot.json" >/dev/null; then
                  echo "preflight: skip $pkg/$arch (sha $short verified in $BASELINE_TAG supplement)"
                  continue
              fi
              prefix="${pkg}-"
              suffix="-abi${ABI}-${arch}-${short}.tar.zst"
              existing_archive=$(echo "$existing_assets" | jq -r --arg pre "$prefix" --arg suf "$suffix" \
                  "first(.[] | select(startswith(\$pre) and endswith(\$suf))) // \"\"")
              if [ -n "$existing_archive" ] && scripts/index-has-current-entry.sh "$existing_index" "$pkg" "$arch" "$sha" "$revision"; then
                echo "preflight: skip $pkg/$arch (sha $short already indexed)"
                continue
              fi
              entry=$(jq -nc --arg pkg "$pkg" --arg arch "$arch" --arg sha "$sha" \
                              --arg ver "$version" --argjson rev "$revision" \
                "{package: \$pkg, arch: \$arch, sha: \$sha, version: \$ver, revision: \$rev}")
              if [ "$kind" = "library" ]; then
                library_matrix=$(echo "$library_matrix" | jq -c --argjson e "$entry" ". + [\$e]")
              else
                program_matrix=$(echo "$program_matrix" | jq -c --argjson e "$entry" ". + [\$e]")
              fi
            done < <(jq -c ".entries[]" "$expected_ledger")

            program_matrix_file=$(mktemp)
            printf "%s" "$program_matrix" > "$program_matrix_file"
            program_matrix=$("$XTASK" sort-package-matrix \
                --registry packages/registry \
                --matrix "$program_matrix_file")
            rm -f "$program_matrix_file"

            library_count=$(echo "$library_matrix" | jq length)
            program_count=$(echo "$program_matrix" | jq length)
            if [ "$reuse_staging" != false ] &&
               { [ "$library_count" -ne 0 ] || [ "$program_count" -ne 0 ]; }; then
              echo "preflight: validated target/canonical union did not cover the computed matrix" >&2
              exit 1
            fi
            repair_index_output=false
            if [ "$repair_index" = "1" ] && [ "$library_count" -eq 0 ] && [ "$program_count" -eq 0 ]; then
              repair_index_output=true
              echo "preflight: no package updates selected; scheduling $TARGET_TAG/index.toml metadata repair"
            elif [ "$repair_index" = "1" ]; then
              echo "preflight: package update jobs will repair $TARGET_TAG/index.toml metadata"
            fi

            # WHY: build matrices say what this attempt must compile. The
            # consumer needs the subtly different authority set: every row
            # whose bytes must come from the exact sealed PR release. Reused
            # releases can own rows without scheduling a new build.
            case "$reuse_staging" in
              false)
                staged_matrix=$(jq -cn \
                  --argjson libraries "$library_matrix" \
                  --argjson programs "$program_matrix" \
                  "\$libraries + \$programs")
                ;;
              target)
                staged_matrix=$(jq -c "
                  [.entries[] | {
                    package,
                    arch,
                    sha: .cache_key_sha,
                    version,
                    revision
                  }]
                " "$expected_ledger")
                ;;
              union)
                staged_matrix=$(jq -c --slurpfile snapshot \
                  "$reuse_dir/snapshot.json" "
                  [.entries[] as \$expected |
                    select(any(\$snapshot[0].entries[];
                      .package == \$expected.package and
                      .arch == \$expected.arch and
                      .current == true)) |
                    \$expected | {
                      package,
                      arch,
                      sha: .cache_key_sha,
                      version,
                      revision
                    }]
                " "$expected_ledger")
                ;;
              *)
                echo "preflight: invalid staging reuse authority: $reuse_staging" >&2
                exit 1
                ;;
            esac
            staged_count=$(echo "$staged_matrix" | jq length)
            if [ "$staged_count" -eq 0 ]; then
              echo "preflight: staging requires at least one exact target-owned row" >&2
              exit 1
            fi
            stages_node_vfs=$(jq -r \
              "any(.[]; .package == \"node-vfs\" and .arch == \"wasm32\")" \
              <<<"$staged_matrix")

            echo "library_matrix=$library_matrix" >> "$GITHUB_OUTPUT"
            echo "program_matrix=$program_matrix" >> "$GITHUB_OUTPUT"
            echo "staged_matrix=$staged_matrix" >> "$GITHUB_OUTPUT"
            echo "stages_node_vfs=$stages_node_vfs" >> "$GITHUB_OUTPUT"
            echo "repair_index=$repair_index_output" >> "$GITHUB_OUTPUT"
            echo "preflight: library=$library_count program=$program_count staged=$staged_count repair-index=$repair_index_output"
            echo "library_matrix:"; echo "$library_matrix" | jq .
            echo "program_matrix:"; echo "$program_matrix" | jq .
            echo "staged_matrix:"; echo "$staged_matrix" | jq .
          '

      - name: Post pending merge-gate status (instructs reviewer)
        # Branch protection on `main` requires a `merge-gate` status
        # context (posted as success by prepare-merge.yml after the
        # ready-to-ship label triggers a durable release). Without
        # this step, GitHub's merge UI shows the generic "Waiting
        # for status to be reported" — unhelpful. Posting `pending`
        # with our own description replaces that text with actionable
        # guidance. prepare-merge.yml later overwrites the same
        # context with state=success on the lockfile-bump commit.
        #
        # Skip the post if `merge-gate` is already `success` on this
        # SHA. A staging-build rerun may overlap or follow a completed
        # Prepare merge run. Without this guard, it would overwrite the
        # tested success with pending and block the reviewer's merge.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh api \
            "/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/status" \
            --jq '[.statuses[] | select(.context == "merge-gate")] | .[0].state // ""')
          if [ "$existing" = "success" ]; then
            echo "merge-gate already success on ${{ github.event.pull_request.head.sha }}; skipping pending post."
            exit 0
          fi
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=pending \
            -f context=merge-gate \
            -f description="Tests green. Apply the ready-to-ship label to build the durable release and merge." \
            -f target_url="https://github.com/${{ github.repository }}/blob/main/docs/plans/2026-04-29-pr-package-builds-design.md"

  package-staging-not-required:
    needs: [change-scope]
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.change-scope.outputs.package_staging_required == 'false' &&
      needs.change-scope.outputs.test_gate_required == 'false' &&
      needs.change-scope.outputs.skip_staging_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Post merge-gate success for no-op package staging
        run: |
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success \
            -f context=merge-gate \
            -f description="No package or runtime-affecting changes; package staging skipped." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  toolchain-cache:
    # Same fork-PR gate as preflight + the legacy `build` job. Fork PRs
    # see this job as Skipped, consistent with current behavior.
    needs: [change-scope]
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.change-scope.outputs.package_staging_required == 'true' ||
       needs.change-scope.outputs.test_gate_required == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare package toolchain
        uses: ./.github/actions/package-toolchain

  # Library wave — kind=library packages build first. Each runner
  # uploads its archive as `<lib>-<arch>` so the program wave below
  # can pull them via package.pr.toml file:// overlays. This dedupes
  # library builds across the matrix: each library compiles exactly
  # once per arch, instead of once per dependent program.
  lib-matrix-build:
    needs: [change-scope, preflight, toolchain-cache]
    if: ${{ needs.change-scope.outputs.exact_abi_staging_applicable != 'true' && needs.preflight.result == 'success' && needs.toolchain-cache.result == 'success' && needs.preflight.outputs.library_matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read # download toolchain artifact
      contents: write # state-lock git push + gh release create/upload
    env:
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.baseline_tag }}/index.toml
    strategy:
      fail-fast: false
      # Keep GitHub codeload/action downloads and the staging index state-lock
      # below abuse-throttle territory, especially when stacked PRs trigger
      # independent staging runs at the same time.
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.library_matrix) }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build ${{ matrix.package }} (${{ matrix.arch }})
        id: build
        uses: ./.github/actions/package-archive-build
        with:
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          build-host: ${{ github.repository }}@${{ github.event.pull_request.head.sha }}
          source-repository: https://github.com/${{ github.repository }}
          source-commit: ${{ github.event.pull_request.head.sha }}
          expected-cache-key-sha: ${{ matrix.sha }}

      # Atomic per-matrix-entry write to this attempt's staging draft.
      # Different state-lock subjects from durable-release, so PR
      # staging publishes don't block prepare-merge runs.
      - name: Publish archive + index entry
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/index-update.sh \
            --target-tag "${{ needs.preflight.outputs.target_tag }}" \
            --release-target-commit "${{ github.event.pull_request.head.sha }}" \
            --package "${{ matrix.package }}" \
            --version "${{ matrix.version }}" \
            --revision "${{ matrix.revision }}" \
            --arch "${{ matrix.arch }}" \
            --status success \
            --archive-path "${{ steps.build.outputs.archive-path }}" \
            --archive-name "${{ steps.build.outputs.archive-name }}" \
            --cache-key-sha "${{ matrix.sha }}"

      - name: Record failed build in index
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/index-update.sh \
            --target-tag "${{ needs.preflight.outputs.target_tag }}" \
            --release-target-commit "${{ github.event.pull_request.head.sha }}" \
            --package "${{ matrix.package }}" \
            --version "${{ matrix.version }}" \
            --revision "${{ matrix.revision }}" \
            --arch "${{ matrix.arch }}" \
            --status failed \
            --error "matrix-build failed; see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true

  # Program wave — kind=program packages, gated on the library wave.
  # Each runner downloads the library archives produced above and
  # materializes package.pr.toml overlays so the resolver finds each
  # library via file:// instead of source-building a fresh copy.
  matrix-build:
    needs: [change-scope, preflight, toolchain-cache, lib-matrix-build]
    # !cancelled() so a partial library-wave failure (one lib failed,
    # others succeeded) doesn't cancel programs that depend only on
    # the green libs. Programs whose libs failed will fail loudly at
    # resolve time, which is the correct behavior.
    if: ${{ !cancelled() && needs.change-scope.outputs.exact_abi_staging_applicable != 'true' && needs.preflight.result == 'success' && needs.toolchain-cache.result == 'success' && needs.preflight.outputs.program_matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read # download toolchain + library artifacts
      contents: write # state-lock git push + gh release create/upload
    env:
      WASM_POSIX_BINARY_INDEX_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.baseline_tag }}/index.toml
    strategy:
      fail-fast: false
      # Program jobs also publish through the same per-PR state-lock path; high
      # fanout has caused transient codeload failures and git push 403s.
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.program_matrix) }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build ${{ matrix.package }} (${{ matrix.arch }})
        id: build
        uses: ./.github/actions/package-archive-build
        with:
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          build-host: ${{ github.repository }}@${{ github.event.pull_request.head.sha }}
          source-repository: https://github.com/${{ github.repository }}
          source-commit: ${{ github.event.pull_request.head.sha }}
          expected-cache-key-sha: ${{ matrix.sha }}
          materialize-library-overlays: ${{ needs.preflight.outputs.library_matrix != '[]' }}
          library-matrix: ${{ needs.preflight.outputs.library_matrix }}
          dependency-matrix: ${{ needs.preflight.outputs.program_matrix }}
          github-token: ${{ github.token }}

      # Atomic per-matrix-entry publish — same flow as
      # lib-matrix-build, targeting this attempt's staging draft.
      - name: Publish archive + index entry
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/index-update.sh \
            --target-tag "${{ needs.preflight.outputs.target_tag }}" \
            --release-target-commit "${{ github.event.pull_request.head.sha }}" \
            --package "${{ matrix.package }}" \
            --version "${{ matrix.version }}" \
            --revision "${{ matrix.revision }}" \
            --arch "${{ matrix.arch }}" \
            --status success \
            --archive-path "${{ steps.build.outputs.archive-path }}" \
            --archive-name "${{ steps.build.outputs.archive-name }}" \
            --cache-key-sha "${{ matrix.sha }}"

      - name: Record failed build in index
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/index-update.sh \
            --target-tag "${{ needs.preflight.outputs.target_tag }}" \
            --release-target-commit "${{ github.event.pull_request.head.sha }}" \
            --package "${{ matrix.package }}" \
            --version "${{ matrix.version }}" \
            --revision "${{ matrix.revision }}" \
            --arch "${{ matrix.arch }}" \
            --status failed \
            --error "matrix-build failed; see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true

  repair-staging-index:
    needs: [change-scope, preflight]
    if: ${{ needs.change-scope.outputs.exact_abi_staging_applicable != 'true' && needs.preflight.result == 'success' && needs.preflight.outputs.repair_index == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # verify a previous state-lock owner is terminal
      contents: write # state-lock git push + gh release create/upload
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Repair staging index metadata
        run: |
          bash scripts/dev-shell.sh bash scripts/index-update.sh \
            --target-tag "${{ needs.preflight.outputs.target_tag }}" \
            --release-target-commit "${{ github.event.pull_request.head.sha }}" \
            --repair-only

  test-gate-validation:
    # Source-only validation does not consume the prepared test workspace.
    # Run it alongside package materialization and kernel fixture preparation
    # so typechecking and workflow tests do not extend the suite critical path.
    needs: [change-scope]
    if: |
      !cancelled() &&
      needs.change-scope.result == 'success' &&
      (
        needs.change-scope.outputs.package_staging_required == 'true' ||
        needs.change-scope.outputs.test_gate_required == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_PUBLISH_FLOW_CHANGED: ${{ needs.change-scope.outputs.package_publish_flow_changed }}
      BINARY_MATERIALIZATION_CHANGED: ${{ needs.change-scope.outputs.binary_materialization_changed }}
      EXACT_ABI_STAGING_APPLICABLE: ${{ needs.change-scope.outputs.exact_abi_staging_applicable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install root npm deps
        run: bash scripts/dev-shell.sh npm ci --no-audit --no-fund

      - name: Install host npm deps
        run: |
          bash scripts/dev-shell.sh bash -c '
            cd host
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
          '

      - name: Typecheck host package
        run: |
          bash scripts/dev-shell.sh bash -c '
            cd host && npm run typecheck
          '

      - name: Test package build root contract
        run: bash scripts/dev-shell.sh bash scripts/test-package-build-roots.sh

      - name: Test package publish flow
        if: env.PACKAGE_PUBLISH_FLOW_CHANGED == 'true'
        run: |
          bash scripts/dev-shell.sh bash tests/scripts/package-publish-flow.sh

      - name: Test binary materialization flow
        if: env.BINARY_MATERIALIZATION_CHANGED == 'true' && env.EXACT_ABI_STAGING_APPLICABLE != 'true'
        run: |
          # WHY: artifact-guard integration tests query the ABI 43 binary
          # contract inventory. This source-only job does not download the
          # package-toolchain artifact, so prepare its host tool explicitly.
          bash scripts/dev-shell.sh bash scripts/build-fork-instrument-tool.sh
          bash scripts/dev-shell.sh npx --prefix host vitest run --root . \
            tests/package-system

  test-suite-early:
    name: test-suite (${{ matrix.label }})
    # These source-only Cargo suites need neither package materialization nor
    # the prepared workspace, so start them as soon as change scope is known.
    needs: [change-scope]
    if: |
      !cancelled() &&
      needs.change-scope.result == 'success' &&
      (
        needs.change-scope.outputs.package_staging_required == 'true' ||
        needs.change-scope.outputs.test_gate_required == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cargo-workspace
            label: cargo-workspace
            # Closed-by-default coverage for every workspace crate except
            # independently gated xtask, including integration-test crates.
            kernel_only: true
            submodules: ''
          - suite: cargo-xtask
            label: cargo-xtask
            # Package-system automation needs no prepared package workspace,
            # but its repository-product inventory validates the exact musl
            # license bytes declared by developer-kandelo-sdk.
            kernel_only: false
            submodules: libc/musl
    env:
      KERNEL_ONLY: ${{ matrix.kernel_only }}
      KERNEL_CHANGED: ${{ needs.change-scope.outputs.kernel }}
      EXACT_ABI_STAGING_APPLICABLE: ${{ needs.change-scope.outputs.exact_abi_staging_applicable }}
      SKIP_STAGING_TESTS: ${{ needs.change-scope.outputs.skip_staging_tests }}
      SUITE: ${{ matrix.suite }}
    steps:
      - name: Decide whether to run suite
        id: suite
        run: |
          set -euo pipefail
          if [ "$SKIP_STAGING_TESTS" = "true" ] && \
             [ "$EXACT_ABI_STAGING_APPLICABLE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip-staging-tests label is present; $SUITE is deferred to prepare-merge."
            exit 0
          fi
          if [ "$KERNEL_ONLY" = "true" ] && \
             [ "$KERNEL_CHANGED" != "true" ] && \
             [ "$EXACT_ABI_STAGING_APPLICABLE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$SUITE is kernel-only and this diff does not require kernel suites."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.suite.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch early suite submodule
        if: steps.suite.outputs.skip != 'true' && matrix.submodules != ''
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: ${{ matrix.submodules }}

      - name: Set up Nix
        if: steps.suite.outputs.skip != 'true'
        uses: ./.github/actions/setup-nix

      - name: Run ${{ matrix.label }} suite
        if: steps.suite.outputs.skip != 'true'
        run: |
          bash scripts/dev-shell.sh bash scripts/ci-run-test-suite.sh "$SUITE"

  exact-abi-source-test-prepare:
    needs: [change-scope, toolchain-cache]
    if: |
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable == 'true' &&
      needs.toolchain-cache.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Download exact toolchain sysroots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolchain-sysroots
          path: ${{ runner.temp }}/toolchain

      - name: Extract exact toolchain sysroots
        run: |
          tar --zstd -xf "$RUNNER_TEMP/toolchain/toolchain-sysroots.tar.zst"

      - name: Build exact kernel and source-test fixtures
        run: |
          bash scripts/dev-shell.sh bash -c '
            set -euo pipefail
            cargo build --release -p kandelo -Z build-std=core,alloc
            source scripts/install-local-binary.sh
            WASM_POSIX_LOCAL_INSTALL_SESSION=exact-abi-source-test \
              install_local_binary kernel \
                target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
                kandelo-kernel.wasm
            cmp target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
              local-binaries/kernel.wasm
            mkdir -p local-binaries/programs/wasm32 host/test/fixtures
            wasm32posix-cc programs/audiotest.c \
              -o local-binaries/programs/wasm32/audiotest.wasm
            wasm32posix-cc programs/mousetest.c \
              -o local-binaries/programs/wasm32/mousetest.wasm
            wat2wasm --enable-threads \
              host/test/fixtures/deep-wasm-recursion.wat \
              -o host/test/fixtures/deep-wasm-recursion.wasm
          '

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: abi-staging-authority
          fetch-depth: 1

      - name: Pack exact ABI source-test workspace
        run: |
          bash abi-staging-authority/scripts/pack-exact-abi-source-test-workspace.sh \
            pack \
            --source-root "$GITHUB_WORKSPACE" \
            --archive "$RUNNER_TEMP/exact-abi-source-test-workspace.tar.zst"

      - name: Upload exact ABI source-test workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-abi-source-test-workspace
          path: ${{ runner.temp }}/exact-abi-source-test-workspace.tar.zst
          retention-days: 1
          if-no-files-found: error

  exact-abi-source-test-suite:
    name: exact ABI source test (${{ matrix.suite }} ${{ matrix.group }})
    needs: [change-scope, toolchain-cache, exact-abi-source-test-prepare]
    if: |
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable == 'true' &&
      needs.toolchain-cache.result == 'success' &&
      needs.exact-abi-source-test-prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: vitest
            group: exact-abi-source
            route: vitest exact-abi-source
            submodules: ''
          - suite: libc
            group: functional-regression
            route: libc functional-regression
            submodules: tests/libc/libc-test
          - suite: libc
            group: math
            route: libc math
            submodules: tests/libc/libc-test
          - suite: posix
            group: all
            route: posix all
            submodules: ''
          - suite: sortix
            group: include
            route: sortix include
            submodules: tests/sortix/os-test
          - suite: sortix
            group: basic
            route: sortix basic
            submodules: tests/sortix/os-test
          - suite: sortix
            group: runtime
            route: sortix runtime
            submodules: tests/sortix/os-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch exact suite submodule
        if: matrix.submodules != ''
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: ${{ matrix.submodules }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Download exact toolchain sysroots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolchain-sysroots
          path: ${{ runner.temp }}/toolchain

      - name: Extract exact toolchain sysroots
        run: |
          tar --zstd -xf "$RUNNER_TEMP/toolchain/toolchain-sysroots.tar.zst"

      - name: Download exact ABI source-test workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exact-abi-source-test-workspace
          path: ${{ runner.temp }}/exact-abi-source-test-workspace

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: abi-staging-authority
          fetch-depth: 1

      - name: Extract and validate exact ABI source-test workspace
        run: |
          bash abi-staging-authority/scripts/pack-exact-abi-source-test-workspace.sh \
            extract \
            --source-root "$GITHUB_WORKSPACE" \
            --archive \
              "$RUNNER_TEMP/exact-abi-source-test-workspace/exact-abi-source-test-workspace.tar.zst"

      - name: Run exact source/conformance cell
        env:
          SUITE: ${{ matrix.suite }}
          TEST_GROUP: ${{ matrix.group }}
        run: |
          bash scripts/dev-shell.sh bash \
            scripts/ci-run-test-suite.sh "$SUITE" "$TEST_GROUP"

  exact-abi-test-gate:
    needs:
      - change-scope
      - test-gate-validation
      - test-suite-early
      - exact-abi-source-test-prepare
      - exact-abi-source-test-suite
    if: |
      always() &&
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Require complete exact ABI source evidence
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          VALIDATION_RESULT: ${{ needs.test-gate-validation.result }}
          EARLY_RESULT: ${{ needs.test-suite-early.result }}
          PREPARE_RESULT: ${{ needs.exact-abi-source-test-prepare.result }}
          SUITE_RESULT: ${{ needs.exact-abi-source-test-suite.result }}
          EXACT_ABI_STAGING_APPLICABLE: ${{ needs.change-scope.outputs.exact_abi_staging_applicable }}
        run: |
          set -euo pipefail
          [ "$EXACT_ABI_STAGING_APPLICABLE" = true ]
          for result in \
            "$CHANGE_SCOPE_RESULT" \
            "$VALIDATION_RESULT" \
            "$EARLY_RESULT" \
            "$PREPARE_RESULT" \
            "$SUITE_RESULT"
          do
            [ "$result" = success ] || {
              echo "::error::exact ABI source evidence ended as $result"
              exit 1
            }
          done

  test-gate-prepare:
    # Materializes the union of (matrix-built archives + durable release
    # fallback), builds the fresh kernel/test fixtures once, and uploads
    # the complete prepared workspace for the parallel suites below.
    #
    # Run even when some matrix entries failed. Per the design doc,
    # partial-matrix-failure is a real scenario the consumer side
    # handles via last-green fallback, so the green packages should
    # still be tested for the union they form with the durable release.
    # Use !cancelled() instead of always() so manual/concurrency
    # cancellation is respected and this long test job doesn't keep an
    # obsolete workflow alive.
    # Run even when preflight produces an empty matrix. A retry push can
    # legitimately hit every selected package in the draft because earlier
    # jobs in the same attempt uploaded them, while still needing to validate
    # the gate itself, especially after workflow/test-gate fixes.
    needs:
      [
        change-scope,
        preflight,
        toolchain-cache,
        lib-matrix-build,
        matrix-build,
        repair-staging-index,
      ]
    if: |
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.toolchain-cache.result == 'success' &&
      needs.preflight.result == 'success' &&
      (needs.repair-staging-index.result == 'success' || needs.repair-staging-index.result == 'skipped') &&
      (needs.lib-matrix-build.result == 'success' || needs.lib-matrix-build.result == 'skipped') &&
      (needs.matrix-build.result == 'success' || needs.matrix-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      PACKAGE_STAGING_REQUIRED: ${{ needs.change-scope.outputs.package_staging_required }}
      PACKAGE_STAGE_OVERLAYS_REQUIRED: ${{ needs.preflight.outputs.library_matrix != '[]' || needs.preflight.outputs.program_matrix != '[]' }}
      PACKAGE_TARGET_TAG: ${{ needs.preflight.outputs.target_tag }}
      PACKAGE_BASELINE_TAG: ${{ needs.preflight.outputs.baseline_tag }}
      PACKAGE_REUSE_STAGING: ${{ needs.preflight.outputs.reuse_staging }}
      SKIP_STAGING_TESTS: ${{ needs.change-scope.outputs.skip_staging_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Download toolchain sysroots artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolchain-sysroots
          path: ${{ runner.temp }}/toolchain

      - name: Extract toolchain sysroots
        run: |
          tar --zstd -xf "$RUNNER_TEMP/toolchain/toolchain-sysroots.tar.zst"

      - name: Install root npm dependencies for shell inspection
        run: |
          bash scripts/dev-shell.sh env \
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            npm ci --no-audit --no-fund

      - name: Download matrix artifacts
        # Each matrix entry uploaded one artifact named "<pkg>-<arch>"
        # containing one .tar.zst. The pattern excludes the
        # toolchain-sysroots helper artifact uploaded by toolchain-cache.
        if: ${{ needs.preflight.outputs.reuse_staging == 'false' && (needs.preflight.outputs.library_matrix != '[]' || needs.preflight.outputs.program_matrix != '[]') }}
        uses: ./.github/actions/download-run-artifacts
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: "*-wasm*"
          path: ${{ runner.temp }}/staged-archives

      - name: Materialize binaries
        env:
          GH_TOKEN: ${{ github.token }}
          WASM_POSIX_FETCH_SKIP_PKGS: cpython erlang erlang-vfs perl perl-vfs python-vfs redis texlive
        # A reused staging release is fetched again after every matrix writer
        # finishes, validated as fully current, and frozen into a local
        # file:// snapshot. Otherwise retain the durable release + local
        # matrix-overlay path used by first runs and partial staging releases.
        run: |
          set -euo pipefail
          ABI=$(grep -oE "ABI_VERSION: u32 = [0-9]+" crates/shared/src/lib.rs | awk '{print $4}')
          EXPECTED="$RUNNER_TEMP/staging-expected.json"
          BLOCKED="$RUNNER_TEMP/staging-publication-blockers.json"
          bash scripts/dev-shell.sh env \
            EXPECTED="$EXPECTED" \
            BLOCKED="$BLOCKED" \
            PACKAGE_STAGING_EXCLUSIONS="$PACKAGE_STAGING_EXCLUSIONS" \
            ABI="$ABI" \
            bash -c '
              set -euo pipefail
              HOST_TARGET=$(rustc -vV | awk "/^host/ {print \$2}")
              cargo build --release -p xtask --target "$HOST_TARGET"
              "target/$HOST_TARGET/release/xtask" staging-reuse expected \
                --registry packages/registry \
                --expected-abi "$ABI" \
                --exclude "$PACKAGE_STAGING_EXCLUSIONS" \
                --output "$EXPECTED" \
                --blocked-output "$BLOCKED"
            '
          if [ "$PACKAGE_REUSE_STAGING" != "false" ]; then
            SNAPSHOT="$RUNNER_TEMP/current-staging-snapshot"
            bash scripts/dev-shell.sh env \
              EXPECTED="$EXPECTED" \
              SNAPSHOT="$SNAPSHOT" \
              PACKAGE_TARGET_TAG="$PACKAGE_TARGET_TAG" \
              PACKAGE_BASELINE_TAG="$PACKAGE_BASELINE_TAG" \
              PACKAGE_STAGING_EXCLUSIONS="$PACKAGE_STAGING_EXCLUSIONS" \
              ABI="$ABI" \
              bash -c '
              set -euo pipefail
              HOST_TARGET=$(rustc -vV | awk "/^host/ {print \$2}")
              XTASK="target/$HOST_TARGET/release/xtask"
              TARGET_SNAPSHOT="$RUNNER_TEMP/fresh-target-snapshot"
              bash .github/scripts/validate-staging-release.sh \
                --tag "$PACKAGE_TARGET_TAG" \
                --expected-ledger "$EXPECTED" \
                --mode structural \
                --materialize \
                --output-dir "$TARGET_SNAPSHOT" \
                --xtask "$XTASK"
              STALE_EXPECTED="$RUNNER_TEMP/fresh-stale-expected.json"
              jq --slurpfile snapshot "$TARGET_SNAPSHOT/snapshot.json" "
                .entries |= map(. as \$expected |
                  select(any(\$snapshot[0].entries[];
                    .package == \$expected.package and
                    .arch == \$expected.arch and
                    .current == false)))
              " "$EXPECTED" > "$STALE_EXPECTED"
              stale_count=$(jq ".entries | length" "$STALE_EXPECTED")
              if [ "$stale_count" -eq 0 ]; then
                bash .github/scripts/compose-staging-release-snapshots.sh \
                  --target-dir "$TARGET_SNAPSHOT" \
                  --output-dir "$SNAPSHOT"
              else
                CANONICAL_SNAPSHOT="$RUNNER_TEMP/fresh-canonical-supplement"
                bash .github/scripts/validate-staging-release.sh \
                  --tag "$PACKAGE_BASELINE_TAG" \
                  --expected-ledger "$STALE_EXPECTED" \
                  --mode current \
                  --materialize \
                  --output-dir "$CANONICAL_SNAPSHOT" \
                  --xtask "$XTASK"
                bash .github/scripts/compose-staging-release-snapshots.sh \
                  --target-dir "$TARGET_SNAPSHOT" \
                  --canonical-dir "$CANONICAL_SNAPSHOT" \
                  --overlay-expected-ledger "$STALE_EXPECTED" \
                  --output-dir "$SNAPSHOT" \
                  --xtask "$XTASK"
              fi
            '
            export WASM_POSIX_BINARY_INDEX_URL
            WASM_POSIX_BINARY_INDEX_URL=$(cat "$SNAPSHOT/index-url.txt")
          elif [ "$PACKAGE_STAGE_OVERLAYS_REQUIRED" = "true" ]; then
            export WASM_POSIX_BINARY_INDEX_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${PACKAGE_BASELINE_TAG}/index.toml"
            STAGE="$RUNNER_TEMP/staged-overlay"
            bash scripts/materialize-pr-overlays.sh "$RUNNER_TEMP/staged-archives" "$STAGE"
          else
            export WASM_POSIX_BINARY_INDEX_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/binaries-abi-v${ABI}/index.toml"
          fi
          echo "WASM_POSIX_BINARY_INDEX_URL=$WASM_POSIX_BINARY_INDEX_URL" >> "$GITHUB_ENV"
          bash scripts/dev-shell.sh bash scripts/fetch-binaries.sh \
            --fetch-only \
            --expected-ledger "$EXPECTED"

      - name: Skip staging test suites
        if: env.SKIP_STAGING_TESTS == 'true'
        run: |
          echo "skip-staging-tests label is present on this PR."
          echo "staging-build validated preflight, toolchain cache, package matrix/builds, and binary materialization."
          echo "Kernel/test program build, cargo tests, fork-instrument tests, vitest, browser E2E, libc-test, POSIX, and Sortix are deferred to prepare-merge."

      - name: Build kernel + test programs + rootfs
        if: env.SKIP_STAGING_TESTS != 'true'
        # Test prereqs not shipped in the release archives: kernel.wasm
        # is built fresh (and copied into local-binaries/ where the
        # resolver finds it ahead of binaries/), as are programs/*.wasm
        # fixtures consumed by vitest. build-rootfs.sh installs only its
        # own missing Node dependencies and produces host/wasm/rootfs.vfs,
        # which NodeKernelHost loads for `rootfsImage:"default"`.
        run: |
          bash scripts/dev-shell.sh bash -c '
            set -euo pipefail
            export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
            cargo build --release -p kandelo \
              -Z build-std=core,alloc
            # WHY: this is a package-owned resolver mirror. Install the exact
            # candidate into an immutable local generation so later dependency
            # resolution cannot substitute released kernel bytes.
            source scripts/install-local-binary.sh
            WASM_POSIX_LOCAL_INSTALL_SESSION="ci-kernel-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}" \
              install_local_binary kernel \
                target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
                kandelo-kernel.wasm
            cmp target/wasm32-unknown-unknown/release/kandelo_kernel.wasm \
              local-binaries/kernel.wasm
            bash scripts/build-programs.sh
            bash scripts/build-rootfs.sh
          '

      - name: Pack prepared test workspace
        if: env.SKIP_STAGING_TESTS != 'true'
        run: |
          bash scripts/dev-shell.sh bash scripts/pack-ci-test-workspace.sh \
            --publication-blockers "$RUNNER_TEMP/staging-publication-blockers.json" \
            "$RUNNER_TEMP/test-workspace.tar.zst"

      - name: Upload prepared test workspace
        if: env.SKIP_STAGING_TESTS != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-workspace
          path: ${{ runner.temp }}/test-workspace.tar.zst
          retention-days: 1
          if-no-files-found: error

  test-suite:
    name: test-suite (${{ matrix.label }})
    needs: [change-scope, preflight, test-gate-prepare]
    if: |
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.test-gate-prepare.result == 'success'
    runs-on: ubuntu-latest
    # Browser validation may locally materialize publication-pending packages
    # before running the same bounded Playwright suites as a ready release.
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # WHY: ordinary files use two deterministic shards. Heavyweight
          # guest-runtime cases get fresh Vitest processes in a third cell so
          # resident memory from one case cannot carry into the next.
          - suite: vitest
            label: vitest (1/2)
            group: 1/2
            kernel_only: false
            submodules: ""
            needs_toolchain: true
            needs_workspace: true
          - suite: vitest
            label: vitest (2/2)
            group: 2/2
            kernel_only: false
            submodules: ""
            needs_toolchain: true
            needs_workspace: true
          - suite: vitest
            label: vitest (resource-isolated)
            group: resource-isolated
            kernel_only: false
            submodules: ""
            needs_toolchain: true
            needs_workspace: true
          - suite: browser
            label: browser
            group: all
            kernel_only: false
            submodules: ""
            needs_toolchain: true
            needs_workspace: true
          - suite: libc
            label: libc (functional + regression)
            group: functional-regression
            kernel_only: true
            submodules: tests/libc/libc-test
            needs_toolchain: true
            needs_workspace: true
          - suite: libc
            label: libc (math)
            group: math
            kernel_only: true
            submodules: tests/libc/libc-test
            needs_toolchain: true
            needs_workspace: true
          - suite: posix
            label: posix
            group: all
            kernel_only: true
            submodules: ""
            needs_toolchain: true
            needs_workspace: true
          - suite: sortix
            label: sortix (include)
            group: include
            kernel_only: true
            submodules: tests/sortix/os-test
            needs_toolchain: true
            needs_workspace: true
          - suite: sortix
            label: sortix (basic)
            group: basic
            kernel_only: true
            submodules: tests/sortix/os-test
            needs_toolchain: true
            needs_workspace: true
          - suite: sortix
            label: sortix (runtime)
            group: runtime
            kernel_only: true
            submodules: tests/sortix/os-test
            needs_toolchain: true
            needs_workspace: true
    env:
      KERNEL_CHANGED: ${{ needs.change-scope.outputs.kernel }}
      KERNEL_ONLY: ${{ matrix.kernel_only }}
      SKIP_STAGING_TESTS: ${{ needs.change-scope.outputs.skip_staging_tests }}
      SUITE: ${{ matrix.suite }}
      TEST_GROUP: ${{ matrix.group }}
      PREPARE_BROWSER_ASSETS: ${{ matrix.suite == 'browser' }}
      STAGES_NODE_VFS: ${{ needs.preflight.outputs.stages_node_vfs }}
    steps:
      - name: Decide whether to run suite
        id: suite
        run: |
          set -euo pipefail
          if [ "$SKIP_STAGING_TESTS" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip-staging-tests label is present; $SUITE is deferred to prepare-merge."
            exit 0
          fi
          if [ "$KERNEL_ONLY" = "true" ] && [ "$KERNEL_CHANGED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$SUITE is kernel-only and this diff does not require kernel suites."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.suite.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch suite submodule
        if: steps.suite.outputs.skip != 'true' && matrix.submodules != ''
        uses: ./.github/actions/fetch-submodules
        with:
          submodules: ${{ matrix.submodules }}

      - name: Set up Nix
        if: steps.suite.outputs.skip != 'true'
        uses: ./.github/actions/setup-nix

      - name: Download toolchain sysroots artifact
        if: steps.suite.outputs.skip != 'true' && matrix.needs_toolchain == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: toolchain-sysroots
          path: ${{ runner.temp }}/toolchain

      - name: Extract toolchain sysroots
        if: steps.suite.outputs.skip != 'true' && matrix.needs_toolchain == true
        run: |
          tar --zstd -xf "$RUNNER_TEMP/toolchain/toolchain-sysroots.tar.zst"

      - name: Download prepared test workspace
        if: steps.suite.outputs.skip != 'true' && matrix.needs_workspace == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-workspace
          path: ${{ runner.temp }}/test-workspace

      - name: Extract prepared test workspace
        if: steps.suite.outputs.skip != 'true' && matrix.needs_workspace == true
        run: |
          tar --zstd -xf \
            "$RUNNER_TEMP/test-workspace/test-workspace.tar.zst"

      - name: Run ${{ matrix.label }} suite
        if: steps.suite.outputs.skip != 'true'
        # Suite controls must cross dev-shell.sh's --ignore-environment
        # boundary explicitly; otherwise every shard defaults to "all" and
        # the browser consumer skips its deferred asset preparation.
        run: |
          bash scripts/dev-shell.sh env \
            PREPARE_BROWSER_ASSETS="$PREPARE_BROWSER_ASSETS" \
            bash scripts/ci-run-test-suite.sh "$SUITE" "$TEST_GROUP"

      - name: Upload browser test artifacts
        if: failure() && steps.suite.outputs.skip != 'true' && matrix.suite == 'browser'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-artifacts
          path: |
            apps/browser-demos/test-results
          if-no-files-found: ignore
          retention-days: 7

  test-gate:
    needs:
      [
        change-scope,
        preflight,
        test-gate-validation,
        test-suite-early,
        test-gate-prepare,
        test-suite,
      ]
    if: |
      always() &&
      !cancelled() &&
      needs.change-scope.outputs.exact_abi_staging_applicable != 'true' &&
      needs.test-gate-prepare.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_RESULT: ${{ needs.test-gate-validation.result }}
      EARLY_TEST_SUITE_RESULT: ${{ needs.test-suite-early.result }}
      PREPARE_RESULT: ${{ needs.test-gate-prepare.result }}
      TEST_SUITE_RESULT: ${{ needs.test-suite.result }}
      SKIP_STAGING_TESTS: ${{ needs.change-scope.outputs.skip_staging_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.change-scope.outputs.package_staging_required == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            .github/scripts

      - name: Check validation and split test suites
        run: |
          set -euo pipefail
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "::error::source validation completed with result: $VALIDATION_RESULT"
            exit 1
          fi
          if [ "$EARLY_TEST_SUITE_RESULT" != "success" ]; then
            echo "::error::early test suites completed with result: $EARLY_TEST_SUITE_RESULT"
            exit 1
          fi
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "::error::test preparation completed with result: $PREPARE_RESULT"
            exit 1
          fi
          if [ "$TEST_SUITE_RESULT" != "success" ]; then
            echo "::error::split test suites completed with result: $TEST_SUITE_RESULT"
            exit 1
          fi

      - name: Seal and publish exact staging release
        if: needs.change-scope.outputs.package_staging_required == 'true'
        env:
          PACKAGE_TARGET_TAG: ${{ needs.preflight.outputs.target_tag }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/staging-release-body.txt"
          printf 'PR #%s staging build run %s attempt %s' \
            '${{ github.event.pull_request.number }}' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >"$body"
          state="$RUNNER_TEMP/staging-release-lock.env"
          export STATE_LOCK_OWNER_DETAIL="immutable staging finalizer"
          STATE_LOCK_STATE_FILE="$state" \
            bash .github/scripts/state-lock.sh acquire "$PACKAGE_TARGET_TAG"
          release_lock() {
            STATE_LOCK_STATE_FILE="$state" \
              bash .github/scripts/state-lock.sh release || true
          }
          trap release_lock EXIT
          bash .github/scripts/package-release-lifecycle.sh seal-publish \
            --tag "$PACKAGE_TARGET_TAG" \
            --target-commit '${{ github.event.pull_request.head.sha }}' \
            --title "$PACKAGE_TARGET_TAG" \
            --body-file "$body" \
            --prerelease true

      - name: Post merge-gate success for runtime-only staging
        if: |
          env.SKIP_STAGING_TESTS != 'true' &&
          needs.change-scope.outputs.package_staging_required == 'false' &&
          needs.change-scope.outputs.test_gate_required == 'true'
        run: |
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success \
            -f context=merge-gate \
            -f description="Runtime/materialization tests passed; package staging skipped." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  package-main-shell-prerequisites:
    name: order exact package shell after package staging
    needs: [change-scope, preflight, test-gate, exact-abi-test-gate]
    if: |
      always() &&
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.action != 'labeled' &&
        github.event.action != 'unlabeled' ||
        github.event.label.name == 'skip-staging-tests'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the expected producer result
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          PACKAGE_STAGING_REQUIRED: ${{ needs.change-scope.outputs.package_staging_required }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TARGET_TAG: ${{ needs.preflight.outputs.target_tag }}
          TEST_GATE_REQUIRED: ${{ needs.change-scope.outputs.test_gate_required }}
          TEST_GATE_RESULT: ${{ needs.test-gate.result }}
          EXACT_ABI_STAGING_APPLICABLE: ${{ needs.change-scope.outputs.exact_abi_staging_applicable }}
          EXACT_ABI_GATE_RESULT: ${{ needs.exact-abi-test-gate.result }}
        run: |
          set -euo pipefail
          [ "$CHANGE_SCOPE_RESULT" = success ] || {
            echo "::error::package change classification ended as $CHANGE_SCOPE_RESULT"
            exit 1
          }
          for state in "$PACKAGE_STAGING_REQUIRED" "$TEST_GATE_REQUIRED"; do
            case "$state" in
              true | false) ;;
              *)
                echo "::error::invalid package staging state: $state"
                exit 1
                ;;
            esac
          done

          if [ "$EXACT_ABI_STAGING_APPLICABLE" = true ]; then
            [ "$PACKAGE_STAGING_REQUIRED" = false ]
            [ "$TEST_GATE_REQUIRED" = true ]
            [ "$EXACT_ABI_GATE_RESULT" = success ] || {
              echo "::error::exact ABI test gate ended as $EXACT_ABI_GATE_RESULT"
              exit 1
            }
            [ "$PREFLIGHT_RESULT" = skipped ] && [ "$TEST_GATE_RESULT" = skipped ] || {
              echo "::error::legacy staging ran on the exact ABI route"
              exit 1
            }
            exit 0
          fi
          [ "$EXACT_ABI_GATE_RESULT" = skipped ] || {
            echo "::error::unexpected exact ABI gate result: $EXACT_ABI_GATE_RESULT"
            exit 1
          }

          if [ "$PACKAGE_STAGING_REQUIRED" = true ]; then
            [ "$PREFLIGHT_RESULT" = success ] || {
              echo "::error::staging preflight ended as $PREFLIGHT_RESULT"
              exit 1
            }
            [ "$TEST_GATE_RESULT" = success ] || {
              echo "::error::staging release was not sealed: $TEST_GATE_RESULT"
              exit 1
            }
            expected_tag="pr-${{ github.event.pull_request.number }}-staging-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            [ "$TARGET_TAG" = "$expected_tag" ] || {
              echo "::error::producer selected a different staging attempt"
              exit 1
            }
          elif [ "$TEST_GATE_REQUIRED" = true ]; then
            [ "$PREFLIGHT_RESULT" = success ] || {
              echo "::error::runtime preflight ended as $PREFLIGHT_RESULT"
              exit 1
            }
            [ "$TEST_GATE_RESULT" = success ] || {
              echo "::error::runtime test gate ended as $TEST_GATE_RESULT"
              exit 1
            }
          else
            # WHY: No-op and publisher-only changes intentionally skip the
            # generic test gate. Any other result means workflow routing
            # drifted and must not silently satisfy the product aggregate.
            [ "$TEST_GATE_RESULT" = skipped ] || {
              echo "::error::unexpected test-gate result: $TEST_GATE_RESULT"
              exit 1
            }
          fi

  package-main-shell-gate:
    # Keep the historical required-check display name so branch protection
    # does not silently lose a gate. The canonical shell is package-owned now;
    # the generic test gate includes the browser cell and conditionally runs
    # the exact slow Node/npm acceptance when node-vfs is staged.
    name: exact current lazy shell (Node + Chromium)
    needs:
      - change-scope
      - exact-abi-test-gate
      - package-main-shell-prerequisites
      - test-gate
    if: |
      always() &&
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.action != 'labeled' &&
        github.event.action != 'unlabeled' ||
        github.event.label.name == 'skip-staging-tests'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require ordered exact-shell validation
        env:
          PREREQUISITES_RESULT: ${{ needs.package-main-shell-prerequisites.result }}
          EXACT_ABI_STAGING_APPLICABLE: ${{ needs.change-scope.outputs.exact_abi_staging_applicable }}
          EXACT_ABI_GATE_RESULT: ${{ needs.exact-abi-test-gate.result }}
          TEST_GATE_RESULT: ${{ needs.test-gate.result }}
        run: |
          set -euo pipefail
          [ "$PREREQUISITES_RESULT" = success ] || {
            echo "::error::canonical package-shell prerequisites ended as $PREREQUISITES_RESULT"
            exit 1
          }
          if [ "$EXACT_ABI_STAGING_APPLICABLE" = true ]; then
            [ "$EXACT_ABI_GATE_RESULT" = success ] || {
              echo "::error::exact ABI test gate ended as $EXACT_ABI_GATE_RESULT"
              exit 1
            }
            [ "$TEST_GATE_RESULT" = skipped ] || {
              echo "::error::legacy package test gate ran on the exact ABI route"
              exit 1
            }
          else
            [ "$EXACT_ABI_GATE_RESULT" = skipped ] || {
              echo "::error::unexpected exact ABI gate result: $EXACT_ABI_GATE_RESULT"
              exit 1
            }
            case "$TEST_GATE_RESULT" in
              success | skipped) ;;
              *)
                echo "::error::canonical package test gate ended as $TEST_GATE_RESULT"
                exit 1
                ;;
            esac
          fi

  # publish / generate-index — REMOVED.
  #
  # Per binary-resolution-via-index-ledger, each matrix-build entry
  # now publishes its archive + mutates the attempt-owned draft index.toml
  # atomically via scripts/index-update.sh. No separate publish
  # job; no generate-index aggregation pass.
  #
  # Stale-archive pruning (prune-staging-release.sh) is also gone:
  # the index.toml is authoritative, so orphan archives on the
  # staging draft are harmless until cleaned by staging-cleanup.yml.

  f2-status:
    # Phase B-2 Task 1 — F2 sticky PR-comment bot.
    #
    # Aggregates the narrowed matrix from preflight against the release
    # asset list (post-publish, post-generate-index) into a flat
    # publish-status.json, uploads it as a workflow artifact, and
    # posts/edits a sticky PR comment surfacing per-package outcomes
    # ("X built, Y failed").
    #
    # `if: always()` is intentional: the bot's whole purpose is to
    # surface partial failures in matrix-build. We still skip when
    # the narrowed matrix is empty (nothing was attempted; nothing
    # to report). For B-2, only matrix-included entries are
    # reported — `cached-skip` (entries the preflight gate filtered
    # out) is not surfaced. Follow-up if reviewers want full coverage.
    #
    # Joins the publish concurrency group so the comment can't race a
    # concurrent re-run on the same target tag. The narrow window where
    # this matters: workflow_dispatch or "re-run all jobs" on a still-
    # current PR (the workflow-level `cancel-in-progress: true` already
    # eliminates the common-case quick-push race). cancel-in-progress is
    # false here because aborting an in-flight comment edit is worse than
    # waiting one more comment-edit's worth of time.
    needs: [change-scope, preflight, lib-matrix-build, matrix-build]
    if: always() && needs.change-scope.outputs.exact_abi_staging_applicable != 'true' && needs.preflight.result == 'success' && (needs.preflight.outputs.library_matrix != '[]' || needs.preflight.outputs.program_matrix != '[]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: phase-b-1-publish-${{ needs.preflight.outputs.target_tag }}
      cancel-in-progress: false
    permissions:
      pull-requests: write # post/edit PR comment
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute publish-status.json
        id: status
        run: |
          set -euo pipefail
          TAG="${{ needs.preflight.outputs.target_tag }}"
          ABI="${{ needs.preflight.outputs.abi }}"
          # f2-status walks the union of library + program matrices
          # to decide per-entry status (built vs. failed); merge the
          # two into a single array so the downstream loop stays
          # uniform.
          LIB_M='${{ needs.preflight.outputs.library_matrix }}'
          PROG_M='${{ needs.preflight.outputs.program_matrix }}'
          MATRIX=$(jq -nc --argjson l "$LIB_M" --argjson p "$PROG_M" '$l + $p')

          # Currently published assets in the release (post-publish,
          # post-generate-index). Falls back to [] if the release
          # doesn't exist (matrix all failed early, nothing published).
          existing=$(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json assets --jq '[.assets[].name]' 2>/dev/null || echo '[]')

          # For each matrix entry, decide status by checking whether
          # the expected canonical archive name is in the release.
          # If yes: built. If no: failed (matrix-build for that entry
          # failed). For failed entries, look up a prior archive for
          # the same (pkg, arch) — the short-sha tail of that name is
          # the previous_sha (last green).
          #
          # NOTE: process substitution (< <(...)) NOT a pipe — under
          # non-interactive bash, `cmd | while` runs the loop body in a
          # subshell, losing mutations to packages_json on each iteration.
          packages_json='[]'
          while IFS= read -r entry; do
            pkg=$(echo "$entry" | jq -r .package)
            arch=$(echo "$entry" | jq -r .arch)
            sha=$(echo "$entry" | jq -r .sha)
            short8="${sha:0:8}"

            # Canonical archive name: <pkg>-<ver>-rev<N>-abi<N>-<arch>-<short8>.tar.zst.
            # The (pkg, arch, short8) triple uniquely identifies an entry;
            # version + revision live in the package manifest and don't
            # need to round-trip through this aggregation.
            if echo "$existing" | jq -e --arg pre "${pkg}-" --arg suf "-abi${ABI}-${arch}-${short8}.tar.zst" \
                'any(.[]; startswith($pre) and endswith($suf))' >/dev/null; then
              entry_json=$(jq -nc --arg n "$pkg" --arg a "$arch" --arg s "$sha" \
                '{name:$n, arch:$a, status:"built", sha:$s}')
            else
              # Find a prior archive for the same (pkg, arch) — different sha.
              # Best-effort; if multiple shas exist (shouldn't, but
              # defensively), jq picks the first.
              prev_short=$(echo "$existing" | jq -r --arg pre "${pkg}-" --arg arch_part "-abi${ABI}-${arch}-" \
                '[.[] | select(startswith($pre) and contains($arch_part))] | .[0] // ""' \
                | sed -nE 's/.*-([a-f0-9]{8})\.tar\.zst$/\1/p')
              if [ -n "$prev_short" ]; then
                entry_json=$(jq -nc --arg n "$pkg" --arg a "$arch" --arg p "$prev_short" \
                  '{name:$n, arch:$a, status:"failed", previous_sha:$p}')
              else
                entry_json=$(jq -nc --arg n "$pkg" --arg a "$arch" \
                  '{name:$n, arch:$a, status:"failed"}')
              fi
            fi
            packages_json=$(echo "$packages_json" | jq -c --argjson e "$entry_json" '. + [$e]')
          done < <(echo "$MATRIX" | jq -c '.[]')

          jq -nc --argjson abi "$ABI" --arg tag "$TAG" --argjson pkgs "$packages_json" \
            '{abi_version:$abi, release_tag:$tag, packages:$pkgs}' \
            > publish-status.json

          echo "--- publish-status.json ---"
          jq . publish-status.json

          # Stash compact JSON in step output for the comment script.
          # Use a heredoc-style multi-line output to avoid quoting issues
          # with embedded special characters in package names / shas.
          json=$(jq -c . publish-status.json)
          {
            echo "json<<__EOF__"
            echo "$json"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Upload publish-status.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-status
          path: publish-status.json
          retention-days: 30
          if-no-files-found: error

      - name: Post or edit sticky PR comment
        # Skipped on non-PR triggers (workflow_dispatch from the
        # force-rebuild flow, etc.) — those still get the artifact
        # but have no PR to comment on.
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATUS_JSON: ${{ steps.status.outputs.json }}
        with:
          script: |
            const status = JSON.parse(process.env.STATUS_JSON);
            const marker = '<!-- phase-b-status -->';
            const total = status.packages.length;
            const built = status.packages.filter(p => p.status === 'built').length;
            const failed = status.packages.filter(p => p.status === 'failed').length;

            const rows = status.packages.map(p => {
              const sha = p.sha
                ? `\`${p.sha.slice(0, 8)}\``
                : (p.previous_sha ? `\`(prev ${p.previous_sha})\`` : '—');
              return `| ${p.name} | ${p.arch} | ${p.status} | ${sha} |`;
            }).join('\n');

            const body = [
              marker,
              `## Phase B-1 matrix build status — \`${status.release_tag}\``,
              '',
              `ABI v${status.abi_version}. **${built} built**, **${failed} failed**, ${total} total.`,
              '',
              '| Package | Arch | Status | Sha |',
              '| --- | --- | --- | --- |',
              rows,
              '',
              '<sub>Auto-generated; replaced on each push. Raw data in the `publish-status` workflow artifact.</sub>',
            ].join('\n');

            const issue_number = context.issue.number;
            const { owner, repo } = context.repo;

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              console.log(`Updated sticky comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              console.log('Created new sticky comment');
            }
