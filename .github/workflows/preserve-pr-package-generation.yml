name: Preserve package closure

# Preserve one exact same-run closure before its mutable source release is
# replaced. Sources may be PR staging or a completed canonical Force rebuild.
# The result is evidence, not an admitted package generation. PR v1 tags keep
# their producer reachable. Canonical v2 producers remain reachable through
# protected-main ancestry, while their tags anchor current publishing
# authority.
on:
  workflow_dispatch:
    inputs:
      source-tag:
        description: 'Exact PR staging or canonical ABI release to preserve as non-admitted evidence'
        required: true
        type: string
      source-run-id:
        description: 'Workflow run that produced all selected artifacts'
        required: true
        type: string
      package-source-sha:
        description: 'Full commit that produced every selected archive'
        required: true
        type: string
      expected-abi:
        description: 'Kernel ABI carried by the preserved closure'
        required: true
        default: '42'
        type: string
      root-package:
        description: 'Program package whose exact closure is preserved'
        required: true
        default: rootfs
        type: string
      arch:
        description: 'Target architecture for the selected closure'
        required: true
        default: wasm32
        type: string

permissions:
  contents: read

concurrency:
  group: preserve-pr-package-generation-${{ inputs.package-source-sha }}-${{ inputs.root-package }}-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout current publishing authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: authority

      - name: Checkout exact package source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.package-source-sha }}
          fetch-depth: 1
          persist-credentials: false
          path: package-source

      - name: Set up declared build tools
        uses: ./authority/.github/actions/setup-nix

      - name: Build the current authority validator
        working-directory: authority
        run: |
          bash scripts/dev-shell.sh \
            bash .github/scripts/prepare-current-authority-validator.sh \
              --state-dir "$RUNNER_TEMP/preservation-prepare-authority-validator"

      - name: Validate and application-seal the selected closure
        working-directory: authority
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACKAGE_SOURCE_SHA: ${{ inputs.package-source-sha }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          EXPECTED_ABI: ${{ inputs.expected-abi }}
          ROOT_PACKAGE: ${{ inputs.root-package }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          validator_state="$RUNNER_TEMP/preservation-prepare-authority-validator"
          authority_xtask="$(cat "$validator_state/xtask-path")"
          authority_cargo_home="$(cat "$validator_state/cargo-home-path")"
          bash scripts/dev-shell.sh \
            env CARGO_HOME="$authority_cargo_home" \
              bash .github/scripts/prepare-preserved-pr-package-generation.sh \
                --source-tag "$SOURCE_TAG" \
                --source-run-id "$SOURCE_RUN_ID" \
                --package-source-root "$GITHUB_WORKSPACE/package-source" \
                --package-source-sha "$PACKAGE_SOURCE_SHA" \
                --authority-sha "$GITHUB_SHA" \
                --expected-abi "$EXPECTED_ABI" \
                --root-package "$ROOT_PACKAGE" \
                --arch "$TARGET_ARCH" \
                --repository "$GITHUB_REPOSITORY" \
                --output-dir "$RUNNER_TEMP/preserved-package-generation" \
                --authority-xtask "$authority_xtask"
          echo "Prepared $(jq -r .tag "$RUNNER_TEMP/preserved-package-generation/generation.json")"

      - name: Transfer the inert preserved bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # WHY: "rerun failed jobs" does not rerun a successful producer, so
          # the consumer must not look for a new run-attempt-specific name.
          # A full rerun deterministically replaces this inert, sealed bundle.
          name: preserved-package-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/preserved-package-generation
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout current publishing authority without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up declared build tools
        uses: ./.github/actions/setup-nix

      - name: Build current authority validator
        run: |
          bash scripts/dev-shell.sh \
            bash .github/scripts/prepare-current-authority-validator.sh \
              --state-dir "$RUNNER_TEMP/preservation-publish-authority-validator"

      - name: Download the inert preserved bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preserved-package-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/preserved-package-generation

      - name: Revalidate, publish, and anonymously read back every asset
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          validator_state="$RUNNER_TEMP/preservation-publish-authority-validator"
          authority_xtask="$(cat "$validator_state/xtask-path")"
          authority_cargo_home="$(cat "$validator_state/cargo-home-path")"
          bash scripts/dev-shell.sh \
            env CARGO_HOME="$authority_cargo_home" \
              bash .github/scripts/publish-durable-package-generation.sh \
                --bundle "$RUNNER_TEMP/preserved-package-generation" \
                --authority-xtask "$authority_xtask" \
                --expected-authority-sha "$GITHUB_SHA" \
                --default-ref main \
                --lock-root "$GITHUB_WORKSPACE" \
                --receipt "$RUNNER_TEMP/preserved-package-generation-receipt.json"
          tag="$(jq -r .tag "$RUNNER_TEMP/preserved-package-generation/generation.json")"
          {
            echo "## Application-sealed package closure"
            echo
            echo "- Tag: \`$tag\`"
            echo "- Producer: \`${{ inputs.package-source-sha }}\`"
            echo "- Source release: \`${{ inputs.source-tag }}\`"
            echo "- Source workflow run: \`${{ inputs.source-run-id }}\`"
            echo "- Admission: **none**"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Retain the exact publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preserved-package-generation-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preserved-package-generation-receipt.json
          if-no-files-found: error
          retention-days: 30
