[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/runtime-core",
    "crates/fork-codec",
    "crates/fork-module",
    "crates/fork-module-inject",
    "crates/kernel",
    "crates/fork-instrument",
    "crates/wasm-local-root-spill",
    "crates/host-native",
    "tools/xtask",
]

# Exclude xtask from build-std defaults used by the kernel crate.
# xtask is a host-side tool — it uses the normal std toolchain.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/brandonpayton/kandelo"
description = "A POSIX-compliant kernel for WebAssembly"

[profile.release]
lto = true
opt-level = "s"
strip = true
